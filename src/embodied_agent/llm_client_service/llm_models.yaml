# Cloud LLM model registry for llm_client_service.
# Keys under `models` are the named model identifiers passed to call_llm().
# api_key_env: name of the environment variable holding the API key (never hardcode keys here).

llm_client:
  default_timeout_sec: 60
  default_temperature: 0.1

  models:
    qwen3-vl-235b-a22b-thinking:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: ALIYUN_API_KEY
      model_id: qwen3-vl-235b-a22b-thinking
      multimodal: true

    qwen3-vl-32b-thinking:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: ALIYUN_API_KEY
      model_id: qwen3-vl-32b-thinking
      multimodal: true
    
    deepseek-v4-pro:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: ALIYUN_API_KEY
      model_id: deepseek-v4-pro
      multimodal: false

