name: pi05-ae-attn-v1
format: pi05-quant-profile-v1
status: validated
target_soc: Ascend310P3
export_device: npu
donor_device: cpu
fast_gelu: false

vlm:
  enabled: false

action_expert:
  enabled: true
  donor_dtype: fp32
  expected_selected_nodes: 72
  expected_quantized_nodes: 72
  expected_calibration_steps: 10
  quantize_convs: false
  disable_regex:
    - rotary_emb
    - 'self_attn/MatMul(_[0-9]+)?$'
    - 'mlp/(gate_proj|up_proj)/MatMul'
    - action_out_proj
  selectors:
    - name: ae_q_proj
      regex: '^/layers\.(?:[0-9]|1[0-7])/self_attn/q_proj/MatMul$'
      expected: 18
    - name: ae_k_proj
      regex: '^/layers\.(?:[0-9]|1[0-7])/self_attn/k_proj/MatMul$'
      expected: 18
    - name: ae_v_proj
      regex: '^/layers\.(?:[0-9]|1[0-7])/self_attn/v_proj/MatMul$'
      expected: 18
    - name: ae_o_proj
      regex: '^/layers\.(?:[0-9]|1[0-7])/self_attn/o_proj/MatMul$'
      expected: 18
