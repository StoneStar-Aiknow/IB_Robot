robot:
  name: franka_libero_evaluation_rtp
  type: franka
  robot_type: franka

  runtime:
    target: benchmark

  default_control_mode: model_inference

  joints:
    all: []

  # Franka LIBERO evaluation configuration, H.264/RTP variant. Use this single
  # file for all supported suites; select the suite and episodes in USER
  # SETTINGS below.
  benchmark:
    type: libero
    adapter: libero
    instance_id: libero
    identity_packages: [robosuite, mujoco, hf-libero]
    # Adapter lane limit (positive integer; omitted defaults to 1).
    # Actual lane count is evaluation.parallel.lane_count below.
    # The launch topology independently supports at most 20 lanes.
    max_lane_count: 20

    # Simulator interface settings. Most users should leave these unchanged;
    # they define the camera inputs, image size, and relative action format.
    headless: true
    camera_names:
      - agentview_image
      - robot0_eye_in_hand_image
    image_size: [256, 256]
    control_mode: relative

    # =========================================================================
    # USER SETTINGS -- select what to evaluate here.
    # Copy a value from each | separated list to the matching field below.
    #
    # suite:             libero_spatial | libero_object | libero_goal | libero_10
    # tasks:             [0] | [0, 9] | null
    # episodes_per_task: 2 | 10
    # max_steps:         600
    #
    # Task IDs are relative to the selected suite and run in the listed order.
    # Use null to run every Task in the suite. Do not use an empty list ([]).
    # episodes_per_task is the number of Episodes to run for each selected Task,
    # not a retry count. Keep max_steps at 600 for standard evaluation.
    # =========================================================================
    evaluation:
      enabled: true
      suite: libero_object
      tasks: [0]
      episodes_per_task: 2
      max_steps: 600

      # Observation transport. This profile delivers the camera observations
      # as H.264 over RTP; see the ``transport`` blocks on the image
      # observations below. For the compatible ROS/DDS path use the companion
      # configuration, which declares no transport block at all:
      #
      #   ros2 launch robot_config robot.launch.py \
      #     robot_config:=franka_libero_evaluation
      #
      # Both configurations keep the same distributed inference topology, so
      # the only difference between them is observation delivery. Everything
      # outside the transport blocks must stay identical between the two
      # files; a test asserts this.

      # Controls reproducible initial-state selection. Usually leave unchanged.
      seed: 10000

      # Parallel multi-lane evaluation: every lane is an isolated environment
      # + evaluator + edge pair, and one co-located shared cloud owner hosts
      # the single model copy. Lane RTP endpoints are materialized on loopback
      # with disjoint port ranges, so the profile-level endpoint host above
      # only matters for the single-lane two-machine route.
      parallel:
        enabled: true
        lane_count: 5
        scheduling: static
        fail_fast: true
      inference:
        # Shared PI05 passed CUDA isolation and two five-lane RTP runs at 5.
        # This is bounded benchmark validation, not a throughput guarantee.
        max_in_flight: 5
        queue_size: 64

      # Save the initial simulator state and one state after every action.
      # State files and videos can use substantial disk space; available space
      # is checked before evaluation starts.
      save_sim_states: true
      video:
        enabled: true
        camera_name: agentview_image
        fps: 30
        # false saves one MP4 per Episode; true merges a Task into one MP4.
        single_video: false

      output:
        # Parent directory for all evaluation results. ~ expands to the current
        # user's home directory. To choose another location, replace this value
        # with an absolute path such as: <ABSOLUTE_OUTPUT_DIRECTORY>
        # Each launch creates a new run directory; existing runs are not changed.
        root: ~/ibrobot_libero_outputs
        # Used as the readable suffix of each automatically generated run ID.
        # Run directories are named: <UTC_TIMESTAMP>_<SUITE>_<RUN_NAME>.
        run_name: franka_libero_evaluation_rtp
        # Save LIBERO artifacts: Episode videos, simulator states, Task
        # manifests, and native evaluation statistics.
        write_native: true
        # Save summary.json, episodes.jsonl, and run_manifest.json. Keep this
        # enabled to inspect success rates and per-Episode results.
        write_canonical: true

      timeouts:
        # Whole-run wall-clock limit from coordinator startup, including model
        # startup, all episodes and artifact finalization. Consumed only when
        # parallel is enabled with more than one lane; must be finite and > 0.
        # Increase for larger suites / more episodes (e.g. 14400.0 for 4 hours).
        run_timeout_sec: 3600.0
        # Maximum time to wait for required ROS nodes and model inference to
        # become ready. This is a startup limit, not a limit for the whole run.
        startup_timeout_sec: 120.0
        # Maximum wall-clock duration for one Episode. max_steps separately
        # limits the number of actions sent during that Episode.
        max_duration_sec: 180.0

      # Continue with later Episodes after a recoverable Episode or video
      # error. All failures are still recorded in the final reports.
      failure_policy:
        continue_recoverable_episode_errors: true
        continue_video_errors: true

      # Optional: uncomment to assign a specific run directory name. Use one
      # safe path component only. The launch fails if that directory already exists.
      # run_id: my_explicit_run_id

  # Observation interface shared by the LIBERO simulator and policy model.
  # The topics, image settings, state fields, and timing rules must match the
  # packaged model bundle. Most users should leave this section unchanged.
  #
  # RTP DEPLOYMENT NOTE -- endpoint.host below is the address the cloud
  # inference node binds to receive the stream, so it is the address of the
  # machine that runs inference. This profile is a two-machine deployment and
  # is launched exactly the way the real robot's RTP profiles are:
  #
  #   on the cloud machine (start first):
  #     ros2 launch inference_service cloud_inference.launch.py \
  #       model_path:=<MODEL_BUNDLE_DIRECTORY> deployment:=torch-cuda \
  #       robot_config_path:=<this file>
  #
  #   on the edge machine (runs LIBERO):
  #     ros2 launch robot_config robot.launch.py \
  #       robot_config:=franka_libero_evaluation_rtp
  #
  # Two terminals, two machines, one yaml -- the same shape as the real robot.
  # Declaring the transport blocks below is what makes it so: the benchmark
  # launch path co-launches a cloud inference process only for profiles that
  # declare no rtp transport (the sibling franka_libero_evaluation.yaml, which
  # is DDS and single-terminal). That rule is evaluated for the benchmark
  # runtime target only; the real-robot route is untouched by it.
  #
  # The transport blocks below declare no "readiness" section, unlike the
  # two-camera real-robot profile in lekiwi_rtp_distributed.yaml, which raises
  # max_inter_camera_skew_ms to 200. That is not an omission. The bound is
  # measured across the cameras' capture timestamps, and on the Benchmark route
  # both images of a step come from one ObservationBatch carrying a single
  # capture timestamp, so the skew is zero by construction rather than small by
  # luck. Two physical cameras have independent capture clocks and genuinely
  # need the wider bound; a simulator step does not.
  contract:
    observations:
      - key: observation.images.image
        topic: /benchmark/libero/observation/images/image
        type: sensor_msgs/msg/Image
        qos:
          reliability: reliable
          durability: transient_local
          depth: 1
        image:
          encoding: rgb8
          resize: [256, 256]
        align:
          strategy: hold
          stamp: header
          max_age_ms: 5000
        transport:
          mode: rtp
          stream_id: observation_images_image
          # BEFORE USE set this to the cloud inference host's address on your
          # network. 192.0.2.1 is a documentation placeholder (RFC 5737), the
          # same one the real-robot rtp profiles ship with. An unreachable
          # address fails silently: the sender keeps reporting a healthy
          # stream while the receiver never decodes a frame.
          # Do not use 127.0.0.1 -- that silently degrades this profile to a
          # single machine, which is exactly how the distributed route was
          # lost once before.
          endpoint: {host: 192.0.2.1, port: 55000}
          encoder_backend: auto
          # Decoding is pinned to software rather than left on "auto".
          #
          # The property this route needs is one decoded frame per access unit.
          # The Benchmark loop is closed: the next frame only exists after this
          # one is decoded, handed to the policy, and stepped through the
          # simulator. A decoder that owes one frame therefore never receives
          # the next access unit it is waiting for, and the route deadlocks.
          #
          # Measured 2026-09-19 on the cloud host, in isolation, no ROS and no
          # network:
          #   nvidia (h264_cuvid): access unit 1 -> 0 frames, unit 2 -> frame 1
          #   software:            access unit 1 -> frame 1
          # The delay lives in FFmpeg's cuvid wrapper, which never marks a
          # packet as ending a picture, so no codec flag removes it; low_delay
          # is already set and only removes the display-reorder half.
          # Latency paid: software decode of this 256x256 stream measured
          # 0.53 ms median and 0.62 ms worst case against a 50 ms step budget.
          #
          # The ascend backend has not been measured for the same delay. If it
          # turns out to be 1:1, this pin can be relaxed to a capability check.
          #
          # This is the Benchmark evaluation profile. Real-robot profiles such
          # as so101_rtp_distributed.yaml are unaffected and keep hardware
          # decoding: their cameras free-run, so the next access unit always
          # arrives regardless of what the decoder is holding.
          decoder_backend: software
          codec: h264
          # media.width and media.height are deliberately absent: they are
          # derived from image.resize above, which is the single place this
          # profile's resolution is written. Do not restate them here.
          # frame_rate_hz matches control_modes.model_inference.executor.control_frequency.
          media: {frame_rate_hz: 20, pixel_format: nv12, color_space: bt709, color_range: limited}
          h264: {profile: main, bitrate_bps: 4000000, gop_frames: 15}
      - key: observation.images.image2
        topic: /benchmark/libero/observation/images/image2
        type: sensor_msgs/msg/Image
        qos:
          reliability: reliable
          durability: transient_local
          depth: 1
        image:
          encoding: rgb8
          resize: [256, 256]
        align:
          strategy: hold
          stamp: header
          max_age_ms: 5000
        transport:
          mode: rtp
          stream_id: observation_images_image2
          # See the note on the first camera: this placeholder address must be
          # replaced before use.
          endpoint: {host: 192.0.2.1, port: 55002}
          encoder_backend: auto
          # See the note on the first camera: software decoding is required by
          # the closed Benchmark loop, not a fallback.
          decoder_backend: software
          codec: h264
          # See the note on the first camera: no width/height here.
          media: {frame_rate_hz: 20, pixel_format: nv12, color_space: bt709, color_range: limited}
          h264: {profile: main, bitrate_bps: 4000000, gop_frames: 15}
      - key: observation.state
        topic: /benchmark/libero/observation/state
        type: ibrobot_msgs/msg/StampedFloat32MultiArray
        qos:
          reliability: reliable
          durability: transient_local
          depth: 1
        selector:
          names:
            - eef_x
            - eef_y
            - eef_z
            - eef_ax
            - eef_ay
            - eef_az
            - gripper_q0
            - gripper_q1
        align:
          strategy: hold
          stamp: header
          max_age_ms: 5000
    actions:
      - key: action
        publish:
          topic: /benchmark/libero/action
          type: std_msgs/msg/Float32MultiArray
        selector:
          names:
            - delta_x
            - delta_y
            - delta_z
            - delta_ax
            - delta_ay
            - delta_az
            - gripper

  control_modes:
    model_inference:
      # MODEL SETTINGS -- replace <MODEL_BUNDLE_DIRECTORY> before running.
      # model_path must point to the packaged model directory, not directly to
      # a weight file. The directory must contain inference_manifest.json and
      # every model/runtime artifact referenced by that manifest. Use an absolute
      # path so the same configuration works from any terminal location.
      inference:
        enabled: true
        pipelines:
          policy:
            model_path: "<MODEL_BUNDLE_DIRECTORY>"
            deployment: torch-cuda
            # Fixed for this Benchmark profile so DDS/RTP compare the same
            # inference topology. RTP additionally requires it: a transport
            # block is rejected unless some pipeline is distributed.
            execution_mode: distributed
            request_timeout: 60.0
            default_task: ""
      executor:
        type: benchmark
        mode: benchmark
        inference_pipeline: policy
        queue_size: 100
        chunk_size: 100
        control_frequency: 20.0
      dispatch:
        blending: none
        scheduler: wait_for_feedback
        execution_timeout_sec: 30.0

  voice_asr:
    enabled: false

  navigation:
    enabled: false

  embodied:
    enabled: false
