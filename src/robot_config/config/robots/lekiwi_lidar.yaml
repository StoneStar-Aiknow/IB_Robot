# Unified LeKiwi MID-360 configuration. Navigation stages are resolved before builders run.
robot:
  name: lekiwi_lidar
  type: lekiwi
  robot_type: lekiwi

  default_nav_stage: navigation
  default_control_mode: teleop
  mid360_mount_file: $(find robot_config)/config/hardware/lekiwi_mid360_mount.yaml

  joints:
    base: ["7", "8", "9"]
    all: ["7", "8", "9"]

  control_modes:
    teleop:
      description: "Base control with MID-360 localization"
      description_cn: "使用 MID-360 定位的底盘控制模式"
      controllers: [joint_state_broadcaster, base_velocity_controller]
      inference:
        enabled: false
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0
    base_navigation:
      description: "Autonomous navigation with MID-360 localization"
      description_cn: "使用 MID-360 定位的自主导航模式"
      controllers: [joint_state_broadcaster, base_velocity_controller]
      inference:
        enabled: false
      executor:
        type: topic
        mode: base_navigation
        queue_size: 100
        control_frequency: 50.0

  simulation:
    platform: gazebo
    scene: null

  ros2_control:
    hardware_plugin: lekiwi_hardware/LeKiwiSystemHardware
    port: /dev/ttyACM0
    velocity_joints: ["7", "8", "9"]
    base_vel_max_rad: 4.602
    urdf_path: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro
    controllers_config: $(find lekiwi_hardware)/config/lekiwi_base_controllers.yaml
    xacro_mappings:
      base_only: true

  peripherals:
    - type: lidar
      name: mid360
      driver: livox_mid360
      frame_id: livox_frame
      lidar_ip: 192.168.1.139
      host_ip: 192.168.1.5
      pointcloud_topic: /livox/lidar
      imu_topic: /livox/imu
      user_config_path: $(find livox_ros_driver2)/config/MID360_config.json
      xfer_format: 1
      multi_topic: 0
      data_src: 0
      publish_freq: 10.0
      output_data_type: 0
      cmdline_input_bd_code: livox0000000001
      respawn: true
      scan_converter:
        enabled: true
        queue_size: 1
        pointcloud_topic: /cloud_registered_body
        scan_topic: /scan
        target_frame: body
        transform_tolerance: 0.01
        min_height: -0.05
        max_height: 0.50
        angle_min: -3.14159265
        angle_max: 3.14159265
        angle_increment: 0.00872665
        scan_time: 0.10
        range_min: 0.10
        range_max: 8.0
        use_inf: true
        inf_epsilon: 1.0
        respawn: true

  navigation:
    enabled: false
    cmd_vel_bridge:
      enabled: false
      publish_odom: true
      publish_tf: true
      wheel_radius: 0.05
      base_radius: 0.125
      max_radps: 4.602
      odom_frame: odom
      base_frame: base_link
      control_frequency: 50.0
      cmd_timeout: 0.5
      joint_states_topic: /joint_states
      odom_topic: /wheel/odom
    static_tfs: []
    fast_lio:
      enabled: false
      params_file: $(find robot_config)/config/navigation/fast_lio_mid360.yaml
      lidar_topic: /livox/lidar
      imu_topic: /livox/imu
      raw_odom_topic: /fast_lio/odometry_raw
      output_topic: /odometry/filtered
      source_odom_frame: camera_init
      source_body_frame: body
      odom_frame: odom
      base_frame: base_link
      publish_tf: true
      planar_output: false
      max_future_skew_sec: 0.1
      respawn: true
    nav2_bringup:
      enabled: false
      use_amcl: false
      map_file: $(env HOME)/.ros/ibrobot/maps/map.yaml
      params_file: $(find robot_navigation)/config/nav2_params.yaml
    slam_toolbox:
      enabled: false
      executable: async_slam_toolbox_node
      node_name: slam_toolbox
      scan_topic: /scan
      base_frame: base_link
      odom_frame: odom
      map_frame: map
      minimum_travel_distance: 0.05
      minimum_travel_heading: 0.05
      map_update_interval: 1.0
      min_laser_range: 0.10
      max_laser_range: 8.0

  nav_stages:
    mapping:
      navigation:
        enabled: true
        fast_lio:
          enabled: true
          planar_output: false
        slam_toolbox:
          enabled: true
        nav2_bringup:
          enabled: false
          use_amcl: false
          dyn_avoid_enabled: false
        cmd_vel_bridge:
          enabled: true
          publish_odom: false
          publish_tf: false
          cmd_vel_topic: /cmd_vel
    navigation:
      default_control_mode: base_navigation
      skill_required_control_mode: base_navigation
      embodied:
        enabled: false
        entry_mode: hermes
        skill_catalog_source_mode: development
        skill_catalog_source_root: src/skill_catalog
        skill_catalog_profile: lekiwi_lidar
        skill_action_name: /embodied/execute_skill
        primitive_action_name: /embodied/execute_primitive
        validate_skill_service: /embodied/validate_skill
        validate_primitive_service: /embodied/validate_primitive
        skill_gateway_status_service: /embodied/get_skill_gateway_status
        timeouts:
          task_budget_sec: 360.0
          default_skill_timeout_sec: 300.0
          robot_state_freshness_sec: 0.5
          scene_freshness_sec: 0.5
          model_idle_timeout_sec: 120.0
          rpc_timeout_sec: 15.0
          gripper_settle_sec: 1.5
      navigation:
        enabled: true
        fast_lio:
          enabled: true
          planar_output: true
        slam_toolbox:
          enabled: false
        nav2_bringup:
          enabled: true
          use_amcl: true
          auto_global_localization: true
          dyn_avoid_enabled: true
        command_server:
          enabled: true
          action_name: /navigation/execute
          cancel_service_name: /navigation/cancel_current
          nav2_action_name: /navigate_to_pose
          nav2_result_timeout: 300.0
          stop_velocity_topic: /cmd_vel_safe
          cancel_response_timeout: 2.0
        cmd_vel_bridge:
          enabled: true
          publish_odom: false
          publish_tf: false
          cmd_vel_topic: /cmd_vel_safe
