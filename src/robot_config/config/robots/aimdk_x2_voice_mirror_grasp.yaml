# Canonical voice, mirror and grasp entry recovered from the left-hand 310P deployment.
robot:
  base_config: aimdk_x2_voice_mirror_all.yaml
  name: aimdk_x2_voice_mirror_grasp
  motion_imitation_stream:
    pause_during_manipulation: true
    enabled: true
    pause_during_robot_motion: true
  skill_supported_control_modes:
  - model_inference
  - moveit_planning
  - named_motion
  task_poses:
    file: ../task_poses/x2_voice_mirror_grasp_approved.yaml
    hands: installed
  pose_composer:
    enabled: true
    mode: fixed
    fixed_library: $(env WORKSPACE)/commissioning/fixed_poses_voice_mirror_grasp.json
    interfaces:
      trajectory:
        interface: joint.trajectory_arm
        kind: action
        type: control_msgs/action/FollowJointTrajectory
      status:
        interface: runtime.get_status
        kind: service
        type: ibrobot_msgs/srv/GetRuntimeStatus
    memory:
      enabled: false
    path_validation:
      hand: 'off'
      body: 'off'
    blocked_task_poses: []
    display_completion:
      pose_ids:
      - arms_forward
      - arms_up
      - arms_out
      - arms_v
      - flex
      - surrender
      - right_forward
      - left_forward
      mode: playback_only
  arm_limits:
    left_shoulder_pitch_joint:
    - -3.08
    - 2.04
    left_shoulder_roll_joint:
    - -0.061
    - 2.993
    left_shoulder_yaw_joint:
    - -2.556
    - 2.556
    left_elbow_joint:
    - -2.3556
    - 0.0
    left_wrist_yaw_joint:
    - -2.556
    - 2.556
    left_wrist_pitch_joint:
    - -0.558
    - 0.558
    left_wrist_roll_joint:
    - -1.571
    - 0.724
    right_shoulder_pitch_joint:
    - -3.08
    - 2.04
    right_shoulder_roll_joint:
    - -2.993
    - 0.061
    right_shoulder_yaw_joint:
    - -2.556
    - 2.556
    right_elbow_joint:
    - -2.3556
    - 0.0
    right_wrist_yaw_joint:
    - -2.556
    - 2.556
    right_wrist_pitch_joint:
    - -0.558
    - 0.558
    right_wrist_roll_joint:
    - -0.724
    - 1.571
  control_modes:
    named_motion:
      runtime_mode: policy_stream
      inference:
        enabled: false
      executor:
        enabled: false
    moveit_planning:
      description: Pick and place pipelines stream the configured arm and hand
      description_cn: 抓取和放置流水线流式控制配置的机械臂和灵巧手
      runtime_mode: policy_stream
      inference:
        enabled: false
      executor:
        enabled: false
  perception_services:
    services:
      __append__:
      - id: grasp_grounding
        enabled: true
        required: true
        bundle_path: models/grounding_dino_swint_seq8_1280x720
        deployment: ascend_310p
        adapter_class: perception_service.model_service_plugins:GroundingDINORawDetectPlugin
        service_type: ibrobot_msgs/srv/GroundingDetect
        endpoint: /perception/grasp/grounding_detect
        node_name: grasp_grounding_detect
        runtime_options:
          device_id: 0
      - id: grasp_segmentation
        enabled: true
        required: true
        bundle_path: models/sam2.1_hiera_tiny_prompt_ascend
        deployment: ascend_310p
        adapter_class: perception_service.model_service_plugins:SegmentDetectionsPlugin
        service_type: ibrobot_msgs/srv/SegmentDetections
        endpoint: /perception/grasp/segment_detections
        node_name: grasp_segment_detections
        runtime_options:
          device_id: 0
      - id: grasp_generation
        enabled: true
        required: true
        bundle_path: models/graspgenx_omnihand_left_x2
        deployment: torch_npu
        adapter_class: perception_service.model_service_plugins:GraspGenXGenerateGraspsPlugin
        service_type: ibrobot_msgs/srv/GenerateGrasps
        endpoint: /perception/grasp/generate_grasps
        node_name: grasp_generate_grasps
  grasp_execution:
    enabled: true
    action_name: /manipulation/execute_pick
    backend: aimdk_grasp.remote_head:x2_remote_grasp_backends
    held_lease_s: 30.0
    model_deployment: torch_npu
    model_bundle_path: $(env WORKSPACE)/models/graspgenx_omnihand_left_x2
    command_interfaces:
    - joint.arm_stream
    - joint.hand_stream
    backend_options:
      installed_hands:
      - left
      arm_side: left
      place:
        plan_return_home: false
      planning:
        approach_over_height_m: 0.18
        approach_order_m:
        - 0.1
        - 0.15
        - 0.07
        - 0.05
        carry_lift_m: 0.15
      detect_service: /perception/grasp/grounding_detect
      generate_grasps_service: /perception/grasp/generate_grasps
      segment_service: /perception/grasp/segment_detections
      watch: stop
      watch_frame_timeout_s: 1.0
      watch_unknown_timeout_s: 4.0
      watch_occluded_timeout_s: 8.0
      watch_image_age_s: 0.5
      head:
        namespace: /x2_grasp_head
        status_timeout_s: 1.0
        cpu_isolation:
          node: 4-7
          others: 1-3
    pipeline:
      release_after_success: true
      max_attempts: 3
      max_regrasps: 1
      execute_reserve_s: 50.0
      prefetch_preshape: true
      prefetch_perception: true
      # No complete path among the candidates and the arm has not moved: draw new
      # GraspGen-X candidates on the same capture instead of capturing again.
      resample_retries: true
  placement_execution:
    enabled: true
    executor: placement_pipeline
    required_args:
    - target_name
    - container_name
    action_name: /manipulation/execute_place
    backend: aimdk_grasp.remote_head:x2_remote_place_backends
    perception:
      box_threshold: 0.5
      scene_pixel_stride: 2
    pipeline:
      max_attempts: 2
      verify_placement: false
  voice_asr:
    bundle_path: models/voice_asr/sherpa-onnx-x-asr-480ms-streaming-zipformer-transducer-zh-en-int8-2026-06-05
    deployment: torch_cpu
    hotwords_file: ''
    external_finalize_on_idle: true
    speaker_embedding:
      enabled: true
      bundle_path: models/campplus-speaker
      deployment: torch_cpu
      min_speech_seconds: 1.0
      max_speech_seconds: 6.0
      idle_timeout_sec: 1.2
      window_hop_seconds: 1.0
    input_mode: shared_audio
    active_mode: continuous
    audio_input:
      interface: audio.capture
      type: audio_common_msgs/msg/AudioDataStamped
    vad_bundle_path: models/silero-vad
    vad_deployment: torch_cpu
    audio_input_channel: 0
  embodied:
    skill_catalog_profile: aimdk_x2_voice_mirror_grasp
    agent:
      planner:
        base_url: http://10.42.0.233:8080/v1
        model: qwen3.8-flash-next-iq3_s
        api_key_env: X2_PLANNER_API_KEY
        enable_thinking: false
        return_after_place: grasp_ready
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
        fruit_delivery:
          container_name: a black bowl
          container_label: 黑色的碗
        deployment_facts:
        - 机器人的名字是欧拉，和操作系统 openEuler 同音。
        - 这里是 OpenEuler Summit 操作系统大会，地点是北京中关村国际创新中心。
        - IB-Robot 的全称是 Intelligence BooM Robot。
        - 本次展示的是 openEuler 开源社区开发的软件；软件开源，可以下载，运行在很多机器人本体上。机器人本体由社区伙伴提供，不要说成是本体的制造商，也不要说是华为团队开发的。
        - 第一次问价格：展示的是开源软件，可以扫旁边的代码仓库二维码了解；追问本体价格：本体是社区伙伴提供的，具体多少钱我们也不清楚。
        - 代码仓库：扫旁边的二维码。
        - 机器人基于 openEuler 开发（openEuler Embedded），openEuler 是基于 Linux 的发行版；芯片是昇腾 310P。
        - 照镜子：通过头部摄像头识别人体姿态，实时跟随手臂动作，只学手臂，学不了腿；体验中会自动留图，结束后自己选。
        - 礼物：柠檬、苹果、橙子三选一，礼物藏在水果里；每次有效唤醒欧拉欧拉开始新领取轮次，每轮送一份，重新唤醒可以再领；水果放进碗里，顺着滑道滑到领取盒，由参观者自己拿；不能扔，不能递到手里；没确认送到之前先别取。
        - 现场的水果是道具，不能吃。
        - 机器人主要说中文。
        - 安全：不做不会伤害人这类保证，请按现场提示互动。
        - 机器人没有接入日期、时间和天气查询：回答暂时查不到，不说没联网。
        - 机器人没有生日，也没有星座；不要用自我介绍代替这个回答。
        - 防水能力和防护等级没有厂商确认资料，明确说不清楚，请勿让机器人碰水。
        - 身体接触（拥抱、触摸、亲吻、握手、搀扶）出于安全暂不支持：直接说明，不得用飞吻、挥手或其他动作代替；访客明确要飞吻、挥手时照常做。
        clarification_lines:
          not_heard: 啊？没听清，玩模仿还是选水果呀？
          fruit_name: 要柠檬、苹果还是橙子呀？
          confirm_pick: 可以呀，现在就给你拿吗？
          recommend: 每个都有礼物哦，要我帮你挑吗？
        answer_rules:
