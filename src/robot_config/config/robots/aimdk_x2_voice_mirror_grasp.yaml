# AgiBot X2: voice, gestures, mirror and the pick-to-place workflow.
#
# Layered on aimdk_x2_voice_mirror_all for the voice agent, gestures, and mirror.
# This profile maps gestures, grasp, placement, and mirror to the shared
# policy_stream, and enables the perception services and the pick/place
# delegated executors connected to the Orin's grasp head.
#
# This profile requires the three grasp model bundles on the 310P and the grasp
# head on the Orin. Keep the models, Orin head, and robot preparation available
# whenever this configuration is launched. This is the shared entry point on
# both hosts; change the mounting settings below instead of copying this file.
robot:
  base_config: aimdk_x2_voice_mirror_all.yaml
  name: aimdk_x2_voice_mirror_grasp

  # Release the mirror camera reader and stop new HRI model requests during pick/place.
  # The grasp head's RGB-D capture and safety checks remain active.
  motion_imitation_stream:
    pause_during_manipulation: true

  # pick_object declares moveit_planning. The catalog compiler only compiles the
  # modes a deployment lists here, so without it the skill is silently dropped
  # rather than mis-bound.
  skill_supported_control_modes:
    - named_motion
    - model_inference
    - moveit_planning

  # Table-side grasp_ready: hardware approval remains false in the example file.
  task_poses:
    file: ../task_poses/x2_example.yaml
    # Resolve open-hand requests from the explicit mounting declaration below.
    # The same source poses support one or both hands without editing their angles.
    hands: installed
  pose_composer:
    enabled: true
    # The 310P executes compiled targets without a MuJoCo installation. Compile
    # this deployment asset with pose_compile_library --robot-config <this file>.
    mode: fixed
    fixed_library: "$(env WORKSPACE)/commissioning/fixed_poses.json"
    interfaces:
      trajectory:
        interface: joint.trajectory_arm
        kind: action
        type: control_msgs/action/FollowJointTrajectory
      status:
        interface: runtime.get_status
        kind: service
        type: ibrobot_msgs/srv/GetRuntimeStatus
    memory:
      enabled: false
    path_validation:
      # Commissioning policy: retain entry/endpoint checks, skip full-path checks.
      hand: "off"
      body: "off"

  # MC-enforced travel, shared by the fixed compiler and the grasp backend.
  # Matches aimdk_x2_grasp and the inherited mirror playback limits.
  arm_limits:
    left_shoulder_pitch_joint: [-3.0800, 2.0400]
    left_shoulder_roll_joint: [-0.0610, 2.9930]
    left_shoulder_yaw_joint: [-2.5560, 2.5560]
    left_elbow_joint: [-2.3556, 0.0000]
    left_wrist_yaw_joint: [-2.5560, 2.5560]
    left_wrist_pitch_joint: [-0.5580, 0.5580]
    left_wrist_roll_joint: [-1.5710, 0.7240]
    right_shoulder_pitch_joint: [-3.0800, 2.0400]
    right_shoulder_roll_joint: [-2.9930, 0.0610]
    right_shoulder_yaw_joint: [-2.5560, 2.5560]
    right_elbow_joint: [-2.3556, 0.0000]
    right_wrist_yaw_joint: [-2.5560, 2.5560]
    right_wrist_pitch_joint: [-0.5580, 0.5580]
    right_wrist_roll_joint: [-0.7240, 1.5710]

  control_modes:
    # Gestures, grasp, placement, and mirror share the vendor's upper-body stream
    # so sequential skills do not switch between incompatible vendor modes.
    named_motion:
      runtime_mode: policy_stream
      inference:
        enabled: false
      executor:
        enabled: false
    # The pick and place pipelines stream the configured arm and hand through
    # their delegated executors, so the control-mode executor stays off. They and
    # the mirror all use policy_stream and must not run concurrently.
    moveit_planning:
      description: "Pick and place pipelines stream the configured arm and hand"
      description_cn: "抓取和放置流水线流式控制配置的机械臂和灵巧手"
      runtime_mode: policy_stream
      inference:
        enabled: false
      executor:
        enabled: false

  # __append__ keeps the mirror's own services (yolox, pear): robot overlays
  # append to a list instead of replacing it.
  perception_services:
    services:
      __append__:
        # GroundingDINO returns boxes for a text prompt; SAM2 turns each box into
        # a mask; GraspGen-X proposes grasps on the masked cloud. All three are
        # required by the always-enabled grasp pipeline.
        - id: grasp_grounding
          enabled: true
          required: true
          bundle_path: models/grounding_dino_swint_seq8_1280x720
          deployment: ascend_310p
          adapter_class: perception_service.model_service_plugins:GroundingDINORawDetectPlugin
          service_type: ibrobot_msgs/srv/GroundingDetect
          endpoint: /perception/grasp/grounding_detect
          node_name: grasp_grounding_detect
          runtime_options:
            device_id: 0
        - id: grasp_segmentation
          enabled: true
          required: true
          bundle_path: models/sam2.1_hiera_tiny_prompt_ascend
          deployment: ascend_310p
          adapter_class: perception_service.model_service_plugins:SegmentDetectionsPlugin
          service_type: ibrobot_msgs/srv/SegmentDetections
          endpoint: /perception/grasp/segment_detections
          node_name: grasp_segment_detections
          runtime_options:
            device_id: 0
        - id: grasp_generation
          enabled: true
          required: true
          bundle_path: models/graspgenx_omnihand_left_x2
          # torch_npu, unlike the two above: the compiled 400-grasp diffusion
          # loop runs on the NPU and its gripper description is what the planner
          # mounts on the left palm.
          deployment: torch_npu
          adapter_class: perception_service.model_service_plugins:GraspGenXGenerateGraspsPlugin
          service_type: ibrobot_msgs/srv/GenerateGrasps
          endpoint: /perception/grasp/generate_grasps
          node_name: grasp_generate_grasps

  grasp_execution:
    enabled: true
    action_name: /manipulation/execute_pick
    # Only compressed captures, masks, candidates, plans and the watch's status
    # cross to the Orin; the vendor forbids subscribing raw camera streams
    # across compute units.
    backend: "aimdk_grasp.remote_head:x2_remote_grasp_backends"
    held_lease_s: 30.0
    model_deployment: torch_npu
    model_bundle_path: "$(env WORKSPACE)/models/graspgenx_omnihand_left_x2"
    command_interfaces:
      - joint.arm_stream
      - joint.hand_stream
    backend_options:
      # Current hardware: right hand mounted, left hand removed (both arms remain).
      # Two hands: installed_hands: [left, right], arm_side: auto.
      # Left hand only: installed_hands: [left], arm_side: left.
      # Keep this block identical on the 310P and Orin. Recompile the fixed
      # artifact after changing mounting or task poses; their digest is frozen.
      installed_hands: [right]
      arm_side: right
      planning:
        approach_over_height_m: 0.18
        approach_order_m: [0.10, 0.15, 0.07, 0.05]
        carry_lift_m: 0.15
      detect_service: /perception/grasp/grounding_detect
      generate_grasps_service: /perception/grasp/generate_grasps
      segment_service: /perception/grasp/segment_detections
      # Halt the approach when the target moves, and replan once it is back.
      watch: stop
      # Measured on the robot (123 armed executions): frames every 0.21 s,
      # p99 0.47 s; the hand hid the target for up to 2.62 s at the end of the
      # grasp segment, so the timeout is well above the median gap.
      watch_frame_timeout_s: 1.0
      watch_unknown_timeout_s: 4.0
      watch_image_age_s: 0.5
      head:
        namespace: /x2_grasp_head
        status_timeout_s: 1.0
        cpu_isolation:
          node: "4-7"
          others: "1-3"
    pipeline:
      release_after_success: true
      max_attempts: 3
      max_regrasps: 1
      execute_reserve_s: 50.0

  placement_execution:
    enabled: true
    executor: placement_pipeline
    required_args: [target_name, container_name]
    action_name: /manipulation/execute_place
    backend: "aimdk_grasp.remote_head:x2_remote_place_backends"
    perception:
      # Candidate supported by the saved basket/table detection comparison.
      box_threshold: 0.50
    pipeline:
      max_attempts: 2

  # Local Oula text wake is enabled; speaker checking stays off by default.
  voice_asr:
    # X-ASR is the model used by this combined deployment. It does not support
    # the domain hotwords inherited from the older voice-only entry.
    bundle_path: models/voice_asr/sherpa-onnx-x-asr-480ms-streaming-zipformer-transducer-zh-en-int8-2026-06-05
    deployment: torch_cpu
    hotwords_file: ""
    external_finalize_on_idle: true
    speaker_embedding:
      enabled: false
      bundle_path: models/campplus-speaker
      deployment: torch_cpu
      min_speech_seconds: 1.0
      max_speech_seconds: 6.0
      idle_timeout_sec: 1.2

  embodied:
    # The profile exposes pick_object and place_in_container together with the
    # delegated executors registered by grasp_execution and placement_execution.
    skill_catalog_profile: aimdk_x2_voice_mirror_grasp
    agent:
      # Override the address with planner_base_url at launch on another bench.
      planner:
        base_url: http://10.42.0.233:8080/v1
        model: qwen3.8-flash-next-iq3_s
        api_key_env: X2_PLANNER_API_KEY
        enable_thinking: false
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
      voice_bridge:
        addressee_trigger: wake_phrase
        # Remove wake_phrases to accept speech without a wake prefix.
        # Speaker checks require both speaker flags, CAMPPlus, and a verified
        # continuous vendor speech stream.
        # Exact ASR prefixes: pairs of 欧拉 / 欧啦 / 鸥拉 / 偶拉.
        wake_phrases:
          - 欧拉欧拉
          - 欧拉欧啦
          - 欧拉鸥拉
          - 欧拉偶拉
          - 欧啦欧拉
          - 欧啦欧啦
          - 欧啦鸥拉
          - 欧啦偶拉
          - 鸥拉欧拉
          - 鸥拉欧啦
          - 鸥拉鸥拉
          - 鸥拉偶拉
          - 偶拉欧拉
          - 偶拉欧啦
          - 偶拉鸥拉
          - 偶拉偶拉
        wake_window_sec: 60.0
        speaker_check_enabled: false
        speaker_min_similarity: 0.60
        speaker_merge_margin: 0.10
        speaker_max_age_sec: 6.0
        speaker_reject_short: true
        measurement_grace_sec: 1.5
      test_allowlist:
        - wave_hand
        - handshake
        - raise_hand
        - blow_kiss
        - clap_hands
        - mirror_start
        - mirror_stop
        - self_introduction
        - pick_object
        - free_pose
        - return_to_task_pose
        - place_in_container
    runtime_play_audio:
      clips:
        self_intro: "$(env WORKSPACE)/commissioning/audio/self_introduction.wav"

  # The Agent owns spoken interaction, so the mirror's own phrases stay off. The
  # physical triggers (double cover, long cover, head touch, the session timeout)
  # are the operator's, inherited from aimdk_x2_voice_mirror_all.yaml.
  mirror_session:
    voice:
      enabled: false

# Runtime prerequisites for pick_object: the model bundles configured above
# must be installed on the 310P, and the matching grasp head must run on the
# Orin. Before each request, put the platform in URS. The task preparation
# stage moves both arms to grasp_ready and opens the installed hands before perception.
# The packaged table-side pose remains unapproved for hardware; provide a locally
# calibrated and approved task pose file before hardware deployment.
# Grasp executor HOME and mirror reset are independent of grasp_ready.
# A changed hand shape can rebuild the cuRobo planner on the Orin (~50 s)
# and consume the request budget.
#
# Stop the mirror session before a pick. Pick/place and mirror share
# policy_stream, so mode switching alone does not arbitrate concurrent arm
# commands. Adjacent pick/place steps retain custody until placement releases
# the object; a standalone pick keeps its normal put-back behavior.

  # feat/x2-cbf-safety
  # Grasp and mirror share policy_stream + joint.arm_stream without arm_owner.
  # The data plane cannot distinguish them, so this profile must not inherit CBF.
  cbf_safety:
    enabled: false
  # /feat/x2-cbf-safety
