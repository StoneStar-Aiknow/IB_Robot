robot:
  base_config: lekiwi_nav_grasp
  name: lekiwi_lidar
  voice_asr:
    enabled: true
    active_mode: continuous
    language: zh
    bundle_path: models/voice_asr/sherpa-onnx-x-asr-480ms-streaming-zipformer-transducer-zh-en-int8-2026-06-05
    deployment: ascend_310p
    publish_partial: true
    output_topic: /voice_command
    sample_rate: 16000
    chunk_size: 512
    # ASR 和 VAD 都使用 ch1；该通道在蓝牙回放和离线解码中识别最稳定。
    audio_input_channel: 1
    vad_input_channel: 1
    exit_on_init_failure: true
    # Streaming input bound to the runtime's audio.capture (respeaker via the
    # lekiwi_robot peripheral list); the topic and 6-ch/16 kHz format come
    # from the interface.
    audio_input:
      interface: audio.capture
      type: audio_common_msgs/msg/AudioDataStamped
  speech_direction:
    enabled: true
    profile: ascend_310p
    microphone: respeaker
    audio_input:
      interface: audio.capture
      type: audio_common_msgs/msg/AudioDataStamped
    parameters:
      mount_yaw_deg: 90.0
  voice_tts:
    enabled: false
  nav_stages:
    # voice_tts is off on this deployment: the inherited grasp/mapping stage
    # name lists would otherwise launch the base config's speaker (audio
    # devices launch when declared; navigation/hybrid already exclude it).
    grasp:
      peripheral_names: [respeaker, wrist]
    mapping:
      peripheral_names: [respeaker, front, mid360]
    navigation:
      peripheral_names: [respeaker, mid360]
      sensor_calibration:
        artifacts:
          base_to_front_camera: ""
      embodied:
        enabled: true
        skill_catalog_source_mode: development
        skill_catalog_profile: lekiwi_lidar_sound_following
        imitate_human_motion:
          enabled: false
        idle_behaviors:
          sound_orientation:
            enabled: true
            mode: periodic
            default_active: false
            periodic_interval_sec: 10.0
            trigger_phrases: ["转向我"]
            direction_topic: /voice/speech_direction
            command_topic: /voice_command
            skill_name: nav_turn
            direction_frame: base_link
            deadband_deg: 15.0
            max_direction_age_sec: 12.0
            direction_wait_sec: 30.0
            cooldown_sec: 2.0
            max_turn_deg: 180.0
            turn_timeout_sec: 30.0
            action_acceptance_timeout_sec: 2.0
            status_retry_sec: 0.5
            reset_status_max_age_sec: 2.0

    hybrid:
      peripheral_names: [respeaker, mid360]
      sensor_calibration:
        artifacts:
          base_to_front_camera: ""
      semantic_mapping:
        enabled: false
        query_only: false
      perception_services:
        services: []
      grasp_execution:
        enabled: false
      placement_execution:
        enabled: false
      embodied:
        enabled: true
        skill_catalog_source_mode: development
        skill_catalog_profile: lekiwi_lidar_sound_following
        imitate_human_motion:
          enabled: false
        idle_behaviors:
          sound_orientation:
            enabled: true
            mode: periodic
            default_active: false
            periodic_interval_sec: 10.0
            trigger_phrases: ["转向我"]
            direction_topic: /voice/speech_direction
            command_topic: /voice_command
            skill_name: nav_turn
            direction_frame: base_link
            deadband_deg: 15.0
            max_direction_age_sec: 12.0
            direction_wait_sec: 30.0
            cooldown_sec: 2.0
            max_turn_deg: 180.0
            turn_timeout_sec: 30.0
            action_acceptance_timeout_sec: 2.0
            status_retry_sec: 0.5
            reset_status_max_age_sec: 2.0
