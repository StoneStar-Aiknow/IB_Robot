# Sensor calibration profile with manual base teleoperation for the current LeKiwi installation.
# This profile intentionally uses the ROS installation's realsense2_camera package.
robot:
  name: lekiwi_sensor_calib
  type: lekiwi
  robot_type: lekiwi

  default_control_mode: teleop
  mid360_mount_file: $(find robot_config)/config/hardware/lekiwi_mid360_mount.yaml

  sensor_calibration:
    artifacts:
      base_to_front_camera: ~/.ros/ibrobot/calib/current/base_to_front_camera.yaml

  joints:
    base: ["7", "8", "9"]
    all: ["7", "8", "9"]

  control_modes:
    teleop:
      description: "Sensor calibration profile with manual base teleoperation"
      description_cn: "支持手动底盘遥操作的传感器标定配置"
      controllers:
        - joint_state_broadcaster
        - base_velocity_controller
      inference:
        enabled: false
        force_disable: true
      executor:
        type: topic
        mode: teleop
        queue_size: 10
        control_frequency: 10.0

  simulation:
    platform: gazebo
    scene: null

  ros2_control:
    hardware_plugin: lekiwi_hardware/LeKiwiSystemHardware
    port: /dev/ttyACM0
    velocity_joints: ["7", "8", "9"]
    base_vel_max_rad: 4.602
    urdf_path: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro
    controllers_config: $(find lekiwi_hardware)/config/lekiwi_base_controllers.yaml
    xacro_mappings:
      base_only: true

  peripherals:
    - type: lidar
      name: mid360
      driver: livox_mid360
      frame_id: livox_frame
      lidar_ip: 192.168.1.139
      host_ip: 192.168.1.5
      pointcloud_topic: /livox/lidar
      imu_topic: /livox/imu
      user_config_path: $(find livox_ros_driver2)/config/MID360_config.json
      xfer_format: 1
      multi_topic: 0
      data_src: 0
      publish_freq: 10.0
      output_data_type: 0
      cmdline_input_bd_code: livox0000000001
      respawn: true

    - type: camera
      name: front
      driver: realsense
      driver_camera_name: front
      serial_number: ""
      width: 640
      height: 480
      fps: 30
      streams: [color, depth]
      align_depth: false
      enable_sync: false
      initial_reset: false
      enable_pointcloud: false
      frame_id: camera_front_link
      optical_frame_id: camera_front_optical_frame
      transform:
        parent_frame: base_link
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

  navigation:
    enabled: true
    nav2_bringup:
      enabled: false
    slam_toolbox:
      enabled: false
    cmd_vel_bridge:
      enabled: true
      wheel_radius: 0.05
      base_radius: 0.125
      max_radps: 4.602
      publish_tf: false
      publish_odom: false
      control_frequency: 50.0
      cmd_timeout: 0.5
      cmd_vel_topic: /cmd_vel
      joint_states_topic: /joint_states
      odom_topic: /odom
    fast_lio:
      enabled: true
      params_file: $(find robot_config)/config/navigation/fast_lio_mid360.yaml
      lidar_topic: /livox/lidar
      imu_topic: /livox/imu
      raw_odom_topic: /fast_lio/odometry_raw
      output_topic: /odometry/filtered
      source_odom_frame: camera_init
      source_body_frame: body
      odom_frame: odom
      base_frame: base_link
      publish_tf: true
      planar_output: false
      respawn: true

  recording:
    enabled: false
