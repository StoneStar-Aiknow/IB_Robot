# AgiBot X2: ibrobot_agent voice loop with offline speech output.
#
# Layers on aimdk_x2_voice (X-ASR on the runtime's segmented speech) and adds:
# - ZipVoice on Ascend 310P for speech synthesis. The platform's own speech
#   output (/speech/speak -> vendor PlayTts) depends on the vendor cloud and
#   fails offline with ERROR_NETWORK_DISCONNECTED, so Agent replies do not use it.
# - Playback through the runtime's audio.play interface: the runtime holds the
#   speaker's audio focus and forwards PCM to the vendor HAL. The playback
#   topic and format (16 kHz mono) come from that interface binding, so the
#   24 kHz ZipVoice output is resampled by the playback node.
# - The ibrobot_agent entry, with agent_voice_bridge speaking the replies.
#
# Every node here runs on the 310P compute pack: agent_voice_bridge hands
# /voice_tts/play a WAV path on its own host, so it must share a host with
# voice_tts_audio_player. The planner is a LAN-hosted OpenAI-compatible model.
# Execution is enabled: planned gestures run on the robot once motion is
# authorized at launch (authorize_motion:=true); /runtime/stop interrupts.
robot:
  base_config: aimdk_x2_voice.yaml
  # Not renamed: the skill catalog validates the robot context name against the
  # catalog profile's robot_name (pinned in skill_catalog's profile tests).

  voice_tts:
    enabled: true
    # The TTS launch builder has no bundle_path fallback, so it is stated here
    # (same bundle as lekiwi_nav_grasp); relative to WORKSPACE.
    bundle_path: "models/zipvoice"
    deployment: ascend_310p
    # ZipVoice synthesizes 24 kHz; the runtime speaker takes 16 kHz.
    resample_to_playback_rate: true
    audio_output:
      interface: audio.play
      type: audio_common_msgs/msg/AudioDataStamped
      requires:
        capability: interaction.audio_playback
    # The X2 runtime subscribes to AudioDataStamped on audio.play.
    audio_message_type: audio_common_msgs/msg/AudioDataStamped

  embodied:
    entry_mode: agent
    agent:
      enabled: true
      incubation: true
      execution_enabled: true
      # Covers a spoken plan presentation plus the gesture it introduces.
      presentation_timeout_sec: 600.0
      channel_id: voice_asr
      principal_id: local_operator
      test_allowlist:
        - wave_hand
        - handshake
        - raise_hand
        - blow_kiss
        - clap_hands
      ledger_path: /tmp/ibrobot-agent-x2-voice/requests.sqlite3
      conversation_path: /tmp/ibrobot-agent-x2-voice/conversation.sqlite3
      deployment_lock_path: /tmp/ibrobot-agent-x2-voice/agent.lock
      planner:
        mode: vlm
        provider: openai_compatible
        base_url: http://192.168.3.16:18094/v1
        model: qwen3.8-27b
        timeout_sec: 120.0
      voice_bridge:
        enabled: true
        confirm_mode: auto
        # One ZipVoice segment (up to 200 characters) plays for 40-50 s, plus the
        # runtime's focus buffering; the 60 s node default leaves too little margin.
        tts_timeout_sec: 90.0
        mute_asr_during_tts: true
