# SO-101 Single Arm with RTP distributed inference to remote Ascend 310B.
# Overlay of the so101_single_arm provider configuration (openspec change
# so101-gazebo-runtime-transport D10): only the application deltas are
# declared here - RTP H.264 camera observation transport, distributed
# inference on the remote Ascend 310B, the disabled front camera (D8 toggle
# pattern), the Gazebo pick_banana scene, and the teleop/embodied values
# that genuinely differ. The robot name and the skill-catalog profile stay
# so101_rtp_distributed; runtime-owned hardware, controllers, motion and
# camera definitions live in the so101_robot runtime profile.
robot:
  name: so101_rtp_distributed
  base_config: so101_single_arm
  gazebo_world_name: demo
  gazebo_gui:
    qt_platform: xcb
    libgl_always_software: true
  simulation:
    platform: gazebo
    scene: pick_banana
    robot_spawn:
      x: 0.0
      y: 0.3
      z: -0.03
    sim_models_pkg: sim_models
  peripherals:
  - name: front
    type: camera
    disabled: true
  contract:
    observations:
    - key: observation.images.top
      topic: /camera/top/image_raw
      type: sensor_msgs/msg/Image
      peripheral: top
      image:
        resize:
        - 480
        - 640
        encoding: rgb8
      align:
        strategy: hold
        stamp: header
        tol_ms: 1500
        max_age_ms: 500
      qos:
        reliability: best_effort
        history: keep_last
        depth: 10
      transport:
        mode: rtp
        stream_id: top
        endpoint:
          host: 192.168.136.127
          port: 5004
        encoder_backend: software
        decoder_backend: ascend
        codec: h264
        media:
          width: 640
          height: 480
          frame_rate_hz: 30
          pixel_format: nv12
          color_space: bt709
          color_range: limited
        h264:
          profile: main
          bitrate_bps: 4000000
          gop_frames: 15
    - key: observation.images.wrist
      topic: /camera/wrist/image_raw
      type: sensor_msgs/msg/Image
      peripheral: wrist
      image:
        resize:
        - 480
        - 640
        encoding: rgb8
      align:
        strategy: hold
        stamp: header
        tol_ms: 1500
        max_age_ms: 500
      qos:
        reliability: best_effort
        history: keep_last
        depth: 10
      transport:
        mode: rtp
        stream_id: wrist
        endpoint:
          host: 192.168.136.127
          port: 5006
        encoder_backend: software
        decoder_backend: ascend
        codec: h264
        media:
          width: 640
          height: 480
          frame_rate_hz: 30
          pixel_format: nv12
          color_space: bt709
          color_range: limited
        h264:
          profile: main
          bitrate_bps: 4000000
          gop_frames: 15
    - key: observation.state
      topic: /joint_states
      type: sensor_msgs/msg/JointState
      selector:
        names:
        - position.1
        - position.2
        - position.3
        - position.4
        - position.5
        - position.6
      align:
        strategy: hold
        stamp: header
        tol_ms: 1500
        max_age_ms: 500
      qos:
        reliability: best_effort
        history: keep_last
        depth: 50
    - key: observation.current
      topic: /so101_follower/joint_currents
      type: ibrobot_msgs/msg/JointCurrent
      selector:
        names:
        - current.1
        - current.2
        - current.3
        - current.4
        - current.5
        - current.6
      align:
        strategy: hold
        stamp: header
        tol_ms: 1500
        max_age_ms: 500
      qos:
        reliability: best_effort
        history: keep_last
        depth: 50
  control_modes:
    model_inference:
      inference:
        pipelines:
          policy:
            deployment: ascend_310b1
            execution_mode: distributed
    moveit_planning:
      executor:
        type: action
  embodied:
    skill_catalog_profile: so101_rtp_distributed
    visual_games:
      sorting_hat:
        announce: false
    perception:
      scene_sources:
        primary_camera_topic: /camera/front_camera/color/image_raw
        primary_camera_info_topic: /camera/front_camera/color/camera_info
        primary_aligned_depth_topic: /camera/front_camera/aligned_depth_to_color/image_raw
        primary_pointcloud_topic: /camera/front_camera/depth/color/points
        wrist_camera_topic: ''
        wrist_camera_info_topic: ''
        wrist_aligned_depth_topic: ''
        wrist_pointcloud_topic: ''
        ee_pose_topic: /robot_status/ee_pose
        joint_state_topic: /joint_states
        require_depth: false
        require_pointcloud: false
  semantic_mapping:
    migration:
      grounded_sam2_node: compatibility
      grounded_sam2_snapshot: diagnostic_only
      perception_service_node: general_scene
      embedded_mapping_backend: disabled
  teleoperation:
    devices:
    - name: so101_leader
      type: leader_arm
      port: /dev/ttyACM1
      calib_file: $(env HOME)/.calibrate/so101_leader_calibrate.json
    - name: phone_teleop
      type: phone
      control_frequency: 30.0
      phone_config:
        phone_os: android
        camera_offset:
        - 0.0
        - -0.02
        - 0.04
        linear_scale: 2.0
        end_effector_bounds:
          min:
          - -0.5
          - -0.5
          - 0.0
          max:
          - 0.5
          - 0.5
          - 0.5
        max_ee_step_m: 0.05
        gripper_speed_factor: 20.0
        gripper_range:
        - 0.0
        - 1.0
      ee_frame_name: gripper
    - name: xbox_controller
      type: xbox_controller
      input_device: /dev/input/js0
      default_mode: joint
      mapping_config: xbox_mapping
      servo_config: so101_servo
      control_params:
        deadzone: 0.1
        joint_velocity_gain: 1.5
        cartesian_linear_speed: 1.0
        cartesian_angular_speed: 1.0
        long_press_duration: 0.5
    - name: vr_teleop
      type: vr_teleop
      control_frequency: 50.0
      vr_config:
        output_profile: so101
        controller_side: right
        host: 0.0.0.0
        port: 8889
        so101_input_mode: pose
        position_scale: 0.7
        so101_position_only: false
        so101_command_stale_s: 0.2
        linear_speed_scale: 1.0
        angular_speed_scale: 1.0
        linear_deadzone: 0.005
        angular_deadzone: 0.05
        so101_gripper_open: 1.0
        so101_gripper_closed: 0.0
    cartesian:
      solver: placo_servo
      placo_servo:
        linear_speed: 0.17
        angular_speed: 0.2
    safety:
      joint_limits:
        '1':
          min: -2.0693
          max: 2.0709
        '2':
          min: -1.92
          max: 1.92
        '3':
          min: -1.6813
          max: 1.6828
        '4':
          min: -1.65806
          max: 1.65806
        '5':
          min: -2.9115
          max: 2.9115
        '6':
          min: 0.0
          max: 1.0
