# SO-101 Single Arm Robot Configuration
# This configuration defines the complete hardware setup for a single SO-101 arm
# with cameras for imitation learning.

robot:
  name: so101_single_arm
  type: so101
  robot_type: so_101  # For LeRobot dataset metadata
  # Gazebo：须与 config/worlds 里 <world name="..."> 一致；create 不传 -world 时会随机取 worlds 列表第一个
  gazebo_world_name: demo
  # Gazebo 实体创建现在基于 /clock ready 判定，不再依赖固定启动延时。

  # Gazebo 窗口灰屏、实体树空但 /joint_states 正常时，日志常见：
  #   libEGL warning: egl: failed to create dri2 screen
  # 可保持下方为 true；若显卡正常、仅想开 GPU 加速，把 libgl_always_software 改为 false
  gazebo_gui:
    qt_platform: xcb
    libgl_always_software: true

  # ============================================
  # Model Library (新增)
  # ============================================
  models:
    so101_act:
      path: ./models/502000/pretrained_model
      policy_type: act
      # LeRobot motor normalization mode used during training.
      # Determines how rad ↔ LeRobot units are converted:
      #   range_m100_100 : arm [-100,+100], gripper [0,100]  (LeRobot default)
      #   degrees        : arm centered degrees; gripper keeps [0,100]
      #   none           : no conversion (pass-through, units already match)
      lerobot_norm_mode: range_m100_100

    so101_act_rknn:
      path: ./models/502000/pretrained_model
      policy_type: act
      device: rknn
      lerobot_norm_mode: range_m100_100

  # ============================================
  # Unified joint definitions (Single Source of Truth)
  # ============================================
  joints:
    arm:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
    gripper:
      - "6"
    all: ["1", "2", "3", "4", "5", "6"]

  # ============================================
  # MoveIt configuration
  # ============================================
  moveit:
    # End-effector / tip frame selection (SSOT).
    #   gripper -> arm_group_name: arm     (default, byte-for-byte unchanged)
    #   tcp     -> arm_group_name: arm_tcp (virtual Tool Center Point ~9cm down
    #              the finger line; pure -Y translation, same orientation as
    #              gripper. Rotations pivot about the tool point instead of the
    #              wrist.) The TCP geometry lives only in the URDF/xacro
    #              (tcp_offset_y, default -0.09) -- never duplicated here.
    # NOTE: arm_group_name and ee_link must stay consistent (both gripper or
    #       both tcp); see SRDF groups 'arm' / 'arm_tcp'.
    arm_group_name: arm_tcp #arm_tcp #arm
    base_link: base
    ee_link:  tcp #tcp #gripper
    shoulder_link: shoulder
    so101_safe_servo_config_path: package://robot_moveit/config/so101_safe_servo.yaml
    so101_placo_servo_config_path: package://robot_moveit/config/so101_placo_servo.yaml

  # Control mode management
  default_control_mode: "model_inference"
  controller_startup_timeout:
    sim: 120.0
    hardware: 30.0

  control_modes:
    # Human teleoperation mode (direct control via leader arm/gamepad)
    teleop:
      description: "Human teleoperation mode (direct control)"
      description_cn: "人工遥操作模式（直接控制）"
      controllers:
        - joint_state_broadcaster
        - arm_position_controller
        - gripper_position_controller
      inference:
        enabled: false
        force_disable: true  # Explicitly disable inference in teleop mode
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0

    # Model inference mode (ACT/pi0 end-to-end control)
    model_inference:
      description: "High-frequency end-to-end control mode (ACT/pi0)"
      description_cn: "高频端到端控制模式（ACT/pi0）"
      controllers:
        - joint_state_broadcaster
        - arm_position_controller
        - gripper_position_controller
      # ============================================
      # Inference configuration
      # ============================================
      inference:
        enabled: true
        # execution_mode: "distributed"
        model: so101_act
        action_server: /inference/dispatch
        publish_attention: false
        attention_viz_topic: /attention/weights
        attention_viz:
          enabled: false
          mode: file
          save_dir: attention_visualizations
          update_frequency: 10.0
          headless: false
          interactive_masking: false
          mask_save_dir: gui_interactions
      # ============================================
      # Executor configuration
      # ============================================
      executor:
        type: topic  # topic | action
        mode: model_inference
        queue_size: 100
        # Keep about 2.5s of buffered actions so ~1.5s distributed RKNN latency
        # still leaves margin before the dispatcher falls back to hold.
        watermark_threshold: 50
        control_frequency: 20.0

    moveit_planning:
      description: "MoveIt trajectory planning mode (VoxPoser/VLM)"
      description_cn: "MoveIt轨迹规划模式（VoxPoser/VLM）"
      controllers:
        - joint_state_broadcaster
        - arm_trajectory_controller
        - gripper_trajectory_controller
      inference:
        enabled: false  # MoveIt模式不需要推理
      executor:
        type: action
        mode: moveit_planning

  # Voice ASR is configured here and injected by robot_config/robot.launch.py.
  # The standalone voice_asr_service launch file is kept only for debugging.
  voice_asr:
    enabled: false
    auto_download_model: true
    # 默认使用 continuous 监听模式；可通过 launch 参数临时覆盖是否启用。
    active_mode: continuous
    language: zh
    model_path: "models/voice_asr/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23"
    tokens_path: ""
    provider: cpu
    model_type: streaming
    max_recording_duration: 10.0
    vad_sensitivity: 0.6
    realtime_pre_roll_seconds: 0.5
    publish_partial: true
    sample_rate: 16000
    chunk_size: 512
    buffer_seconds: 5.0
    output_topic: /voice_command
    device_index: -1
    device_name: ""
    exit_on_init_failure: true

  embodied:
    enabled: false
    debug_tracing: true
    task_input_topic: /voice_command
    task_command_topic: /embodied/task_command
    planned_task_topic: /embodied/planned_task
    status_topic: /embodied/task_status
    skill_action_name: /embodied/execute_skill
    primitive_action_name: /embodied/execute_primitive
    validate_skill_service: /embodied/validate_skill
    validate_primitive_service: /embodied/validate_primitive
    default_target_name: demo_object
    default_place_name: home
    timeouts:
      task_budget_sec: 180.0
      scene_freshness_sec: 0.5
      model_idle_timeout_sec: 120.0
      rpc_timeout_sec: 5.0
      gripper_settle_sec: 1.5
    planner:
      mode: hybrid  # rule | vlm_api | hybrid
      scene_sources:
        primary_camera_topic: /camera/front_camera/color/image_raw
        primary_camera_info_topic: /camera/front_camera/color/camera_info
        primary_aligned_depth_topic: /camera/front_camera/aligned_depth_to_color/image_raw
        primary_pointcloud_topic: /camera/front_camera/depth/color/points
        wrist_camera_topic: ""
        wrist_camera_info_topic: ""
        wrist_aligned_depth_topic: ""
        wrist_pointcloud_topic: ""
        ee_pose_topic: /robot_status/ee_pose
        joint_state_topic: /joint_states
        require_depth: false  # 仿真环境无深度流，仅用 RGB
        require_pointcloud: false
      vlm_api:
        provider: kimicode
        base_url: https://api.kimi.com/coding/v1
        api_key_env: KIMICODE_API_KEY
        model: kimi-latest
        max_image_width: 640
        jpeg_quality: 80
      planning_policy:
        fallback_to_rule_planner: true
        min_confidence: 0.70
        allowed_skills:
          - inspect_scene
          - recover_safe_pose
          - recover_zero_pose
          - move_relative_ee
          - open_gripper_skill
          - close_gripper_skill
          - rotate_gripper_cw
          - rotate_gripper_ccw
          - dance_basic
    perception:
      enabled: false
      request_topic: /embodied/perception_request
      text_input_topic: /embodied/perception_text
      result_topic: /embodied/perception_result
      summary_topic: /embodied/perception_summary
      default_session_id: default
      scene_sources:
        primary_camera_topic: /camera/front_camera/color/image_raw
        primary_camera_info_topic: /camera/front_camera/color/camera_info
        primary_aligned_depth_topic: /camera/front_camera/aligned_depth_to_color/image_raw
        primary_pointcloud_topic: /camera/front_camera/depth/color/points
        wrist_camera_topic: ""
        wrist_camera_info_topic: ""
        wrist_aligned_depth_topic: ""
        wrist_pointcloud_topic: ""
        ee_pose_topic: /robot_status/ee_pose
        joint_state_topic: /joint_states
        require_depth: false  # 仿真环境无深度流，仅用 RGB
        require_pointcloud: false
      vlm_api:
        provider: openai_compatible
        base_url: http://localhost:8000/v1
        api_key_env: ""
        model: Qwen3.5-9B
        max_image_width: 320
        jpeg_quality: 70
      conversation:
        max_history_turns: 4
    execution:
      relative_motion_step_m: 0.03
      relative_motion_reference_frame: base
      relative_motion_direction_mapping:
        forward: [0.0, -1.0, 0.0]
        backward: [0.0, 1.0, 0.0]
        left: [1.0, 0.0, 0.0]
        right: [-1.0, 0.0, 0.0]
        up: [0.0, 0.0, 1.0]
        down: [0.0, 0.0, -1.0]
      gripper_open_position: 1.0
      gripper_closed_position: 0.15
      task_executor_action_name: /task_executor/execute_task_plan
    safety:
      workspace:
        x: [-0.32, 0.25]
        y: [-0.42, 0.00]
        z: [0.05, 0.55]
    named_poses:
      home:
        position: {x: 0.020030733201442157, y: -0.11809839488683391, z: 0.13887055751050842}
        orientation: {x: -0.26790866048257905, y: -0.2622185975709204, z: -0.6525133891660432, w: 0.6585534402654153}
      observe_table:
        position: {x: 0.02160863957360322, y: -0.1310933191355222, z: 0.33769602460194537}
        orientation: {x: -0.35328551634048977, y: -0.32020226597268203, z: -0.5842845082802226, w: 0.6567126207053827}
      zero:
        position: {x: 0.0210077843415008, y: -0.278950111258735, z: 0.24858389783148477}
        orientation: {x: -0.4740206645801369, y: -0.4668084047044082, z: -0.523033090590171, w: 0.532757645647648}
    skill_templates:
      inspect_scene:
        primitive_sequence:
          - primitive_name: move_to_named_pose
            pose_name: observe_table
      recover_safe_pose:
        primitive_sequence:
          - primitive_name: move_to_named_pose
            pose_name: home
      recover_zero_pose:
        primitive_sequence:
          - primitive_name: move_to_named_pose
            pose_name: zero
      move_relative_ee:
        primitive_sequence:
          - primitive_name: move_relative_ee
            motion_direction_from_request: true
            motion_distance_from_request: true
      open_gripper_skill:
        primitive_sequence:
          - primitive_name: open_gripper
      close_gripper_skill:
        primitive_sequence:
          - primitive_name: close_gripper
      rotate_gripper_cw:
        primitive_sequence:
          - primitive_name: rotate_gripper_cw
            motion_distance_from_request: true
      rotate_gripper_ccw:
        primitive_sequence:
          - primitive_name: rotate_gripper_ccw
            motion_distance_from_request: true
      dance_basic:
        primitive_sequence:
          - primitive_name: move_through_joint_positions
            trajectory_template:
              type: wave_dance_v1
              waypoint_duration_sec: 0.05
              active_waypoint_count: 120
              repeat_count: 3
              zero_hold_count: 4
              base_pose:
                "1": 0.02
                "2": 0.54
                "3": -0.82
                "4": -0.18
                "5": 0.02
              joints:
                "1":
                  terms:
                    - amplitude: 0
                      harmonic: 1
                      phase: 1.2
                "2":
                  terms:
                    - amplitude: 0.3
                      harmonic: 1
                      phase: 0.0
                    - amplitude: 0.03
                      harmonic: 2
                      phase: 1.5707963267948966
                "3":
                  terms:
                    - amplitude: 0.3
                      harmonic: 1
                      phase: 0.0
                    - amplitude: 0.06
                      harmonic: 2
                      phase: 1.5707963267948966
                "4":
                  terms:
                    - amplitude: -0.8
                      harmonic: 1
                      phase: 0.45
                    - amplitude: -0.05
                      harmonic: 2
                      phase: 1.8
                "5":
                  terms:
                    - amplitude: 0.5
                      harmonic: 1
                      phase: 1.8
              workspace_limits:
                model: so101_arm_v1
                points:
                  joint3:
                    z: [0.04, 0.55]
                  upper_arm_mid:
                    z: [0.03, 0.55]
                  forearm_mid:
                    z: [0.025, 0.55]
                  wrist_mid:
                    z: [0.025, 0.55]
                  ee:
                    x: [-0.32, 0.25]
                    y: [-0.42, 0.00]
                    z: [0.05, 0.55]
  # ros2_control configuration
  ros2_control:
    hardware_plugin: so101_hardware/SO101SystemHardware
    port: /dev/ttyACM0
    calib_file: $(env HOME)/.calibrate/so101_follower_calibrate.json
    joint_names: ["1", "2", "3", "4", "5", "6"]
    # Reset positions (optional) - uses 'rest' pose from SRDF
    reset_positions:
      "1": 0.0       # shoulder_pan:  centered
      "2": -1.5854   # shoulder_lift: ~-90° (down)
      "3": 1.5708    # elbow_flex:    ~+90° (folded)
      "4": 0.7854    # wrist_flex:    ~+45° (tilted)
      "5": 0.0       # wrist_roll:    centered
    urdf_path: $(find robot_description)/urdf/lerobot/so101/so101.urdf.xacro

    # Controllers configuration
    # Path to the controllers configuration file (YAML format)
    controllers_config: $(find so101_hardware)/config/so101_controllers.yaml

    # List of controllers to auto-start
    # These controllers will be automatically spawned when the robot launches
    controllers:
      - joint_state_broadcaster  # Publishes joint states to /joint_states
      - arm_controller           # Controls the robot arm joints
      - gripper_controller       # Controls the gripper

  # Peripheral devices (cameras, microphones, etc.)
  peripherals:
    - type: camera
      name: top
      driver: opencv
      index: 0
      width: 640
      height: 480
      fps: 30
      pixel_format: mjpeg2rgb
      frame_id: camera_top_frame
      optical_frame_id: camera_top_optical_frame
      # use_default_transform: 启用仿真相机预设位姿。
      # 为 true 时，下方 transform 和 fovy 被忽略，
      # 根据相机名和当前仿真平台自动填入位姿与视场角。
      use_default_transform: true
      transform:
        parent_frame: base
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      fovy: 0
      # camera_info_url: file://$(env HOME)/.ros/camera_info/top_camera.yaml

    - type: camera
      name: wrist
      driver: opencv
      index: 2
      width: 640
      height: 480
      fps: 60
      pixel_format: mjpeg2rgb
      frame_id: camera_wrist_frame
      optical_frame_id: camera_wrist_optical_frame
      # use_default_transform: 启用仿真相机预设位姿。
      # 为 true 时，下方 transform 和 fovy 被忽略，
      # 根据相机名和当前仿真平台自动填入位姿与视场角。
      use_default_transform: true
      transform:
        parent_frame: gripper
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      fovy: 0
      # camera_info_url: file://$(env HOME)/.ros/camera_info/wrist_camera.yaml

    - type: camera
      name: front
      driver: realsense
      serial_number: ""  # Optional: specific serial number
      width: 640
      height: 480
      fps: 30
      pixel_format: bgr8
      enable_pointcloud: false
      align_depth: true
      frame_id: camera_front_link
      optical_frame_id: camera_front_optical_frame
      # use_default_transform: 启用仿真相机预设位姿。
      # 为 true 时，下方 transform 和 fovy 被忽略，
      # 根据相机名和当前仿真平台自动填入位姿与视场角。
      use_default_transform: true
      transform:
        parent_frame: base
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      fovy: 0


  # ============================================
  # Simulation Configuration
  # ============================================
  simulation:
    platform: gazebo        # "gazebo" | "mujoco" | "mock"
    scene: pick_banana      # null = 不加载场景；pick_banana = 香蕉抓取场景
    robot_spawn:            # Robot spawn pose owned by robot_config SSOT
      x: 0.0
      y: 0.30
      z: -0.03
    sim_models_pkg: sim_models

  # IB-Robot contract integration
  contract:
    base_contract: $(find robot_config)/config/contracts/act_grab_pan.yaml
    rate_hz: 20
    max_duration_s: 90.0

    observations:
      - key: observation.images.front
        topic: /camera/front/image_raw
        type: sensor_msgs/msg/Image
        peripheral: front
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10

      - key: observation.images.top
        topic: /camera/top/image_raw
        type: sensor_msgs/msg/Image
        peripheral: top  # References camera 'top' from peripherals above
        image:
          resize: [480, 640]  # height, width for LeRobot
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10

      - key: observation.images.wrist
        topic: /camera/wrist/image_raw
        type: sensor_msgs/msg/Image
        peripheral: wrist  # References camera 'wrist' from peripherals above
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10

      - key: observation.state
        topic: /joint_states
        type: sensor_msgs/msg/JointState
        selector: { names: ["position.1", "position.2", "position.3", "position.4", "position.5", "position.6"] }
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 50

      - key: observation.current
        topic: /so101_follower/joint_currents
        type: ibrobot_msgs/msg/JointCurrent
        selector: { names: ["current.1", "current.2", "current.3", "current.4", "current.5", "current.6"] }
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 50

    actions:
      # Arm joints (1-5) - uses same key "action" for consolidation
      - key: action
        selector:
          names:
            - "action.0"
            - "action.1"
            - "action.2"
            - "action.3"
            - "action.4"
        publish:
          topic: /arm_position_controller/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
          strategy:
            mode: nearest
            tolerance_ms: 500
        safety_behavior: hold

      # Gripper joint (6) - uses same key "action" for consolidation
      - key: action
        selector:
          names:
            - "action.5"
        publish:
          topic: /gripper_position_controller/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
          strategy:
            mode: nearest
            tolerance_ms: 500
        safety_behavior: hold

  # ============================================
  # Teleoperation Configuration (for human teleop mode)
  # ============================================
  teleoperation:
    enabled: true
    active_device: "xbox_controller" # Xbox 手柄控制 /dev/ttyACM0 上的 SO-101 从臂；可切回 "so101_leader" 或 "phone_teleop"

    # Cartesian solver used when gamepad / phone is in cartesian mode.
    # Options (default: safe_servo):
    #   safe_servo     - robust servo replacement for low-cost arms with sag/error
    #                    (linear position IK + direct wrist control) [DEFAULT]
    #   servo          - MoveIt Servo real-time Jacobian tracking
    #                    (alias: velocity_servo; no extra nodes, freezes near singularities)
    #   placo_servo    - in-process Placo QP differential IK (true Cartesian
    #                    posture, latched reference; targets "extreme smoothness")
    cartesian:
      solver: placo_servo
      # Speed knobs — unitless 0.0 ~ 1.0 fractions.
      # 1.0 = preset physical maximum (1.0 m/s linear, 6.0 rad/s angular).
      safe_servo:
        linear_speed: 0.3   # 0.0~1.0
        angular_speed: 0.7  # 0.0~1.0
      placo_servo:
        # placo_servo feeds a TRUE Cartesian QP on a 5-DOF (under-actuated)
        # arm: angular is a real SO(3) EE velocity, not a wrist jog. The full
        # 1.0=6.0 rad/s preset is far too aggressive here (an unreachable
        # high-speed orientation goal makes the QP thrash every joint). Keep
        # angular low and linear modest until bench tuning (§7.6).
        linear_speed: 0.17   # 0.0~1.0  -> 0.15 m/s at full stick
        angular_speed: 0.2   # 0.0~1.0  -> 0.6 rad/s at full stick

    devices:
      - name: "so101_leader"
        type: "leader_arm"
        port: "/dev/ttyACM1"
        calib_file: "$(env HOME)/.calibrate/so101_leader_calibrate.json"
      - name: "phone_teleop"
        type: "phone"
        control_frequency: 30.0
        phone_config:
          phone_os: "android" # android/ios
          camera_offset: [0.0, -0.02, 0.04]
          linear_scale: 2.0
          end_effector_bounds:
            min: [-0.5, -0.5, 0.0]
            max: [0.5, 0.5, 0.5]
          max_ee_step_m: 0.05
          gripper_speed_factor: 20.0
          gripper_range: [0.0, 1.0]
        ee_frame_name: "gripper"
      - name: "xbox_controller"
        type: "xbox_controller"
        input_device: "/dev/input/js0"
        default_mode: "joint"
        mapping_config: "xbox_mapping"
        servo_config: "so101_servo"
        control_params:
          deadzone: 0.1
          joint_velocity_gain: 1.5
          cartesian_linear_speed: 1.0
          cartesian_angular_speed: 1.0
          long_press_duration: 0.5
    safety:
      joint_limits:
        "1": {"min": -2.0693, "max": 2.0709}
        "2": {"min": -1.92, "max": 1.92}
        "3": {"min": -1.6813, "max": 1.6828}
        "4": {"min": -1.65806, "max": 1.65806}
