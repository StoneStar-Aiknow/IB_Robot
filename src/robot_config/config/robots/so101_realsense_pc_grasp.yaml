# SO-101 single arm with one PC-connected RealSense camera.
#
# Intended use:
# - eye-to-hand calibration of the external/front RealSense against the robot base
# - follow-up MoveIt-based grasping/control tests
#
# Hardware assumptions:
# - SO-101 follower arm on /dev/ttyACM0
# - follower calibration at ~/.calibrate/so101_follower_calibrate.json
# - one Intel RealSense camera connected to the PC
# - no top camera and no wrist camera
#
# The front camera transform below is an initial placeholder. After eye-to-hand
# calibration, replace it with the solved base -> camera_front_link transform.

robot:
  name: so101_realsense_pc_grasp
  type: so101
  robot_type: so_101

  joints:
    arm:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
    gripper:
      - "6"
    all: ["1", "2", "3", "4", "5", "6"]

  moveit:
    arm_group_name: arm
    base_link: base
    ee_link: gripper
    shoulder_link: shoulder

  grasp_execution:
    source_gripper: robotiq_2f_140
    source_contact_point: [0.0, 0.0, 0.195]
    adapter:
      source_to_ee_rpy: [3.141592653589793, 0.0, 0.0]
    # Robot-specific execution preference. GraspGen remains a robot-agnostic
    # source candidate provider; these weights tell the target robot which
    # candidates it can execute more reliably.
    execution_scoring:
      confidence_weight: 1.0
      contact_distance_weight: 1.0
      contact_distance_scale_m: 0.06
    target_gripper:
      type: asymmetric_single_moving_jaw
      ee_frame: gripper
      # Aligned to the finger step contact region described in the GraspGen/SO101
      # runtime notes; fallback width keeps the effective center near z=-0.080.
      fixed_finger_contact_ee: [-0.014, 0.0, -0.080]
      # Vector from the fixed finger contact point toward the target width center.
      # It must align with the GraspGen source gripper width axis after source_to_ee_rpy.
      closing_axis_ee: [1.0, 0.0, 0.0]
      ik_orientation_guard:
        enabled: true
        approach_axis_ee: [0.0, 0.0, 1.0]
        closing_axis_180_symmetric: true
        max_approach_error_deg: 25.0
        max_closing_error_deg: 20.0
      # Extra offset away from the fixed finger to reduce edge/top-first contact.
      fixed_finger_margin_m: 0.006
      # Narrow targets need more fixed-finger clearance because the fixed jaw cannot sweep the object back.
      fixed_finger_margin_max_m: 0.012
      fixed_finger_margin_width_ref_m: 0.035
      fixed_finger_margin_width_gain: 0.25
      # Keep the fixed jaw on the target side facing the robot base.
      fixed_finger_base_side:
        enabled: true
        reference_point_base: [0.0, 0.0, 0.0]
        min_alignment_cos: 0.0
      fixed_finger_robust_gap:
        enabled: true
        max_target_gap_deficit_m: 0.003
      width_clearance_m: 0.003
      min_width_m: 0.008
      max_width_m: 0.080
      fallback_width_m: 0.035

  default_control_mode: "moveit_planning"
  controller_startup_timeout:
    sim: 120.0
    hardware: 30.0

  control_modes:
    teleop:
      description: "Human teleoperation mode for calibration sampling"
      description_cn: "用于标定采样的人工遥操作模式"
      controllers:
        - joint_state_broadcaster
        - arm_position_controller
        - gripper_position_controller
      inference:
        enabled: false
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0

    moveit_planning:
      description: "MoveIt trajectory planning mode for grasping tests"
      description_cn: "用于抓取测试的 MoveIt 轨迹规划模式"
      controllers:
        - joint_state_broadcaster
        - arm_trajectory_controller
        - gripper_trajectory_controller
      inference:
        enabled: false
      executor:
        type: action
        mode: moveit_planning

  voice_asr:
    enabled: false
    auto_download_model: true
    active_mode: continuous
    language: zh
    model_path: "models/voice_asr/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23"
    tokens_path: ""
    provider: cpu
    model_type: streaming
    max_recording_duration: 10.0
    vad_sensitivity: 0.6
    realtime_pre_roll_seconds: 0.5
    publish_partial: true
    sample_rate: 16000
    chunk_size: 512
    buffer_seconds: 5.0
    output_topic: /voice_command
    device_index: -1
    device_name: ""
    exit_on_init_failure: false

  ros2_control:
    hardware_plugin: so101_hardware/SO101SystemHardware
    port: /dev/ttyACM0
    calib_file: $(env HOME)/.calibrate/so101_follower_calibrate.json
    joint_names: ["1", "2", "3", "4", "5", "6"]
    reset_positions:
      "1": 0.0
      "2": -1.5854
      "3": 1.5708
      "4": 0.7854
      "5": 0.0
    urdf_path: $(find robot_description)/urdf/lerobot/so101/so101.urdf.xacro
    controllers_config: $(find so101_hardware)/config/so101_controllers.yaml
    controllers:
      - joint_state_broadcaster
      - arm_trajectory_controller
      - gripper_trajectory_controller

  peripherals:
    - type: camera
      name: front
      driver: realsense
      serial_number: ""
      width: 1280
      height: 720
      fps: 30
      pixel_format: bgr8
      align_depth: true
      enable_pointcloud: true
      streams:
        - color
        - depth
        - pointcloud
      frame_id: camera_front_link
      optical_frame_id: camera_front_optical_frame
      transform:
        parent_frame: base
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

  contract:
    base_contract: $(find robot_config)/config/contracts/act_grab_pan.yaml
    rate_hz: 20
    max_duration_s: 90.0

    observations:
      - key: observation.images.front
        topic: /camera/front/image_raw
        type: sensor_msgs/msg/Image
        peripheral: front
        image:
          resize: [720, 1280]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10

      - key: observation.images.front.depth
        topic: /camera/front/aligned_depth_to_color/image_raw
        type: sensor_msgs/msg/Image
        peripheral: front
        image:
          resize: [720, 1280]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10

      - key: observation.pointcloud.front
        topic: /camera/front/depth/color/points
        type: sensor_msgs/msg/PointCloud2
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 5

      - key: observation.state
        topic: /joint_states
        type: sensor_msgs/msg/JointState
        selector:
          names:
            - "position.1"
            - "position.2"
            - "position.3"
            - "position.4"
            - "position.5"
            - "position.6"
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
        qos:
          reliability: best_effort
          history: keep_last
          depth: 50

    actions:
      - key: action
        selector:
          names:
            - "action.0"
            - "action.1"
            - "action.2"
            - "action.3"
            - "action.4"
        publish:
          topic: /arm_position_controller/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
          strategy:
            mode: nearest
            tolerance_ms: 500
        safety_behavior: hold

      - key: action
        selector:
          names:
            - "action.5"
        publish:
          topic: /gripper_position_controller/commands
          type: std_msgs/msg/Float64MultiArray
          layout: flat
          qos:
            reliability: best_effort
            history: keep_last
            depth: 10
          strategy:
            mode: nearest
            tolerance_ms: 500
        safety_behavior: hold

  teleoperation:
    enabled: false
    active_device: ""
    devices: []
    safety:
      joint_limits:
        "1": {"min": -2.0693, "max": 2.0709}
        "2": {"min": -1.92, "max": 1.92}
        "3": {"min": -1.6813, "max": 1.6828}
        "4": {"min": -1.65806, "max": 1.65806}
        "5": {"min": -2.9115, "max": 2.9115}
        "6": {"min": 0.0, "max": 1.0}

  recording:
    bag_base_dir: "~/rosbag/episodes"
    storage: mcap
    dataset_name: so101_realsense_pc_grasp
    default_task: "calibrate external RealSense and test grasping"
    task_family: grasping
