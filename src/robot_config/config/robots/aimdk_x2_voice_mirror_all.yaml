# AgiBot X2: one stack with the voice agent, the preset gestures and the mirror.
#
# Layers on aimdk_x2_voice_mirror (agent + ZipVoice + PEAR stream + mirror
# session) and re-enables the preset named motions. The two skill families run
# in different control modes (gestures named_motion, mirror model_inference), so
# this deployment states the supported modes explicitly instead of using
# nav_stage: hybrid — the X2 compute pack has no navigation service, and hybrid
# would demand navigation.command_server.
robot:
  base_config: aimdk_x2_voice_mirror.yaml
  name: aimdk_x2_all

  # The mirror session takes over exactly the mode the Gateway switches to, and
  # its builder requires that mode to be the deployment's skill mode. Gestures
  # still run: their own required mode (named_motion) is in the supported list,
  # so the executor switches the runtime to idle for them.
  default_control_mode: model_inference
  skill_required_control_mode: model_inference
  skill_supported_control_modes:
    - named_motion
    - model_inference

  control_modes:
    named_motion:
      description: "Runtime-owned named motions (preset gestures)"
      description_cn: "运行时自持的命名动作（预设手势）"
      runtime_mode: idle
      inference:
        enabled: false
      executor:
        enabled: false

  # The vendor enhanced stream is the ASR input: the runtime republishes the
  # vendor's VAD-segmented chunks on audio.speech.
  voice_asr:
    enabled: true
    # Beam search + domain hotwords: the quantized streaming transducer is weak on
    # command words, and sherpa only applies hotwords through this file.
    hotwords_file: $(find robot_config)/config/hotwords/x2_commands.txt
    input_mode: external_vad
    active_mode: continuous
    audio_input:
      interface: audio.speech
      type: ibrobot_msgs/msg/SpeechAudioChunk
    output_topic: /voice_command

  embodied:
    entry_mode: agent
    skill_catalog_profile: aimdk_x2_all
    agent:
      # Replaces the mirror-only allowlist inherited from the base: this
      # deployment exposes both families to the planner.
      test_allowlist:
        - wave_hand
        - handshake
        - raise_hand
        - blow_kiss
        - clap_hands
        - mirror_start
        - mirror_stop
        - self_introduction
      voice_bridge:
        # Known mishearings of the command vocabulary, mapped to the canonical form
        # (the planner matches aliases, so canonical text is enough).
        text_corrections:
          # "停止" is the fragile part: the transducer hears 停止照镜子 as 银子/名字照镜子,
          # and the planner then matches the 照镜子 tail and starts a round instead of stopping.
          停止照镜子: [银子照镜子, 名字照镜子, 明子照镜子, 瓶子照镜子, 影子照镜子, 林子照镜子, 停了照镜子, 听止照镜子, 停止找镜子, 挺直照镜子, 停下照镜子, 停止照镜像]
          停止: [银子, 名字, 听止, 停职, 挺直]
          挥挥手: [灰灰手, 恢恢手, 回回手, 挥挥手手]
          握个手: [卧个手, 我个手, 握握手]
          举手: [据手, 举起手]
          比个心: [比个星, 比个信, 比心]
          鼓掌: [古掌, 股掌]
          照镜子: [找镜子, 照境子, 照紧子]
          自我介绍: [自我介少, 自我结绍]
        # The clip is the reply: announcing the plan and then saying "执行完成。"
        # would talk over the self-introduction.
        silent_skills:
          - self_introduction
        # L3 semantic gate: decide whether an utterance is addressed to the robot at
        # all, before the planner sees it. shadow logs the verdict and keeps routing;
        # the log is the queue of sentences worth labelling for the next model.
        semantic_gate_mode: shadow
        # Trained on the 639-sentence field corpus (see tools/addressee and
        # docs/aimdk_x2_addressee_semantic_gate_design_zh.md). Copy the artefact to
        # this path on the board; a missing file only disables the gate (fail_open).
        semantic_gate_model_path: /root/workspace/lyx/addressee/addressee_zh_v1.json
        semantic_gate_threshold: 0.10
        semantic_gate_log_path: /var/log/ibrobot/semantic_gate.jsonl
        semantic_gate_fail_open: true
        # A catalog alias beats the model: "帮我抓取橘子" is rare in the corpus but
        # unmistakably addressed to the robot. Generated from the skill catalog by
        # tools/addressee/emit_lexicon.py -- regenerate it when a skill is renamed.
        semantic_gate_lexicon:
          - 撒娇
          - 卖萌
          - 装可爱
          - 可爱一下
          - 求关注
          - 飞吻
          - 飞个吻
          - 庆祝
          - 庆祝一下
          - 欢呼
          - 太棒了
          - 鼓掌
          - 拍手
          - 拍拍手
          - 关闭夹爪
          - 合拢夹爪
          - 夹爪关闭
          - 夹爪合拢
          - 夹紧
          - 闭爪
          - 跳舞
          - 跳个舞
          - 舞动
          - 举手致意
          - 正式打招呼
          - 举手打招呼
          - 握手
          - 握个手
          - 开心转圈
          - 高兴转圈
          - 快乐转圈
          - 直立转圈
          - 开心地转圈
          - 模仿动作
          - 模仿人类动作
          - 跟我做动作
          - 观察桌面
          - 观察场景
          - 看看桌面
          - 扫描桌面
          - 观察点
          - 观察位置
          - 照镜子
          - 开始照镜子
          - 学我动作
          - 模仿我
          - 停止照镜子
          - 结束照镜子
          - 不玩照镜子了
          - 往前一点
          - 往上一点
          - 夹爪往左
          - 移动一点
          - 点头
          - 点头表示同意
          - 打开夹爪
          - 张开夹爪
          - 展开夹爪
          - 夹爪打开
          - 夹爪张开
          - 开爪
          - 抓取物体
          - 拿起物体
          - 放进容器
          - 放到盒子里
          - 投入料框
          - 举手
          - 举起手
          - 回原位
          - 回安全位
          - 回安全位置
          - 原位
          - 原点
          - 回到home
          - 返回home
          - 零点
          - 零位
          - 回零点
          - 到零点
          - 查物品位置
          - 查停靠位
          - 找物品
          - 逆时针旋转
          - 逆时针转
          - 顺时针旋转
          - 顺时针转
          - 自我介绍
          - 介绍一下你自己
          - 介绍下你自己
          - 做个自我介绍
          - 你是谁
          - 摇头
          - 不同意
          - 不是
          - 摇头表示否定
          - 开启声源跟随
          - 开始声源跟随
          - 声源跟随
          - 停止声源跟随
          - 关闭声源跟随
          - 挥手
          - 挥挥手
          - 打招呼
          - 招手
          - 再见
          - 嗨
        # Corrupted wake words the model was trained to recognise as opening an
        # utterance; a hit accepts it even when the rest scores low.
        semantic_gate_wake_prefixes:
          - 灵犀灵犀
          - 灵犀
          - 灵溪
          - 林星
          - 林静熙
          - 年轻人
          - 小欧
          - 零七零七
    # The self-introduction plays a recorded clip; the catalog binds the name.
    runtime_play_audio:
      enabled: true
      service: /voice_tts/play
      asr_control_topic: /voice_control
      clips:
        self_intro: /root/workspace/lyx/IB_Robot_hz/assets/audio/self_introduction.wav
    runtime_named_motion:
      enabled: true
      interface: motion.named
      kind: action
      type: ibrobot_msgs/action/ExecuteNamedMotion
      requires:
        capability: motion.named

  # The mirror drives the upper body itself. The demo rules are the relaxed
  # copy: a reply's TTS synthesis shares this board's single NPU with the
  # detector, and the default 1.0 s freshness rule would end the round mid-gesture.
  mirror_session:
    enabled: true
    publish_enabled: true
    # The mirror speaks again (2026-10-23 evening, on request): the four phrases
    # (starting / ready / mirroring / goodbye) go through the same ZipVoice the
    # agent uses. Each phrase costs ~2 s of NPU inference, so the opening seconds
    # of a round now share the device with the pose stream -- watch the stutter
    # before raising anything else.
    voice:
      enabled: true
    # The physical triggers act instead of only being recorded: double cover asks
    # for mirror_start, a long cover stops the session, a head touch starts or
    # cancels a round. The operator reads the rear head camera, so covering the
    # back of the head IS a long cover (a stop) -- that is the gesture, by design.
    operator:
      send_enabled: true

  # The base entry turns the visual interaction ("看图说话") on. This deployment
  # does not run it: the base names the fake backend, whose scripted replies
  # would ride the mirror voice's utterance queue the moment a half-resolution
  # stream appears, and this firmware publishes full-resolution only. A round
  # would also share the single NPU with the detector and ZipVoice. Take the
  # internvl settings from aimdk_x2_magicmirror_board.yaml when it is wanted.
  visual_interaction:
    enabled: false
