# SO-101 single arm with the RealSense front camera for RGB-D data collection
# (colour + aligned depth + pointcloud).
#
# Overlay of the so101_single_arm provider configuration: only the
# application deltas are declared here - the front RealSense with all three
# streams, the top and wrist cameras disabled, teleop as the default mode and
# the RGB-D contract. Hardware, serial ports, calibration, controllers and the
# camera drivers are runtime-owned (so101_robot/profiles/so101_single_arm.yaml);
# a deployment with different ports or camera serials overrides them through
# the runtime profile or the runtime peripherals fragment, not here.
#
# Launch:
#   ros2 launch robot_config robot.launch.py robot_config:=so101_single_arm_rgbd \
#       control_mode:=teleop record:=true record_mode:=episodic
#
# Recorded topics (runtime camera naming):
#   /camera/front/image_raw
#   /camera/front/aligned_depth_to_color/image_raw
#   /camera/front/depth/color/points
#   /joint_states
robot:
  name: so101_single_arm_rgbd
  base_config: so101_single_arm

  default_control_mode: teleop

  control_modes:
    model_inference:
      inference:
        pipelines:
          policy:
            model_path: models/so101_single_arm_rgbd/pretrained_model

  peripherals:
    - type: camera
      name: top
      disabled: true
    - type: camera
      name: wrist
      disabled: true
    - type: camera
      name: front
      streams: [color, depth, pointcloud]

  contract:
    observations:
      - key: observation.images.front
        interface: camera.front.color
        requires: {width: 640, height: 480, min_fps: 15}
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

      # A key ending in .depth makes bag_to_lerobot mark the depth metadata.
      - key: observation.images.front.depth
        interface: camera.front.aligned_depth
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

      - key: observation.pointcloud.front
        interface: camera.front.points
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

      - key: observation.state
        interface: joint.state
        selector: { names: ["position.1", "position.2", "position.3", "position.4", "position.5", "position.6"] }
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

      - key: observation.current
        interface: joint.current
        selector: { names: ["current.1", "current.2", "current.3", "current.4", "current.5", "current.6"] }
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500
