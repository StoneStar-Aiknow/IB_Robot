# SO-101 PI0.5 Ascend310P inference validation without hardware.
#
# Overlay of the so101_single_arm provider configuration. Run it with
# use_sim:=true: the so101_robot runtime serves the SDK simulation platform
# (vendor SDK virtual bus, production controllers, synthetic camera images on
# the runtime camera topics), so the policy runs against the same public
# interfaces as on the real arm. The front camera is disabled to match the
# two-camera PI0.5 bundle.
#
#   TASK_QUEUE_ENABLE=0 ros2 launch robot_config robot.launch.py \
#       robot_config:=so101_pi05_ascend_310p_mock use_sim:=true control_mode:=model_inference
robot:
  name: so101_pi05_ascend_310p_mock
  base_config: so101_single_arm

  control_modes:
    model_inference:
      description: "PI0.5 Ascend310P native Torch inference on the SO-101 SDK simulation platform"
      inference:
        pipelines:
          policy:
            model_path: models/pi05/pi05-doublecam-fp32/019200-torch-npu
            # Register both modes with package-pi05-ascend-deployments first.
            # Keep only one deployment line uncommented when switching modes.
            deployment: torch-npu-fast  # AB2, 3 evaluations; language capacity 48.
            # deployment: torch-npu-fidelity  # Euler, 10 evaluations; language capacity 200.
            execution_mode: monolithic
            # A first CANN 8.1 cache miss can spend more than 20 minutes compiling.
            request_timeout: 1800.0
            default_task: "pick up the banana"
            runtime_options:
              model_dtype: fp16
      executor:
        watermark_threshold: 20

  peripherals:
    - type: camera
      name: front
      disabled: true

  contract:
    observations:
      - key: observation.images.top
        interface: camera.top.color
        requires: {width: 640, height: 480, min_fps: 15}
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

      - key: observation.images.wrist
        interface: camera.wrist.color
        requires: {width: 640, height: 480, min_fps: 15}
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

      - key: observation.state
        interface: joint.state
        selector:
          names: ["position.1", "position.2", "position.3", "position.4", "position.5", "position.6"]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500

  # The PI0.5 bundle was trained with the range_m100_100 joint normalization;
  # the so101_single_arm base switches to degrees for its ACT policy.
  recording:
    lerobot_norm_mode: range_m100_100
