robot:
  name: lekiwi_mapping
  type: lekiwi
  robot_type: lekiwi

  joints:
    base:
      - "7"
      - "8"
      - "9"
    all: ["7", "8", "9"]

  default_control_mode: "teleop"

  control_modes:
    teleop:
      description: "Base-only teleoperation mode for fixed D435 semantic mapping"
      description_cn: "用于固定安装 D435 语义建图的仅底盘遥操作模式"
      controllers:
        - joint_state_broadcaster
        - base_velocity_controller
      inference:
        enabled: false
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0

  simulation:
    platform: gazebo
    scene: null

  ros2_control:
    hardware_plugin: lekiwi_hardware/LeKiwiSystemHardware
    port: /dev/ttyACM0
    velocity_joints: ["7", "8", "9"]
    base_vel_max_rad: 4.602
    urdf_path: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro
    controllers_config: $(find lekiwi_hardware)/config/lekiwi_base_controllers.yaml
    xacro_mappings:
      base_only: true

  peripherals:
    - type: camera
      name: realsense
      driver: realsense
      driver_camera_name: realsense_camera
      serial_number: ""
      width: 848
      height: 480
      fps: 30
      pixel_format: bgr8
      enable_pointcloud: false
      align_depth: true
      enable_sync: true
      frame_id: camera_link
      optical_frame_id: camera_color_optical_frame
      transform:
        parent_frame: base_link
        x: 0.0
        y: 0.0
        z: 0.3
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

  navigation:
    enabled: true

    nav2_bringup:
      enabled: false

    ekf_rtabmap:
      enabled: true
      rtabmap:
        database_path: "$(env HOME)/.ros/ibrobot/maps/rtabmap.db"
        localization: false
        visual_odometry: false
        frame_id: camera_link
        odom_frame_id: odom
        odom_topic: /odom
        rgb_topic: /camera/realsense/image_raw
        depth_topic: /camera/realsense/depth/image_rect_raw
        camera_info_topic: /camera/realsense/camera_info
        approx_sync: true
        queue_size: 20
        qos_image: 2
        qos_camera_info: 2
        qos_odom: 2
        rtabmap_args: "--delete_db_on_start --Mem/InitWMWithAllNodes true --Mem/IncrementalMemory true --Mem/PermanentMemory false --Mem/STMSize 8"
        log_level: info
      ekf:
        enabled: false
        config_file: ""

    cmd_vel_bridge:
      enabled: true
      wheel_radius: 0.05
      base_radius: 0.125
      max_radps: 4.602
      odom_frame: odom
      base_frame: base_link
      publish_tf: true
      control_frequency: 50.0
      cmd_timeout: 0.5
      cmd_vel_topic: /cmd_vel
      joint_states_topic: /joint_states
      odom_topic: /odom

    robot_navigation:
      enabled: false

    funasr:
      host: "127.0.0.1"
      port: "10095"
      mode: "2pass"
      hotword_msg: ""

    rviz:
      enabled: false

  # Disabled templates keep this checked-in config loadable without production bundles.
  perception_services:
    services:
      - id: semantic_sam2_masks
        enabled: false
        required: false
      - id: semantic_ram_plus_tags
        enabled: false
        required: false
      - id: semantic_siglip2_image
        enabled: false
        required: false
      - id: semantic_siglip2_text
        enabled: false
        required: false
      - id: semantic_gdino_confirmation
        enabled: false
        required: false

  semantic_mapping:
    enabled: false
    camera:
      peripheral: realsense
      mounting: fixed
      parent_frame: base_link
      rgb_topic: /camera/realsense/image_raw
      depth_topic: /camera/realsense/aligned_depth_to_color/image_raw
      camera_info_topic: /camera/realsense/camera_info
    slam:
      global_frame: map
      cloud_map_topic: /cloud_map
      geometry_map_id: rtabmap-lekiwi
      geometry_map_hash: REPLACE_WITH_ACTIVE_GEOMETRY_MAP_HASH
      localization_session_id: REPLACE_WITH_LOCALIZATION_SESSION_ID
      calibration_id: REPLACE_WITH_D435_CALIBRATION_HASH
      urdf_hash: REPLACE_WITH_ACTIVE_URDF_HASH
      coordinate_convention: ros-rep-103-map-enu
      map_odom_authority: slam
    perception:
      mapping_backend: service
      service_wait_sec: 1.0
      semantic_roles:
        sam2_masks: semantic_sam2_masks
        ram_plus_tags: semantic_ram_plus_tags
        siglip2_image: semantic_siglip2_image
        siglip2_text: semantic_siglip2_text
        gdino_confirmation: semantic_gdino_confirmation
      allow_legacy_embedded: false
    persistence:
      database_path: ~/.ros/ibrobot/semantic_map.sqlite3
      artifact_output_dir: ~/.ros/ibrobot/semantic_artifacts
    filtering:
      depth_trunc_m: 4.0
      min_points: 30
      min_frame_valid_depth_ratio: 0.05
      min_mask_pixels: 30
      min_mask_area_ratio: 0.0005
      min_mask_valid_depth_ratio: 0.2
      max_mask_overlap_ratio: 0.8
    queue:
      sync_queue_size: 10
      sync_slop_sec: 0.06
      tf_timeout_sec: 0.15
      processing_interval_sec: 0.5
      frame_capacity: 2
      policy: drop_oldest
      max_masks_per_batch: 8
    lifecycle:
      association_distance_m: 0.45
      association_position_weight: 0.55
      embedding_similarity_threshold: 0.72
      stale_after_sec: 10.0
      move_stability_m: 0.1
      move_confirmations: 2
    target_watch:
      max_attempts: 3
      scan_profile: fixed_d435_base_scan
      stand_off_distance_m: 0.8
      clearance_m: 0.2
    interfaces:
      semantic_map_topic: /semantic_mapping/objects
      object_cloud_topic: /semantic_mapping/object_cloud
      query_service: /semantic_mapping/get_objects
      target_service: /semantic_mapping/resolve_target
    migration:
      grounded_sam2_node: compatibility
      grounded_sam2_snapshot: diagnostic_only
      perception_service_node: general_scene
      embedded_mapping_backend: disabled
