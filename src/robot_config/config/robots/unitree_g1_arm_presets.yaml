# Static 23-action Gateway integration for the preset arm surface.
#
# Physical execution is not blocked outright: it needs the per-run launch
# arguments preset_operator_confirmed=true, a robot-facing
# runtime_network_interface, and an expected FSM id (explicit or audited in the
# profile), so only an operator-supervised session can dispatch. The launch
# builds the run-scoped profile internally; nothing is persisted here.
# Offline runs use the vendor mock on loopback.
# The table is static: a startup GetActionList only shrinks it, never discovers
# actions, so a name the running firmware does not report stays unadvertised.
robot:
  name: unitree_g1_arm_presets
  type: g1_29dof_arm_presets
  robot_type: unitree_g1
  simulation: {platform: sdk}
  runtime:
    provider: unitree_g1_robot
    profile: g1_29dof_arm_presets
    require_model: false
  capabilities:
    requires: [joint.state, motion.named]
  default_control_mode: named_motion
  skill_required_control_mode: named_motion
  control_modes:
    named_motion:
      description: Runtime preset arm gesture
      runtime_mode: idle
      inference: {enabled: false}
      executor: {enabled: false}
  voice_asr: {enabled: false}
  voice_tts: {enabled: false}
  semantic_mapping: {enabled: false}
  embodied:
    enabled: true
    arm_surface: false
    skill_catalog_profile: unitree_g1_arm_presets
    skill_catalog_source_mode: development
    runtime_named_motion:
      enabled: true
      interface: motion.named
      kind: action
      type: ibrobot_msgs/action/ExecuteNamedMotion
      requires: {capability: motion.named}
