# AgiBot X2 "magic mirror" application configuration, board deployment.
#
# The magicmirror entry with the real vision-language model: everything is
# inherited from aimdk_x2_magicmirror.yaml and only visual_interaction.vl is
# swapped. fake answers nothing; internvl runs the 310P deployment directory
# named below, the same one visual_interaction.phase0.live_chain uses, so the
# phase-zero measurements carry over.
#
# That directory is the one machine-specific literal in this file: it is
# created by the board deployment (not in this repository) and must be
# re-checked before a launch. A missing directory fails at the first round,
# not at startup, so verify it by hand:
# ls /root/vlx_internvl_310p
#
# Everything else — the mirror stack, the voice, the gating, the utterance
# wiring — is the base entry's; see its header.

robot:
  base_config: aimdk_x2_magicmirror.yaml
  name: aimdk_x2_magicmirror_board

  # RT-Infer software AI-core scheduling for the 310P, default-on for the
  # summit live entries. The launch starts the device scheduler through the
  # vendor priorityctl before any Ascend model process and wraps each of the
  # four model roles (PEAR/YOLOX model services, the ZipVoice TTS host, the
  # InternVL visual-interaction host) as one priorityctl client per process;
  # no benchmark or manual priorityctl call is needed. Priorities/CPU pins
  # and the PEAR periodic admission (18 Hz / 38 ms budget) are the summit
  # evaluation profile (docs/rt_infer_periodic.md); the numbers live here in
  # one place rather than scattered in launch code.
  #
  # Diagnostics/native escape hatch: set rt_infer.enable: false here. After a
  # boot that started the soft scheduler, restoring native hardware scheduling
  # additionally requires a reboot (vendor rule; a clean stop is not enough).
  #
  # The launch installs this branch's vendor bundle
  # third_party/vendor/rt-infer/<bundle_version> to the canonical prefix
  # /opt/rt-infer/<bundle_version> through the vendor's own guarded,
  # idempotent install command, so a normal setup/build/launch prepares the
  # environment; no manual CLI step exists.
  rt_infer:
    enable: true
    bundle_version: "2026.11.06"
    scheduler_cpu: 15
    pear_periodic:
      period_hz: 18
      budget_ns: 38000000

  motion_imitation_stream:
    max_pear_hz: 18.0

  visual_interaction:
    vl:
      implementation: internvl
      demo_root: /root/vlx_internvl_310p
    # Two frames, not the base entry's four: the InternVL OMs are compiled for
    # a 1280-token prefill with 256 image tokens per frame, and the closed
    # schema prompt is 835 tokens at two frames but 1361 at four, which the
    # deployment refuses ("prompt does not fit the OM shapes"). live_chain
    # measured the same two-frame shape. The alternative is re-exporting the
    # OMs for a longer prefill.
    frames_per_window: 2
