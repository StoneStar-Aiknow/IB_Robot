# MID-360 + aligned front D435i semantic dataset capture on the managed base.
# Simulation selects MuJoCo's full RGB-D/CameraInfo, LiDAR and FAST-LIO path.
# A simulated capture writes the bag but does not pass dataset finalization:
# slam_toolbox is not started under use_sim (no /map) and the simulated lidar
# publishes PointCloud2 where finalization requires the Livox CustomMsg. A
# complete capture needs the real robot.
robot:
  name: lekiwi_semantic_capture
  base_config: lekiwi_lidar
  default_nav_stage: mapping

  simulation:
    platform: mujoco

  sensor_calibration:
    artifacts:
      base_to_front_camera: ~/.ros/ibrobot/calib/current/base_to_front_camera.yaml

  control_modes:
    teleop:
      description: "Base mapping with synchronized MID-360 and D435i capture"
      inference:
        enabled: false
        force_disable: true

  teleoperation:
    active_device: lekiwi_gamepad

  # The profile owns drivers, frames and defaults. Enable aligned RGB-D and
  # synchronization; the approved artifact supplies the fixed camera mount.
  peripherals:
    - type: camera
      name: front
      enabled: true
      align_depth: true
      enable_sync: true
      frame_id: camera_front_link
      optical_frame_id: camera_front_optical_frame
      skip_urdf_without_transform: true
      transform:
        parent_frame: base_link
    - type: lidar
      name: mid360
      scan_converter:
        min_height: -0.20

  recording:
    semantic_dataset: true
    session_base_dir: ~/.ros/ibrobot/semantic_mapping
    mapping_session_state_path: ~/.ros/ibrobot/semantic_mapping/current.json
    storage: mcap
    max_bag_size: 4294967296
    max_cache_size: 104857600
    qos_profile_overrides_path: $(find robot_config)/config/recording/semantic_mapping_qos.yaml
    include_diagnostics: false
    camera_info_topic: /camera/front/camera_info
    topics:
      - /livox/lidar
      - /livox/imu
      - /fast_lio/odometry_raw
      - /odometry/filtered
      - /cloud_registered_body
      - /scan
      - /map
      - /odom
      - /cmd_vel
      - /camera/front/image_raw
      - /camera/front/depth/image_rect_raw
      - /camera/front/aligned_depth_to_color/image_raw
      - /camera/front/camera_info
      - /camera/front/depth/camera_info
      - /camera/front/aligned_depth_to_color/camera_info
      - /tf
      - /tf_static
