# SO-101 single arm with one camera, for development tests.
#
# Overlay of the so101_single_arm provider configuration: only the top camera
# is enabled and observed, and no policy is loaded (teleop by default, the
# inherited inference pipeline disabled). Actions, hardware and camera
# drivers come from the base configuration and the so101_robot runtime profile.
robot:
  name: test_single_arm_single_cam
  base_config: so101_single_arm

  default_control_mode: teleop

  control_modes:
    model_inference:
      inference:
        enabled: false

  peripherals:
    - type: camera
      name: wrist
      disabled: true
    - type: camera
      name: front
      disabled: true

  contract:
    rate_hz: 30.0
    observations:
      - key: observation.images.top
        interface: camera.top.color
        image:
          resize: [480, 640]
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500
      - key: observation.state
        interface: joint.state
        selector: { names: ["position.1", "position.2", "position.3", "position.4", "position.5", "position.6"] }
        align:
          strategy: hold
          stamp: header
          tol_ms: 1500
          max_age_ms: 500
