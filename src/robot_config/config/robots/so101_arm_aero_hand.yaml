# SO-101 + Aero Hand integration profile.
#
# Self-contained (openspec so101-gazebo-runtime-transport D9): the arm,
# camera, MoveIt, inference, embodied and safety defaults are inlined here
# (this profile previously overlaid the retired provider-less single-arm
# configuration), and the Gazebo default camera poses/FOV are materialized as
# explicit transforms (they resolved from the removed generic SO-101 preset
# column). This file owns the hand-specific delta on top.
robot:
  name: so101_arm_aero_hand
  type: so101
  robot_type: so_101
  gazebo_world_name: demo
  gazebo_gui:
    qt_platform: xcb
    libgl_always_software: true
  joints:
    arm:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    gripper:
    - '6'
    all:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    hand:
    - right_thumb_cmc_abd
    - right_thumb_cmc_flex
    - right_thumb_mcp_ip
    - right_index
    - right_middle
    - right_ring
    - right_pinky
  moveit:
    arm_group_name: arm
    base_link: base
    ee_link: gripper
    shoulder_link: shoulder
    so101_placo_servo_config_path: $(find so101_motion)/config/so101_placo_servo.yaml
  default_control_mode: model_inference
  skill_required_control_mode: moveit_planning
  controller_startup_timeout:
    sim: 120.0
    hardware: 30.0
  control_modes:
    teleop:
      description: Human teleoperation mode (direct control)
      description_cn: 人工遥操作模式（直接控制）
      controllers:
      - joint_state_broadcaster
      - arm_position_controller
      - gripper_position_controller
      inference:
        enabled: false
      executor:
        type: topic
        mode: teleop
        queue_size: 100
        control_frequency: 50.0
    model_inference:
      description: High-frequency end-to-end control mode (ACT/pi0)
      description_cn: 高频端到端控制模式（ACT/pi0）
      controllers:
      - joint_state_broadcaster
      - arm_position_controller
      - gripper_position_controller
      inference:
        enabled: true
        pipelines:
          policy:
            model_path: models/ACT_1arm_2cam_banana_pick_v1_step_160000_distill_20260515
            deployment: cpu
            execution_mode: monolithic
            request_timeout: 120.0
            default_task: pick up the banana
      executor:
        type: topic
        mode: model_inference
        inference_pipeline: policy
        queue_size: 100
        watermark_threshold: 50
        control_frequency: 20.0
    moveit_planning:
      description: MoveIt trajectory planning mode (VoxPoser/VLM)
      description_cn: MoveIt轨迹规划模式（VoxPoser/VLM）
      controllers:
      - joint_state_broadcaster
      - arm_trajectory_controller
      - gripper_trajectory_controller
      inference:
        enabled: false
      executor:
        type: action
        mode: moveit_planning
  voice_asr:
    enabled: false
    active_mode: continuous
    language: zh
    bundle_path: models/voice_asr/sherpa-onnx-x-asr-480ms-streaming-zipformer-transducer-zh-en-int8-2026-06-05
    deployment: torch_cpu
    max_recording_duration: 10.0
    vad_sensitivity: 0.6
    realtime_pre_roll_seconds: 0.5
    publish_partial: true
    sample_rate: 16000
    chunk_size: 512
    buffer_seconds: 5.0
    output_topic: /voice_command
    exit_on_init_failure: true
  audio_io:
    enabled: true
    playback_topic: /audio/play
    playback_device: ''
    playback_sample_rate: 24000
    playback_channels: 1
    playback_sample_format: S16LE
  voice_tts:
    enabled: true
    bundle_path: models/zipvoice
    deployment: ubuntu_onnx
    service_name: /voice_tts/synthesize
    playback_service_name: /voice_tts/play
    playback_timeout_sec: 300.0
    synthesis_timeout_sec: 90.0
    prompt_profile: default
    segment_max_chars: 200
    segment_pause_ms: 150
    max_request_chars: 4000
    max_prompt_audio_bytes: 10485760
    max_prompt_duration_sec: 30.0
    max_segments: 32
    max_response_audio_bytes: 67108864
    tts_timeout_sec: 15.0
    device_id: 0
    exit_on_init_failure: false
  semantic_mapping:
    enabled: false
  embodied:
    enabled: false
    entry_mode: hermes
    skill_catalog_source_mode: development
    skill_catalog_profile: so101_single_arm
    debug_tracing: true
    task_input_topic: /voice_command
    task_command_topic: /embodied/task_command
    planned_task_topic: /embodied/planned_task
    status_topic: /embodied/task_status
    skill_action_name: /embodied/execute_skill
    primitive_action_name: /embodied/execute_primitive
    validate_skill_service: /embodied/validate_skill
    validate_primitive_service: /embodied/validate_primitive
    skill_gateway_status_service: /embodied/get_skill_gateway_status
    start_visual_game_service: /embodied/start_visual_game
    get_visual_game_result_service: /embodied/get_visual_game_result
    visual_game_event_topic: /embodied/visual_game_events
    visual_game_result_capacity: 128
    default_target_name: demo_object
    default_place_name: home
    timeouts:
      task_budget_sec: 180.0
      default_skill_timeout_sec: 120.0
      robot_state_freshness_sec: 0.5
      scene_freshness_sec: 0.5
      model_idle_timeout_sec: 120.0
      visual_game_timeout_sec: 130.0
      visual_game_result_retention_sec: 300.0
      rpc_timeout_sec: 5.0
      gripper_settle_sec: 1.5
    perception:
      enabled: false
      request_topic: /embodied/perception_request
      text_input_topic: /embodied/perception_text
      result_topic: /embodied/perception_result
      summary_topic: /embodied/perception_summary
      default_session_id: default
      scene_sources:
        primary_camera_topic: /camera/front_camera/color/image_raw
        primary_camera_info_topic: /camera/front_camera/color/camera_info
        primary_aligned_depth_topic: /camera/front_camera/aligned_depth_to_color/image_raw
        primary_pointcloud_topic: /camera/front_camera/depth/color/points
        wrist_camera_topic: ''
        wrist_camera_info_topic: ''
        wrist_aligned_depth_topic: ''
        wrist_pointcloud_topic: ''
        ee_pose_topic: /robot_status/ee_pose
        joint_state_topic: /joint_states
        require_depth: false
        require_pointcloud: false
      vlm_api:
        provider: openai_compatible
        base_url: http://localhost:8000/v1
        api_key_env: ''
        model: Qwen3.5-9B
        max_image_width: 320
        jpeg_quality: 70
      conversation:
        max_history_turns: 4
    visual_games:
      sorting_hat:
        enabled: false
        announce: true
        handler: sorting_hat_v1
        summary: 根据主相机中的人物形象判断其霍格沃茨学院
    execution:
      relative_motion_step_m: 0.03
      relative_motion_reference_frame: base
      relative_motion_direction_mapping:
        forward:
        - 0.0
        - -1.0
        - 0.0
        backward:
        - 0.0
        - 1.0
        - 0.0
        left:
        - 1.0
        - 0.0
        - 0.0
        right:
        - -1.0
        - 0.0
        - 0.0
        up:
        - 0.0
        - 0.0
        - 1.0
        down:
        - 0.0
        - 0.0
        - -1.0
      gripper_open_position: 1.0
      gripper_closed_position: 0.15
      task_executor_action_name: /task_executor/execute_task_plan
    safety:
      workspace:
        x:
        - -0.32
        - 0.25
        y:
        - -0.42
        - 0.0
        z:
        - 0.05
        - 0.55
    named_poses:
      home:
        position:
          x: 0.020030733201442157
          y: -0.11809839488683391
          z: 0.13887055751050842
        orientation:
          x: -0.26790866048257905
          y: -0.2622185975709204
          z: -0.6525133891660432
          w: 0.6585534402654153
      observe_table:
        position:
          x: 0.02160863957360322
          y: -0.1310933191355222
          z: 0.33769602460194537
        orientation:
          x: -0.35328551634048977
          y: -0.32020226597268203
          z: -0.5842845082802226
          w: 0.6567126207053827
      zero:
        position:
          x: 0.0210077843415008
          y: -0.278950111258735
          z: 0.24858389783148477
        orientation:
          x: -0.4740206645801369
          y: -0.4668084047044082
          z: -0.523033090590171
          w: 0.532757645647648
  ros2_control:
    hardware_plugin: so101_hardware/SO101SystemHardware
    port: /dev/ttyACM0
    calib_file: $(env HOME)/.calibrate/so101_follower_calibrate.json
    joint_names:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    reset_positions:
      '1': 0.0
      '2': -1.5854
      '3': 1.5708
      '4': 0.7854
      '5': 0.0
    urdf_path: $(find so101_description)/urdf/lerobot/so101/so101.urdf.xacro
    controllers_config: $(find so101_hardware)/config/so101_controllers.yaml
    controllers:
    - joint_state_broadcaster
    - arm_controller
    - gripper_controller
  peripherals:
  - type: camera
    name: top
    driver: opencv
    index: 0
    width: 640
    height: 480
    fps: 30
    pixel_format: mjpeg2rgb
    frame_id: camera_top_frame
    optical_frame_id: camera_top_optical_frame
    transform:
      parent_frame: world
      x: 0.0419
      y: 0.1123
      z: 0.6136
      roll: 0.057596
      pitch: 1.518436
      yaw: -1.518436
    fovy: 47
  - type: camera
    name: wrist
    driver: opencv
    index: 2
    width: 640
    height: 480
    fps: 60
    pixel_format: mjpeg2rgb
    frame_id: camera_wrist_frame
    optical_frame_id: camera_wrist_optical_frame
    transform:
      parent_frame: gripper
      x: 0.002265
      y: 0.073023
      z: -0.016289
      roll: -1.512475
      pitch: 1.079239
      yaw: -1.541112
    fovy: 46
  - type: camera
    name: front
    driver: realsense
    serial_number: ''
    width: 640
    height: 480
    fps: 30
    pixel_format: bgr8
    enable_pointcloud: false
    align_depth: true
    frame_id: camera_front_link
    optical_frame_id: camera_front_optical_frame
    transform:
      parent_frame: base
      x: 0.0
      y: -0.28
      z: 0.5
      roll: 0.0
      pitch: 1.5708
      yaw: -1.5708
    fovy: 70
  simulation:
    platform: gazebo
    scene: pick_banana
    robot_spawn:
      x: 0.0
      y: 0.3
      z: -0.03
    sim_models_pkg: sim_models
  contract:
    base_contract: $(find robot_config)/config/contracts/act_grab_pan.yaml
    rate_hz: 20
    max_duration_s: 90.0
    observations:
    - key: observation.images.front
      topic: /camera/front/image_raw
      type: sensor_msgs/msg/Image
      peripheral: front
      image:
        resize:
        - 480
        - 640
      align:
        strategy: hold
        stamp: header
        tol_ms: 1500
        max_age_ms: 500
      qos:
        reliability: best_effort
        history: keep_last
        depth: 10
    - key: observation.images.top
      topic: /camera/top/image_raw
      type: sensor_msgs/msg/Image
      peripheral: top
      image:
        resize:
        - 480
        - 640
      align:
        strategy: hold
        stamp: header
        tol_ms: 1500
        max_age_ms: 500
      qos:
        reliability: best_effort
        history: keep_last
        depth: 10
    - key: observation.images.wrist
      topic: /camera/wrist/image_raw
      type: sensor_msgs/msg/Image
      peripheral: wrist
      image:
        resize:
        - 480
        - 640
      align:
        strategy: hold
        stamp: header
        tol_ms: 1500
        max_age_ms: 500
      qos:
        reliability: best_effort
        history: keep_last
        depth: 10
    - key: observation.state
      topic: /joint_states
      type: sensor_msgs/msg/JointState
      selector:
        names:
        - position.1
        - position.2
        - position.3
        - position.4
        - position.5
        - position.6
      align:
        strategy: hold
        stamp: header
        tol_ms: 1500
        max_age_ms: 500
      qos:
        reliability: best_effort
        history: keep_last
        depth: 50
    - key: observation.current
      topic: /so101_follower/joint_currents
      type: ibrobot_msgs/msg/JointCurrent
      selector:
        names:
        - current.1
        - current.2
        - current.3
        - current.4
        - current.5
        - current.6
      align:
        strategy: hold
        stamp: header
        tol_ms: 1500
        max_age_ms: 500
      qos:
        reliability: best_effort
        history: keep_last
        depth: 50
    actions:
    - key: action
      selector:
        names:
        - action.0
        - action.1
        - action.2
        - action.3
        - action.4
      publish:
        topic: /arm_position_controller/commands
        type: std_msgs/msg/Float64MultiArray
        layout: flat
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10
        strategy:
          mode: nearest
          tolerance_ms: 500
      safety_behavior: hold
    - key: action
      selector:
        names:
        - action.5
      publish:
        topic: /gripper_position_controller/commands
        type: std_msgs/msg/Float64MultiArray
        layout: flat
        qos:
          reliability: best_effort
          history: keep_last
          depth: 10
        strategy:
          mode: nearest
          tolerance_ms: 500
      safety_behavior: hold
  teleoperation:
    enabled: true
    active_device: null
    cartesian:
      solver: placo_servo
      placo_servo:
        package: so101_motion
        executable: so101_placo_servo_node.py
        linear_speed: 0.17
        angular_speed: 0.2
    devices:
    - name: so101_leader
      type: leader_arm
      port: /dev/ttyACM1
      calib_file: $(env HOME)/.calibrate/so101_leader_calibrate.json
    - name: phone_teleop
      type: phone
      control_frequency: 50.0
      phone_config:
        backend: webphone
        camera_offset:
        - 0.0
        - -0.02
        - 0.04
        end_effector_bounds:
          min:
          - -0.5
          - -0.5
          - -0.5
          max:
          - 0.5
          - 0.5
          - 0.5
        max_ee_step_m: 0.05
        gripper_speed_factor: 20.0
        gripper_range:
        - 0.0
        - 1.0
      ee_frame_name: gripper
    - name: xbox_controller
      type: xbox_controller
      input_device: /dev/input/js0
      default_mode: joint
      mapping_config: xbox_mapping
      servo_config: so101_servo
      control_params:
        deadzone: 0.1
        joint_velocity_gain: 1.5
        cartesian_linear_speed: 1.0
        cartesian_angular_speed: 1.0
        long_press_duration: 0.5
    - name: vr_teleop
      type: vr_teleop
      control_frequency: 50.0
      vr_config:
        output_profile: so101
        controller_side: right
        host: 0.0.0.0
        port: 8889
        so101_input_mode: pose
        position_scale: 0.7
        so101_position_only: false
        so101_command_stale_s: 0.2
        linear_speed_scale: 1.0
        angular_speed_scale: 1.0
        linear_deadzone: 0.005
        angular_deadzone: 0.05
        so101_gripper_open: 1.0
        so101_gripper_closed: 0.0
    - name: aero_glove_right
      type: hand_retarget
      source_name: mhandpro
      side: right
      source_topic: /hand_sources/mhandpro/right/state
      stale_timeout: 0.2
      calib_file: $(env HOME)/.calibrate/aero_hand_right_calibrate.json
      retargeter:
        type: aero_compact
        aero_thumb_model:
          mcp_ip_weights:
          - 9.4372
          - 12.5
          root_neutral_trims:
          - 0.0
          - 0.0
          root_output_scales:
          - 0.95
          - 0.94
          root_deadband_rad: 0.017453292519943295
          tendon_deadband_rad: 0.05235987755982989
          tendon_output_scale: 0.6
          max_thumb_step_rad:
          - 0.04
          - 0.03
          - 0.04
        aero_finger_model:
          pip_weight: 0.55
          dip_weight: 0.45
          open_threshold_rad: 0.2617993877991494
          closed_threshold_rad: 0.8726646259971648
          active_trim_fraction: 0.08
      target:
        actuator: aero_hand_right
    safety:
      joint_limits:
        '1':
          min: -2.0693
          max: 2.0709
        '2':
          min: -1.92
          max: 1.92
        '3':
          min: -1.6813
          max: 1.6828
        '4':
          min: -1.65806
          max: 1.65806
        '5':
          min: -2.9115
          max: 2.9115
        right_thumb_cmc_abd:
          min: 0.0
          max: 1.7453292519943295
        right_thumb_cmc_flex:
          min: 0.0
          max: 0.9599310885968813
        right_thumb_mcp_ip:
          min: 0.0
          max: 1.5707963267948966
        right_index:
          min: 0.0
          max: 1.5707963267948966
        right_middle:
          min: 0.0
          max: 1.5707963267948966
        right_ring:
          min: 0.0
          max: 1.5707963267948966
        right_pinky:
          min: 0.0
          max: 1.5707963267948966
    active_devices:
    - so101_leader
    - aero_glove_right
  recording:
    bag_base_dir: ~/rosbag/episodes
    storage: mcap
    lerobot_norm_mode: degrees
    extra_topics:
    - /aero_hand_right/commands
    - /aero_hand_right/joint_states
  hand_sources:
    mhandpro:
      type: mhandpro
      enabled: true
      active_control_modes:
      - teleop
      mock: false
      lib_path: $(env MHANDPRO_SDK_LIB)
      sides:
      - right
      require_p_pose: true
      calibration_service: /hand_sources/mhandpro/calibrate_p_pose
      topic_prefix: /hand_sources/mhandpro
      publish_frequency: 50.0
      publish_raw_frame: false
      stale_timeout: 0.2
      startup_timeout: 30.0
      calibration_timeout: 30.0
      p_pose_quality_frames: 5
      p_pose_max_openness: 0.7
      failure_policy: require_all
      auto_reconnect: true
      reconnect_initial_delay: 1.0
      reconnect_max_delay: 10.0
      reconnect_max_attempts: 0
      exclusive_resources:
      - mhandpro_sdk
      replay_rate_hz: 50.0
      replay_segment_seconds: 0.7
  auxiliary_actuators:
    aero_hand_right:
      type: aero_hand
      enabled: true
      active_control_modes:
      - teleop
      mock: false
      port: $(env AERO_HAND_RIGHT_PORT)
      baudrate: 921600
      joint_names:
      - right_thumb_cmc_abd
      - right_thumb_cmc_flex
      - right_thumb_mcp_ip
      - right_index
      - right_middle
      - right_ring
      - right_pinky
      command_topic: /aero_hand_right/commands
      joint_state_topic: /aero_hand_right/joint_states
      command_frequency: 50.0
      state_frequency: 20.0
      command_timeout: 0.25
      estop_topic: /emergency_stop
      estop_behavior: hold
