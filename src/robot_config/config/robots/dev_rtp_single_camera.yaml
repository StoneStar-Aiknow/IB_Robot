# Development-only single-camera RTP contract profile.
#
# Overlay of the so101_single_arm provider configuration: the top camera is
# carried over RTP H.264 to a distributed policy; the wrist and front cameras
# are disabled and the contract has no action consumer. Hardware and camera
# drivers are runtime-owned (so101_robot/profiles/so101_single_arm.yaml).
robot:
  name: dev_rtp_single_camera
  base_config: so101_single_arm

  control_modes:
    model_inference:
      inference:
        pipelines:
          policy:
            model_path: models/development
            deployment: cpu
            execution_mode: distributed

  peripherals:
    - type: camera
      name: wrist
      disabled: true
    - type: camera
      name: front
      disabled: true

  contract:
    rate_hz: 30
    observations:
      - key: observation.images.top
        topic: /camera/top/image_raw
        type: sensor_msgs/msg/Image
        peripheral: top
        image: {resize: [480, 640], encoding: rgb8}
        transport:
          mode: rtp
          stream_id: top
          endpoint: {host: 127.0.0.1, port: 5004}
          encoder_backend: software
          decoder_backend: software
          h264: {profile: main, bitrate_bps: 4000000, gop_frames: 15}
          media: {width: 640, height: 480, frame_rate_hz: 30, pixel_format: nv12, color_space: bt709, color_range: limited}
      - key: observation.state
        interface: joint.state
    actions: []
