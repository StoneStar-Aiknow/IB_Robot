# AgiBot X2 deployment that runs the platform's preset social gestures as
# embodied skills.
#
# The base configuration (aimdk_x2.yaml) stays the runtime author's: it selects
# the aimdk_robot runtime and states what the application requires. This file
# only adds the skill stack. The X2 runtime owns its own motion (vendor
# motion-control tier): there is no public model, joint trajectory, kinematics
# or ee pose, so the embodied stack runs without an arm surface and every skill
# is a delegated runtime_named_motion skill bound to one runtime motion name.
#
# Launch with control_mode:=named_motion. Motion stays disabled until the
# operator passes motion_authorized:=true; named motions cannot be cancelled
# through the skill path, and /runtime/stop is the operator interrupt.
robot:
  base_config: aimdk_x2.yaml
  name: aimdk_x2_skills

  # For an X2 with OmniHand dexterous hands, one or two: this entry selects the
  # OmniHand profile, the one that declares the gesture recordings the skills
  # replay. A claw X2 cannot use it (nor aimdk_x2_voice, which layers on it):
  # its runtime faults at startup on the hand type mismatch. type must match
  # the profile's public identity; aimdk_x2.yaml and the profiles are used
  # unchanged.
  type: x2_ultra_omnihand
  runtime:
    profile: x2_ultra_omnihand

  # Lists replace rather than merge, so this is the whole list: the base list
  # with gripper.1d (not declared by the OmniHand profile; launch would wait
  # for it forever) swapped for hand.multi_joint.
  capabilities:
    requires:
      - joint.state
      - joint.position_stream
      - hand.multi_joint
      - base.cmd_vel
      - base.navigation_gate
      - motion.named
      - motion.posture
      - perception.camera
      - perception.imu
      - power.state
      - diagnostics.codes
      - interaction.tts
      - interaction.expression
      - interaction.led
      - runtime.stop

  default_control_mode: "named_motion"
  skill_required_control_mode: "named_motion"

  control_modes:
    named_motion:
      description: "Runtime-owned named motions (preset gestures)"
      description_cn: "运行时自持的命名动作（预设手势）"
      # The runtime's upper-body stream mode, where it replays the gestures
      # from recorded arm trajectories: skills run without leaving the mode the
      # teleop and grasp stacks use. The executor enters it from idle on the
      # first skill and stays; it never requests idle, which would clear a stop
      # latch.
      runtime_mode: stream
      inference:
        enabled: false
      executor:
        # No action dispatcher: this mode commands no streaming channel.
        enabled: false

  embodied:
    enabled: true
    arm_surface: false
    skill_catalog_profile: aimdk_x2_skills
    skill_catalog_source_mode: development
    runtime_named_motion:
      enabled: true
      # Logical binding: launch waits for this runtime interface and binds its
      # endpoint from the live description (never a hard-coded name).
      interface: motion.named
      kind: action
      type: ibrobot_msgs/action/ExecuteNamedMotion
      requires:
        capability: motion.named

# The voice chain lives in aimdk_x2_voice.yaml, which layers on this profile.
# It is not enabled here on purpose: it needs the out-of-repo X-ASR bundle and
# the runtime audio.speech interface, so a deployment that only wants the
# preset gestures must not inherit either dependency.
