# AgiBot X2 grasp, shared by its host deployments: the OmniHand X2 and the grasp
# pipeline, without the models. Launch a host deployment, never this file:
#
# Extends aimdk_x2.yaml with the OmniHand runtime profile and the model services
# the X2 grasp pipeline calls. The grasp executor itself is not wired here yet;
# this configuration brings up the runtime and serves the models it will use.
#
# Both hosts launch the same deployment: the robot-side host runs the runtime,
# the Gateway, the models and manipulation_execution's grasp_pipeline_node with
# the X2 backends (aimdk_grasp.remote_head); the Orin runs the grasp head
# (aimdk_grasp's x2_grasp_head.launch.py): the head camera's capture and
# registration, the collision scene, cuRobo and the target watch, beside the
# camera's raw depth and its CUDA GPU. The robot-side host needs no CUDA for
# that. The split is temporary and the X2's alone (aimdk_grasp.split); without
# it the X2 runs aimdk_grasp.backend:x2_grasp_backends with no backend_options.head.
#
# The vendor forbids subscribing raw camera streams across compute units, so
# the pipeline sends images to the model services rather than the services
# subscribing to the head camera. The X2 backends refuse this file on its own:
# it names no model deployment.

robot:
  base_config: aimdk_x2.yaml
  name: aimdk_x2_grasp
  # Must match the selected runtime profile's public robot identity.
  type: x2_ultra_omnihand

  runtime:
    profile: x2_ultra_omnihand

  capabilities:
    # The OmniHand profile declares dexterous-hand capabilities instead of
    # gripper.1d; every other requirement is the base configuration's.
    requires:
      - joint.state
      - joint.position_stream
      - hand.multi_joint
      - hand.gesture
      - base.cmd_vel
      - base.navigation_gate
      - motion.named
      - motion.posture
      - perception.camera
      - perception.imu
      - power.state
      - diagnostics.codes
      - interaction.tts
      - interaction.expression
      - interaction.led
      - runtime.stop

  # Arm travel the motion-control unit enforces, in radians, keyed by joint
  # name. From the vendor SDK's extra/mc-rl/x2_urdf/X2_URDF-v1.3.0/x2_ultra.urdf,
  # not from aimdk_description: the published URDF carries the same version
  # label with different values on shoulder_roll, wrist_pitch and wrist_roll.
  # aimdk_grasp narrows the planning model to the left arm's entries, never
  # widens it, so planning stays inside both ranges. The same values are the
  # mirror's motion_imitation_stream.mock_playback.arm_limits
  # (aimdk_x2_magicmirror.yaml); they become one entry when the grasp and mirror
  # configurations merge, and test_aimdk_x2_grasp_config keeps them equal until then.
  arm_limits:
    left_shoulder_pitch_joint: [-3.0800, 2.0400]
    left_shoulder_roll_joint: [-0.0610, 2.9930]
    left_shoulder_yaw_joint: [-2.5560, 2.5560]
    left_elbow_joint: [-2.3556, 0.0000]
    left_wrist_yaw_joint: [-2.5560, 2.5560]
    left_wrist_pitch_joint: [-0.5580, 0.5580]
    left_wrist_roll_joint: [-1.5710, 0.7240]
    right_shoulder_pitch_joint: [-3.0800, 2.0400]
    right_shoulder_roll_joint: [-2.9930, 0.0610]
    right_shoulder_yaw_joint: [-2.5560, 2.5560]
    right_elbow_joint: [-2.3556, 0.0000]
    right_wrist_yaw_joint: [-2.5560, 2.5560]
    right_wrist_pitch_joint: [-0.5580, 0.5580]
    right_wrist_roll_joint: [-0.7240, 1.5710]

