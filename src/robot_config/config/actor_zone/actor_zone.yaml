version: 1
# 画区域时用的图像尺寸。运行时帧尺寸不同，就按比例缩放，并 warn 一次。
image_size: [1344, 972]
# 画面带：框整个落在这个区间外面的人，完全不管。
crop_x: [267, 1053]
# 地面区域：图上 4 个脚的位置，顺序固定。
#   近左、近右、远右、远左（近 = 靠机器人 = 图上偏下）
floor_quad:
  - [484, 930]   # near_left
  - [760, 931]   # near_right
  - [703, 828]   # far_right
  - [550, 826]   # far_left
# 可选，默认 30，最小 16。近边两个点离画面底至少这么多 px。
near_edge_margin_px: 30
# 谁、什么时候、对着哪张图画的
