ekf_filter_node:
    ros__parameters:
        frequency: 15.0
        two_d_mode: true
        publish_acceleration: false
        publish_tf: true
        use_sim_time: false

        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom

        # Minimal validated baseline for current LeKiwi static-map navigation.
        # The only active input is the bridge-produced wheel odometry topic.
        odom0: /odom
        odom0_config: [
            false, false, false,
            false, false, false,
            true, true, false,
            false, false, true,
            false, false, false
        ]
        odom0_relative: false
        odom0_queue_size: 10
