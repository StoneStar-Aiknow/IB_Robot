# X2 #3 on site: every template on. Only used when the robot yaml points
# mirror_session.motion_template_config here (with template_play, the gesture
# model and preset_motions.gesture switched on, motion_enabled kept false; see
# motion-template-integ-yaml). The blend settings are the code defaults, the
# same as in motion_template.yaml. Must sit next to segments.json.
motion_template:
  enabled: true
  segments_file: segments.json
  label_topic: /preset_motions/state
  play_topic: /mirror_session/template_play
  status_topic: /aimdk_dataplane/template_status
  dataplane_status_topic: /aimdk_runtime/dataplane/status
  # Real robot 11-20 (run-1120-183345): /preset_motions/state reached the
  # session with 0.5-0.9 s holes while the gesture was held, and 0.5 cut A
  # short and made each hole a new episode. A real inactive still exits at
  # once; only a dead matcher is noticed at most 0.5 s later.
  label_stale_s: 1.0
  templates:
    overhead_heart: {enabled: true, segments: [overhead_heart]}
    heart: {enabled: true, segments: [heart]}
    holy: {enabled: true, segments: [holy]}
    xsign: {enabled: true, segments: [xsign_left_front, xsign_right_front]}
