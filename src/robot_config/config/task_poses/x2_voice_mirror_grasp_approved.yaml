# Hardware-approved task poses of the X2 used by aimdk_x2_voice_mirror_grasp.
# Same joint targets as x2_example.yaml, approved on the robot by its operator
# on 2026-11-07 (right OmniHand installed, rest-pose shoulder-roll margin
# applied). The committed commissioning/fixed_poses.json embeds this snapshot
# (task-pose digest 5853a96d...); changing a target here requires recompiling
# that library and a new hardware approval.
schema_version: 1
robot_type: x2_ultra_omnihand
joint_names:
- left_shoulder_pitch_joint
- left_shoulder_roll_joint
- left_shoulder_yaw_joint
- left_elbow_joint
- left_wrist_yaw_joint
- left_wrist_pitch_joint
- left_wrist_roll_joint
- right_shoulder_pitch_joint
- right_shoulder_roll_joint
- right_shoulder_yaw_joint
- right_elbow_joint
- right_wrist_yaw_joint
- right_wrist_pitch_joint
- right_wrist_roll_joint
poses:
  arms_rest:
    description: 双臂放下的休息位。肩部侧摆保留限位余量，并张开配置的空手。
    aliases:
    - 双臂放下
    - 放下双臂
    - 双手放下
    - 放下双手
    - 双臂休息位
    joint_positions:
      left_shoulder_pitch_joint: 0.366
      left_shoulder_roll_joint: 0.08
      left_shoulder_yaw_joint: -0.008
      left_elbow_joint: -1.164
      left_wrist_yaw_joint: 0.003
      left_wrist_pitch_joint: 0.007
      left_wrist_roll_joint: -0.001
      right_shoulder_pitch_joint: 0.364
      right_shoulder_roll_joint: -0.08
      right_shoulder_yaw_joint: 0.019
      right_elbow_joint: -1.175
      right_wrist_yaw_joint: 0.005
      right_wrist_pitch_joint: 0.007
      right_wrist_roll_joint: -0.003
    position_tolerance_rad: 0.1
    stable_sec: 0.3
    timeout_sec: 30.0
    max_state_age_sec: 0.5
    hardware_approved: true
    hands:
      left: open
      right: open
    unloaded_operation_approved: true
  grasp_ready:
    description: 抓取准备位。双臂屈肘平举，双手位于桌子两侧，并张开配置的空手。
    aliases:
    - 准备位
    - 回准备位
