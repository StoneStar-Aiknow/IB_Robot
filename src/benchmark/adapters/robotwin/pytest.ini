[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# The installed ROS launch_testing pytest plugin's hook signature is
# incompatible with the installed pytest; disable it so colcon test runs.
addopts = -v --tb=short -p no:launch_testing -p no:launch_ros
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
