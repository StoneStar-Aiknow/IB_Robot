# Test fixture: a dual-arm robot config with the body facts agent_eval reads
# (the values of robodojo_x5; test_body checks they still match).
robot:
  name: dual_arm_fixture
  runtime:
    provider: fixture_robot
    profile: dual_arm_fixture
  task_dispatch:
    groups:
      left_arm: {gripper_joint: left_gripper}
      right_arm: {gripper_joint: right_gripper}
  embodied:
    execution:
      arm_groups: {left: left_arm, right: right_arm}
      gripper_approach:
        axis: x
        presets:
          horizontal: {orientation: {x: 0.0, y: 0.0, z: 0.7071068, w: 0.7071068}}
          top_down: {orientation: {x: -0.5, y: 0.5, z: 0.5, w: 0.5}}
          top_down_rotated: {orientation: {x: 0.0, y: 0.7071068, z: 0.0, w: 0.7071068}}
          tilted_45: {orientation: {x: -0.2705981, y: 0.2705981, z: 0.6532815, w: 0.6532815}}
    agent:
      planner:
        mode: vlm
        provider: openai_compatible
        base_url: http://127.0.0.1:18080/v1
        api_key_env: FIXTURE_PLANNER_KEY
        model: fixture-model
