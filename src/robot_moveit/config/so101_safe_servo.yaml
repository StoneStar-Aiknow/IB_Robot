# SO-101 Safe Servo configuration.
#
# Loaded by so101_safe_servo_node when
#   robot.teleoperation.cartesian.solver == 'safe_servo'.
# All keys correspond to ROS 2 parameter names declared in
# scripts/so101_safe_servo_node.py — keep names in sync.
#
# Design philosophy:
#   - position-only IK targets gripper while pending J4/J5 values are injected
#     into the request start state.
#   - joints 4 (pitch) and 5 (roll) are driven by direct accumulators on the
#     RAW tool-frame angular command, bypassing the Jacobian entirely.
#   - Published J4/J5 blend the direct wrist accumulator with the IK-returned
#     wrist joints. Default is 90% direct control + 10% IK correction.
#   - This solver cannot fail on rotational under-actuation by construction.

# --- planning targets ----------------------------------------------------
move_group_name: arm
planning_frame: base
ik_link_name: gripper           # SRDF arm tip used for position-only IK.
                                # J4/J5 are seeded from accumulators and then
                                # blended with the IK result before publish.
                                # arm_joint_names is injected by teleop.py.

# --- wrist split (the Safe Servo trick) ----------------------------------
pitch_joint: "4"
roll_joint: "5"
pitch_axis_index: 1             # 0=x, 1=y, 2=z — int avoids YAML-1.1 boolean trap
roll_axis_index: 2              # 0=x, 1=y, 2=z
pitch_scale: 1.0                # flip sign if operator direction feels inverted
roll_scale: 1.0
# Joint limits: must match the URDF link limits for joint 4 and joint 5.
# (SO101 base xacro: joint 4 ±1.65806 rad; joint 5 ±2.9115 rad.)
# These are the authoritative software-layer limits for this node.
# The node will refuse to start if these keys are absent.
joint_limit_lower:
  pitch: -1.65806
  roll: -2.9115
joint_limit_upper:
  pitch: 1.65806
  roll: 2.9115

# --- safety stack --------------------------------------------------------
# Applied in this order on every input tick BEFORE pending state is updated:
#   1. deadband  – reject Xbox stick zero-drift (no integration of floor noise)
#   2. integrate – candidate = target + raw * dt * scale
#   3. slew clamp – cap |candidate - target| at max_wrist_angular_speed * dt
#   4. joint-limit clamp – clip candidate into URDF limits
angular_deadband: 0.02          # rad/s; values below this are treated as zero
max_wrist_angular_speed: 6.0    # rad/s, HARD ceiling for j4/j5 slew rate.
                                # This is also the physical reference for
                                # safe_servo.angular_speed = 1.0 in robot config
                                # (see SO101SafeServoBackend._MAX_ANGULAR_SPEED_RPS).
                                # Keep in sync with that constant.
                                # 6.0 rad/s ≈ 344°/s, near ST3215 no-load ceiling.

# --- topics & services ---------------------------------------------------
linear_cmd_topic: /so101_safe_servo_node/linear_cmd_base
angular_cmd_topic: /so101_safe_servo_node/angular_cmd_tool
start_service: /so101_safe_servo_node/start
stop_service: /so101_safe_servo_node/stop
command_out_topic: /arm_position_controller/commands

# --- timing (dual non-blocking timers) -----------------------------------
input_period: 0.02              # 50 Hz input/integration tick
ik_publish_period_s: 0.04       # 25 Hz IK solve tick
incoming_command_timeout: 0.5   # >500 ms without input → freeze
target_reset_timeout_s: 2.0     # >2 s idle → re-snap targets to robot state
ik_wall_timeout_s: 2.5          # MUST exceed kinematics_solver_timeout.

# --- safety --------------------------------------------------------------
tf_stale_threshold_s: 0.2
wrist_ik_blend: 0.1             # 0.0 = pure direct wrist, 1.0 = pure IK wrist
wrist_drift_warn_threshold: 0.35 # rad; only logs large IK/direct wrist mismatch
