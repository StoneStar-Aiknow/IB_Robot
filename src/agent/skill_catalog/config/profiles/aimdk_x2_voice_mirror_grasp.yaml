# Voice, gesture, mirror and pick-to-place skills for aimdk_x2_voice_mirror_grasp.
#
# This profile only compiles when grasp_execution and placement_execution are
# both enabled: pick_object and place_in_container target the grasp_pipeline and
# placement_pipeline delegated executors, which the robot config registers from
# those sections. Naming them while a pipeline is off fails with an
# unknown-executor diagnostic, which is the intended guard against exposing a
# skill nothing can run.
#
# The matching robot config enables both pipelines and requires their model
# bundles and delegated grasp head to be available at launch.
# Single-hand and dual-hand deployments share this catalog. The mounting and
# preparation policy belongs to robot_config/config/robots/aimdk_x2_voice_mirror_grasp.yaml.
schema_version: 1
name: aimdk_x2_voice_mirror_grasp
robot_name: aimdk_x2_voice_mirror_grasp
enabled_skills:
- name: wave_hand
  implementation: x2_runtime_v1
  planner_visible: true
- name: handshake
  implementation: x2_runtime_v1
  planner_visible: true
- name: raise_hand
  implementation: x2_runtime_v1
  planner_visible: true
- name: blow_kiss
  implementation: x2_runtime_v1
  planner_visible: true
- name: clap_hands
  implementation: x2_runtime_v1
  planner_visible: true
- name: mirror_start
  implementation: x2_runtime_v1
  planner_visible: true
- name: mirror_stop
  implementation: x2_runtime_v1
  planner_visible: true
- name: self_introduction
  implementation: x2_runtime_v1
  planner_visible: true
- name: pick_object
  # Reuse the preparation-aware 150 s implementation, not its robot profile.
  implementation: aimdk_x2_grasp_task_poses
  planner_visible: true
- name: free_pose
  implementation: x2_runtime_v1
  planner_visible: true
- name: return_to_task_pose
  implementation: x2_runtime_v1
  planner_visible: true
- name: place_in_container
  implementation: aimdk_x2_grasp
  planner_visible: true
