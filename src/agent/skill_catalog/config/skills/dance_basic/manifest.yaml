schema_version: 1
name: dance_basic
version: 1.0.0
semantic_level: skill
description:
  summary: Play a multi-joint rhythmic dance sequence (shoulder/elbow/wrist).
  category: dance
  when_to_use:
  - dance
  - play a rhythm motion for entertainment
  do_not_use:
  - condition: act cute or seek attention
    instead_use: act_cute
  - condition: celebrate a success
    instead_use: celebrate
  - condition: spin cheerfully upright
    instead_use: happy_spin_upright
  aliases_zh:
  - 跳舞
  - 跳个舞
  - 舞动
  aliases_en:
  - dance
  - groove
  motion_scope:
  - shoulder
  - elbow
  - wrist
  anchor_pose: home
  intensity: moderate
  duration_sec_estimate: 22.0
  requires_motion_params: false
  rule_entry: true
capability:
  schema_version: 1
  summary: Perform a rhythmic dance gesture.
  domain: manipulation
  moves_robot: true
  required_control_mode: moveit_planning
  parameters:
    type: object
    additionalProperties: false
    properties: {}
    required: []
  recovery_policy: never_retry
implementations:
  so101_arm_v1: implementations/so101_arm_v1.yaml
