schema_version: 1
name: offer_fruit_menu
version: 1.0.0
semantic_level: skill
description:
  summary: Offer the three fruit gifts with a recorded question when no fruit has been named.
  category: social_interaction
  when_to_use:
  - "the visitor wants a fruit gift without naming lemon, apple or orange"
  do_not_use:
  - condition: "the visitor names lemon, apple or orange"
    instead_use: pick_object
  aliases_zh:
  - 选水果
  - 水果礼物
  - 我要水果
  - 有什么水果
  aliases_en:
  - what fruit do you have
  motion_scope: []
  anchor_pose: none
  intensity: subtle
  # Playback of the recorded clip (4.6 s).
  duration_sec_estimate: 5.0
  requires_motion_params: false
capability:
  schema_version: 1
  summary: "Ask with a recorded question which of 柠檬, 苹果 or 橙子 the visitor wants. Use when the visitor wants a fruit gift but has not named one."
  domain: social
  moves_robot: false
  required_control_mode: named_motion
  parameters:
    type: object
    additionalProperties: false
    properties: {}
    required: []
  # Playing the clip again is the caller's decision; nothing is retried here.
  recovery_policy: never_retry
implementations:
  x2_runtime_v1: implementations/x2_runtime_v1.yaml
