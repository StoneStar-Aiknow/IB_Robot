schema_version: 1
name: rotate_gripper_ccw
version: 1.0.0
semantic_level: atomic_operator
description:
  summary: Rotate the gripper counter-clockwise by a caller-supplied angle.
  category: rotation
  when_to_use:
  - twist the wrist counter-clockwise
  - rotate the held object counter-clockwise
  do_not_use:
  - condition: rotate clockwise
    instead_use: rotate_gripper_cw
  aliases_zh:
  - 逆时针旋转
  - 逆时针转
  aliases_en:
  - rotate counter-clockwise
  - twist ccw
  motion_scope:
  - wrist
  anchor_pose: none
  intensity: subtle
  duration_sec_estimate: 1.5
  requires_motion_params: true
capability:
  schema_version: 1
  summary: Rotate the gripper counter-clockwise by a requested angle.
  domain: manipulation
  moves_robot: true
  required_control_mode: moveit_planning
  parameters:
    type: object
    additionalProperties: false
    properties:
      motion_distance:
        type: number
        exclusiveMinimum: 0
        unit: degrees
    required:
    - motion_distance
  recovery_policy: ask_user
capability_variants:
  robodojo_arx_x5_v1:
    summary: Twist one arm's wrist counter-clockwise (seen facing the fingers) about the gripper's approach axis by a requested angle.
    parameters:
      type: object
      additionalProperties: false
      properties:
        arm_side:
          type: string
          enum:
          - left
          - right
          - auto
        motion_distance:
          type: number
          exclusiveMinimum: 0
          unit: degrees
      required:
      - motion_distance
implementations:
  robodojo_arx_x5_v1: implementations/robodojo_arx_x5_v1.yaml
  so101_arm_v1: implementations/so101_arm_v1.yaml
description_variants:
  robodojo_arx_x5_v1:
    summary: Twist one arm's wrist counter-clockwise (seen facing the fingers) about the gripper's approach axis; the grasp point stays put and the line the two fingers close along turns by the angle.
    category: rotation
    when_to_use:
    - turn the fingers so they close across a long thin object (handle, shaft) instead of along it
    - align the finger opening with the narrow side of an object before descending
    do_not_use:
    - condition: twist clockwise
      instead_use: rotate_gripper_cw
    motion_scope:
    - wrist
    intensity: moderate
