schema_version: 1
name: pick_object
version: 1.0.0
semantic_level: skill
description:
  summary: Verify any configured task preparation posture, then detect, grasp, verify, and transport the requested object to the configured container pose.
  category: manipulation
  when_to_use:
  - pick up a visible object identified by a text query
  do_not_use:
  - condition: the object is already held and must be placed into a visible container
    instead_use: place_in_container
  aliases_zh:
  - 抓取物体
  - 拿起物体
  aliases_en:
  - pick object
  - grasp object
  motion_scope:
  - arm
  - gripper
  anchor_pose: none
  intensity: moderate
  duration_sec_estimate: 120.0
  requires_motion_params: false
capability:
  schema_version: 1
  summary: Verify any configured task preparation posture before fresh perception, then detect, grasp, verify, and transport the requested object to the configured container pose.
  domain: manipulation
  moves_robot: true
  required_control_mode: moveit_planning
  parameters:
    type: object
    additionalProperties: false
    properties:
      target_name:
        type: string
        freeform: true
    required:
    - target_name
  recovery_policy: ask_user
implementations:
  aimdk_x2_grasp: implementations/aimdk_x2_grasp.yaml
  aimdk_x2_grasp_task_poses: implementations/aimdk_x2_grasp_task_poses.yaml
  aimdk_x2_summit_fruit: implementations/aimdk_x2_summit_fruit.yaml
  lekiwi_handeye_realsense_grasp: implementations/lekiwi_handeye_realsense_grasp.yaml
  lekiwi_handeye_realsense_grasp_pc: implementations/lekiwi_handeye_realsense_grasp_pc.yaml
description_variants:
  # The fixed fruit menu of the X2 exhibition deployment. Only the planner's
  # choice narrows; the executor still takes any target_name.
  aimdk_x2_summit_fruit:
    summary: >-
      Pick the fruit gift the visitor chose. Today only 柠檬, 苹果 and 橙子 are available:
      target_name must be exactly "a lemon", "an apple" or "an orange".
      For every fruit choice, plan pick_object immediately followed by place_in_container
      in the SAME workflow with the SAME target_name. Use the configured fruit_delivery.container_name
      from the deployment context for the place step; never pick alone or invent a container.
      The X2 retains the fruit only for this adjacent paired place step, then verifies placement.
      For any other fruit reply 今天可以选柠檬、苹果和橙子，你想要哪一种？ without using this skill.
      For a personal belonging or a request to hand something over reply 今天只抓取展台上的水果礼物。你想选哪一种？
      If the choice is ambiguous reply 请说一下水果名称：柠檬、苹果，还是橙子？
    category: manipulation
    when_to_use:
    - the visitor names lemon, apple or orange
    do_not_use:
    - condition: the visitor wants a fruit gift without naming one
      instead_use: offer_fruit_menu
    aliases_zh:
    - 柠檬
    - 苹果
    - 橙子
    aliases_en:
    - lemon
    - apple
    - orange
    motion_scope:
    - arm
    - gripper
    anchor_pose: none
    intensity: moderate
    duration_sec_estimate: 70.0
    requires_motion_params: false
  # The X2 puts the object back where it was after holding it lifted; it has
  # no container to transport it to.
  aimdk_x2_grasp:
    summary: >-
      Detect and grasp the requested object with the selected hand, lift and hold it, then put it back.
      The X2 selects the arm from the object's side unless its configuration forces one arm.
      To put the object into a container, follow this step immediately with place_in_container
      for the same target_name in the same workflow; the object is then handed over instead of put back.
      Use a short English object phrase for target_name, such as "an apple";
      translate Chinese object names and preserve attributes such as color.
    category: manipulation
    when_to_use:
    - pick up a visible object identified by a text query
    aliases_zh:
    - 抓取物体
    - 拿起物体
    aliases_en:
    - pick object
    - grasp object
    motion_scope:
    - arm
    - gripper
    anchor_pose: none
    intensity: moderate
    duration_sec_estimate: 40.0
    requires_motion_params: false
  aimdk_x2_grasp_task_poses:
    summary: >-
      Verify the configured preparation posture, then detect and grasp the requested object
      with the selected hand, lift and hold it, then put it back.
      The X2 selects the arm from the object's side unless its configuration forces one arm.
      To put the object into a container, follow this step immediately with place_in_container
      for the same target_name in the same workflow; the object is then handed over instead of put back.
      Use a short English object phrase for target_name, such as "an apple";
      translate Chinese object names and preserve attributes such as color.
    category: manipulation
    when_to_use:
    - prepare the arms before detecting and grasping a visible object
    aliases_zh:
    - "\u6293\u53D6\u7269\u4F53"
    - "\u62FF\u8D77\u7269\u4F53"
    aliases_en:
    - pick object
    - grasp object
    motion_scope:
    - arm
    - gripper
    anchor_pose: none
    intensity: moderate
    duration_sec_estimate: 70.0
    requires_motion_params: false
