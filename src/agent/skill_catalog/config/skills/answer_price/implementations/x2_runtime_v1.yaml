schema_version: 1
kind: delegated_executor
robot: x2_runtime_v1
executor: runtime_play_audio
binding:
  # Logical clip name; embodied.runtime_play_audio resolves the files (Q17A).
  clip: price_first
required_args: []
# The longest recording runs 8.1 s; the timeout covers playback plus service startup.
timeout_sec: 18.0
