schema_version: 1
kind: delegated_executor
robot: x2_runtime_v1
executor: runtime_play_audio
binding:
  # Logical clip name; embodied.runtime_play_audio resolves the files (Q07).
  clip: gift_wait
required_args: []
# The longest recording runs 2.6 s; the timeout covers playback plus service startup.
timeout_sec: 15.0
