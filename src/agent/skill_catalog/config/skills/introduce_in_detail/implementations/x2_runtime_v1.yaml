schema_version: 1
kind: delegated_executor
robot: x2_runtime_v1
executor: runtime_play_audio
binding:
  # Logical clip name; embodied.runtime_play_audio.clips resolves the file path.
  clip: intro_detail
required_args: []
# The clip runs 21.9 s; the timeout covers playback plus service startup.
timeout_sec: 35.0
