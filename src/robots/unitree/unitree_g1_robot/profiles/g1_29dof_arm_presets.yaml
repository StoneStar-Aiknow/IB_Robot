# Arm-preset development surface. No hand, waist-stream or base command surface.
# Physical execution is not blocked outright: it needs the per-run launch
# arguments preset_operator_confirmed=true and a robot-facing
# runtime_network_interface, plus an explicit or audited expected FSM id, so
# only an operator-supervised session can dispatch. The launch builds a
# run-scoped profile internally; do not persist `confirmed: true` here.
#
# The 23 preset actions below are the operator's GET-only GetActionList report
# from 2026-11-07/09. The keys are the public skill names; every action_name is
# the exact firmware string. GetActionList is compared by exact id+name at
# startup, so a firmware that renames an action leaves it unadvertised: refresh
# this table from a new report instead of relaxing the check.
#
# The user reports having exercised every listed firmware action manually on the
# robot. That is operator-reported verification, not an Agent/automated
# real-robot test result; no Agent dispatch or SDK ExecuteAction was performed
# for this change.
runtime:
  name: unitree_g1_robot
  version: 0.1.0
  type: g1_29dof_arm_presets
simulated: false

# Simulated-transport deployment facts (see g1_29dof_dex3.yaml): the private
# vendor domain on loopback, plus the FSM the mock fixture reports. FSM 802 has
# `g1_arm_example` running (status 0) and accepts a supervised preset dispatch —
# the preset action goes out through that running arm service. Vendor service
# status codes: 0 = running, 1 = stopped.
sim:
  vendor_domain_id: 148
  vendor_network_interface: lo
  mock_initial_fsm_id: 802
joint_state_topic: /joint_states
joints:
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_hip_yaw_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint
  - waist_yaw_joint
  - waist_roll_joint
  - waist_pitch_joint
  - left_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - left_elbow_joint
  - left_wrist_roll_joint
  - left_wrist_pitch_joint
  - left_wrist_yaw_joint
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_joint
  - right_wrist_roll_joint
  - right_wrist_pitch_joint
  - right_wrist_yaw_joint
arm_joints: []
gripper_joints: []
modes:
  initial: idle
  idle:
    controllers: []
    transitions: []
command_channels: []
capabilities:
  joint.state: {joint_count: 29, rate_hz: 50.0}
  motion.named:
    # Static catalog surface. The same 23 names must appear in
    # vendor.arm_actions and vendor.preset_commissioning.allowed_arm_actions;
    # the runtime checks all three sets at startup. Listing is not a claim that
    # every action is admissible in the current FSM (see the limits below).
    names:
      - release_arm
      - turn_back_wave
      - blow_kiss_with_both_hands
      - blow_kiss_with_left_hand
      - blow_kiss_with_right_hand
      - arms_horizontal
      - clamp
      - high_five
      - hug
      - make_heart_with_both_hands
      - make_heart_with_right_hand
      - refuse
      - right_hand_up
      - ultraman_ray
      - wave_under_head
      - wave_above_head
      - shake_hand
      - box_left_hand_win
      - box_right_hand_win
      - box_both_hand_win
      - right_hand_on_heart
      - both_hands_up_deviate_right
      - forward_push
  runtime.status: {}
  # Local admission closure only; no physical stop guarantee is advertised.
interfaces:
  motion.named:
    capability: motion.named
    kind: action
    direction: serve
    endpoint: /motion/execute_named
    message_type: ibrobot_msgs/action/ExecuteNamedMotion
teleoperation: {enabled: false}
vendor:
  preset_only: true
  # Firmware limits reported by the operator's GET-only query. No other limits
  # are asserted here:
  #   * action 1 (turn_back_wave) reports FSM 500/501 only;
  #   * actions 20/21/28/29/30/36 report mode_machine 5/6.
  # The runtime is read-only on the current FSM 802. It must not call SetFsmId
  # to make an action available; when a limit does not hold, local admission
  # rejects the request with the reason and the catalog listing stays visible.
  #
  # release_arm (ID 99) is a control-ownership operation, not a normal gesture.
  # It must never be auto-inserted as a recovery/finishing step, and its
  # catalog recovery policy is never_retry.
  preset_commissioning:
    # Kept as a full map exactly equal to vendor.arm_actions (anchored so the
    # published file carries one copy); the runtime compares the mappings
    # exactly, so a name-only list cannot hide an id/name drift.
    allowed_arm_actions: &preset_actions
      release_arm: {action_id: 99, action_name: release_arm}
      turn_back_wave: {action_id: 1, action_name: turn_back_wave, fsm_ids: [500, 501]}
      blow_kiss_with_both_hands: {action_id: 11, action_name: blow_kiss_with_both_hands}
      blow_kiss_with_left_hand: {action_id: 12, action_name: blow_kiss_with_left_hand}
      blow_kiss_with_right_hand: {action_id: 13, action_name: blow_kiss_with_right_hand}
      arms_horizontal: {action_id: 15, action_name: both_hands_up}
      clamp: {action_id: 17, action_name: clamp}
      high_five: {action_id: 18, action_name: high_five}
      hug: {action_id: 19, action_name: hug}
      make_heart_with_both_hands: {action_id: 20, action_name: make_heart_with_both_hands, mode_machine: [5, 6]}
      make_heart_with_right_hand: {action_id: 21, action_name: make_heart_with_right_hand, mode_machine: [5, 6]}
      refuse: {action_id: 22, action_name: refuse}
      right_hand_up: {action_id: 23, action_name: right_hand_up}
      ultraman_ray: {action_id: 24, action_name: ultraman_ray}
      wave_under_head: {action_id: 25, action_name: wave_under_head}
      wave_above_head: {action_id: 26, action_name: wave_above_head}
      shake_hand: {action_id: 27, action_name: shake_hand}
      box_left_hand_win: {action_id: 28, action_name: box_left_hand_win, mode_machine: [5, 6]}
      box_right_hand_win: {action_id: 29, action_name: box_right_hand_win, mode_machine: [5, 6]}
      box_both_hand_win: {action_id: 30, action_name: box_both_hand_win, mode_machine: [5, 6]}
      right_hand_on_heart: {action_id: 33, action_name: right_hand_on_heart}
      both_hands_up_deviate_right: {action_id: 34, action_name: both_hands_up_deviate_right}
      forward_push: {action_id: 36, action_name: forward_push, mode_machine: [5, 6]}
    required_services:
      ai_sport: 0
      g1_arm_example: 0
  mode_machine: 5
  mode_pr: 1
  topics:
    low_state: rt/lowstate
  rpc:
    timeout_s: 5.0
  arm_actions: *preset_actions
  postures: {}
  named_motion:
    allowed_modes: [idle]
  arm_sdk:
    feedback_staleness_s: 0.5
