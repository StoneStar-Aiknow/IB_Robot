    left_hand_index_1_joint: {lower: -1.745329, upper: 0.0, effort: 1.4, velocity: 12.0}
    left_hand_middle_0_joint: {lower: -1.570796, upper: 0.0, effort: 1.4, velocity: 12.0}
    left_hand_middle_1_joint: {lower: -1.745329, upper: 0.0, effort: 1.4, velocity: 12.0}
    right_hand_thumb_0_joint: {lower: -1.047198, upper: 1.047198, effort: 2.45, velocity: 3.14}
    right_hand_thumb_1_joint: {lower: -1.047198, upper: 0.610865, effort: 1.4, velocity: 12.0}
    right_hand_thumb_2_joint: {lower: -1.745329, upper: 0.0, effort: 1.4, velocity: 12.0}
    right_hand_index_0_joint: {lower: 0.0, upper: 1.570796, effort: 1.4, velocity: 12.0}
    right_hand_index_1_joint: {lower: 0.0, upper: 1.745329, effort: 1.4, velocity: 12.0}
    right_hand_middle_0_joint: {lower: 0.0, upper: 1.570796, effort: 1.4, velocity: 12.0}
    right_hand_middle_1_joint: {lower: 0.0, upper: 1.745329, effort: 1.4, velocity: 12.0}
  # Low-level expert tier, default OFF (design D11): rt/lowcmd publishing and
  # the CRC32 requirement are not implemented in this change; gains are data
  # only while the tier is disabled.
  expert_joint_tier:
    enabled: false
    command_topic: rt/lowcmd
    gains:
      arm: {kp: 60.0, kd: 1.5}
      waist: {kp: 60.0, kd: 1.5}

# ---------------------------------------------------------------------------
# Peripherals composed by the runtime from shared drivers (design D8): the
# D435 camera and the MID-360 lidar are NOT published by the vendor SDK.
# Instance values (IPs, serials) arrive via deployment peripherals fragments;
# the defaults here carry only what the URDF fixes plus conservative
# placeholders. The declared endpoints are the ones peripheral_nodes actually
# serves when enabled.
# ---------------------------------------------------------------------------
peripherals:
  - type: camera
    name: head_front
    driver: realsense
    frame_id: d435_link
    # unverified: optical frame naming, confirmed on the unit (gate 6.1).
    optical_frame_id: d435_link
    width: 640
    height: 480
    fps: 30
    enable_depth: true
    align_depth: true
  - type: lidar
    name: chest_front
    driver: livox_mid360
    frame_id: mid360_link
    xfer_format: 0
    publish_freq: 10.0
    pointcloud_topic: /livox/lidar
    imu_topic: /livox/imu
    # unverified: MID-360 lidar_ip / host network on the G1 compute board;
    # overridden by deployment fragments, never hand-edited per unit.
    lidar_ip: 192.168.1.100
    host_ip: 192.168.1.10

# Lidar-inertial odometry off by default: enabling it requires the MID-360
# network facts to be confirmed first (gate 6.1). fast_lio_nodes composes from
# the lidar peripheral; the output feeds base.odom-style localization only when
# enabled.
fast_lio:
  enabled: false
  odom_frame: odom
  source_body_frame: body
  output_topic: /odometry/filtered

# ---------------------------------------------------------------------------
# Public interfaces merged verbatim into the exported description.
#
# The bridge republishes vendor-sensed state (IMU from LowState.imu_state)
# onto neutral endpoints, and serves vendor request/response surfaces with
# ibrobot_msgs types so no generic consumer links unitree_hg or unitree_api.
# Vendor capabilities that need a request/response surface are served here;
# nothing vendor-private is exported.
#
# Two entries are deliberately absent: power.state (which vendor topic
# publishes the pack state is unverified, gate 6.1) and audio.play (the voice
# service plays named streams, not a documented PCM topic, gate 6.1). They
# return with their sources confirmed on hardware.
# ---------------------------------------------------------------------------
interfaces:
  imu.body:
    capability: perception.imu
    kind: topic
    direction: publish
    endpoint: /imu/data
    message_type: sensor_msgs/msg/Imu
    # unverified: which URDF IMU frame (imu_in_torso vs imu_in_pelvis)
    # LowState.imu_state reports; frame_id stays unset until confirmed.
    rate_hz: 500.0
    qos: {reliability: best_effort, durability: volatile, history: keep_last, depth: 10}
  motion.named:
    capability: motion.named
    kind: action
    direction: serve
    endpoint: /motion/execute_named
    message_type: ibrobot_msgs/action/ExecuteNamedMotion
  speech.speak:
    capability: interaction.tts
    kind: service
    direction: serve
    endpoint: /speech/speak
    message_type: ibrobot_msgs/srv/SpeakText
  led.set_pattern:
    capability: interaction.led
    kind: service
    direction: serve
    endpoint: /led/set_pattern
    message_type: ibrobot_msgs/srv/SetLedPattern
