    right_wrist_yaw_joint: {lower: -1.614430, upper: 1.614430, effort: 5.0, velocity: 22.0}
    left_hand_thumb_0_joint: {lower: -1.047198, upper: 1.047198, effort: 2.45, velocity: 3.14}
    left_hand_thumb_1_joint: {lower: -0.610865, upper: 1.047198, effort: 1.4, velocity: 12.0}
    left_hand_thumb_2_joint: {lower: 0.0, upper: 1.745329, effort: 1.4, velocity: 12.0}
