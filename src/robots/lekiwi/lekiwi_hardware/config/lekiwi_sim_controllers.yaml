controller_manager:
  ros__parameters:
    update_rate: 50
    statistics_publish_rate: 0.0

    enforce_command_limits: true
    handle_exceptions: true

    defaults:
      switch_controller:
        strictness: strict
      allow_controller_activation_with_inactive_hardware: false
      deactivate_controllers_on_hardware_self_deactivate: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    base_controller:
      type: omni_wheel_controller/OmniWheelController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - left_wheel_joint
      - back_wheel_joint
      - right_wheel_joint

base_controller:
  ros__parameters:
    omni_wheel_names:
      - left_wheel_joint   # 60° from +X
      - back_wheel_joint   # 180° from +X (60° + 120°)
      - right_wheel_joint  # 300° from +X (60° + 240°)

    # Original position angles (same as real robot config).
    omni_wheel_angle:
      - 1.0471975511965976   # 60°
      - 3.141592653589793     # 180°
      - -1.0471975511965976   # -60°

    # Robot dimensions
    omni_wheel_distance: 0.132239
    wheel_radius: 0.051

    # Frame IDs
    odom_frame_id: odom
    base_frame_id: base_footprint

    # Disable TF prefix: simulation uses namespace but Nav2 expects unprefixed frames
    tf_frame_prefix_enable: false

    # Use unstamped Twist to match Nav2 cmd_vel relay
    use_stamped_vel: false

    enable_odom_tf: false  # Ground truth odom TF published by Gazebo OdometryPublisher + bridge
    open_loop: false
    position_feedback: false

    # Internal odometry updates at controller_manager rate (50Hz).
    publish_rate: 10.0

    # Command timeout
    cmd_vel_timeout: 0.5

    # Velocity/acceleration limits
    linear:
      x:
        has_velocity_limits: true
        has_acceleration_limits: true
        has_jerk_limits: false
        max_velocity: 0.13
        min_velocity: -0.13
        max_acceleration: 0.65
        min_acceleration: -0.65
      y:
        has_velocity_limits: true
        has_acceleration_limits: true
        has_jerk_limits: false
        max_velocity: 0.11
        min_velocity: -0.11
        max_acceleration: 0.55
        min_acceleration: -0.55
    angular:
      z:
        has_velocity_limits: true
        has_acceleration_limits: true
        has_jerk_limits: false
        max_velocity: 0.44
        min_velocity: -0.44
        max_acceleration: 2.2
        min_acceleration: -2.2
