# LeKiwi runtime profile (lekiwi_nav_grasp): navigation + grasp with 1 isolated IK worker.
#
# Simulation platforms (lekiwi-nav-grasp-sim-platforms D1): the whole robot
# (omni base + SO-101 arm + wrist RealSense + MID-360) runs on Gazebo and
# MuJoCo for the navigation stage of #205. The arm always starts and holds
# at hardware.reset_positions (stowed) on the physics platforms (D4), the
# MuJoCo model composes the shared SO-101 MJCF under base_link (D2
# attachment), and the peripherals this stage does not simulate are excluded
# per platform below (D3). Navigating with a non-stowed arm is outside the
# validated envelope (D7, README).

runtime:
  name: lekiwi_robot
  version: 0.1.0

use_sim: false
sim_platforms: [sdk, gazebo, mujoco]
sim_platform: sdk
# The single source of the lidar pose (D13 of #192): the profile's mid360
# transform defaults and the simulator attachment poses below derive from
# this mount; a unit test pins them to lekiwi_lidar and the mount file.
mid360_mount_file: $(find lekiwi_description)/config/lekiwi_mid360_mount.yaml

# Conformance suite start pose (D7): equal to hardware.reset_positions — the
# arm-motion cases reset here and the base-motion cases reset to the same
# stowed pose first, so every navigation phase starts stowed regardless of
# test order.
conformance:
  start_positions:
    "1": 0.0
    "2": -1.5854
    "3": 1.5708
    "4": 0.7854
    "5": 0.0

# MuJoCo runtime platform (D1): the LeKiwi base template hosts the SO-101
# arm attached from the shared so101.xml.template (D2) at the URDF
# base_link -> base fixed-chain pose (base_link -> arm_root -> base after
# the D8 root_link rename); no forked arm MJCF. No sdf_meshes: the MID-360
# engine extension forbids them (gripper SDF collision is a grasp-stage
# item). No joint_current block: this profile advertises no joint.current
# interface, so the runtime's simulated joint-current publisher stays off.
simulation:
  mujoco:
    template: $(find lekiwi_description)/mujoco/lekiwi_base.xml.template
    meshes_dir: $(find lekiwi_description)/meshes/mujoco
    sdf_meshes: []
    floating_base:
      # the MJCF body with the free joint the BaseVelocityPlugin drives; also
      # the URDF root frame and the relay's validated odometry child frame
      body: base_link
      # the base's own wheel odometry (D3): the relay forwards the twist it
      # reports to the simulator-internal floating-base command topic
      twist_source_topic: /odom
    attachments:
    - name: arm
      template: $(find so101_description)/mujoco/so101.xml.template
      meshes_dir: $(find so101_description)/meshes/lerobot/so101
      root_body: base
      parent_body: base_link
      urdf_parent_link: base_link
      urdf_child_link: base

controller_manager: controller_manager
joint_state_topic: /joint_states
joints: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
arm_joints: ["1", "2", "3", "4", "5"]

description:
  xacro: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro
  xacro_args:
    use_sim: "false"

hardware:
  port: /dev/ttyACM0
  calib_file: $(env HOME)/.calibrate/so101_follower_calibrate.json
  reset_positions:
    "1": 0.0
    "2": -1.5854
    "3": 1.5708
    "4": 0.7854
    "5": 0.0

# Semantic HOME for the arm (public model home_positions), not an actuator
# startup command — same values as hardware.reset_positions above, mirroring
# so101_single_arm. The embodied arm surface and the pick executor's joint-5
# HOME gating read it from the public model (openspec
# cleanup-manipulation-so101-providers D5).
home_positions:
  "1": 0.0
  "2": -1.5854
  "3": 1.5708
  "4": 0.7854
  "5": 0.0

ros2_control:
  controllers_config: $(find lekiwi_hardware)/config/lekiwi_controllers.yaml
  broadcasters: [joint_state_broadcaster, arm_joint_state_broadcaster]
  hardware_components: [RobotSystem]

modes:
  initial: idle
  idle:
    controllers: []
    # MuJoCo platform override (D1/#193 D3.1): a released MuJoCo velocity
    # actuator keeps its last target, so the base controller is NEVER
    # deactivated there — it stays active in idle and base_node is the gate
    # (its zero on a non-base mode, stop latch, closed gate or stale /cmd_vel).
    controllers_by_platform:
      mujoco: [base_velocity_controller]
    transitions: [stream, trajectory, base_navigation]
  stream:
    controllers: [arm_position_controller, gripper_position_controller]
    # MuJoCo keeps the base controller active in the arm modes too (D1):
    # base_node still zeroes the wheels outside base_navigation, so the
    # always-active controller cannot move the base here.
    controllers_by_platform:
      mujoco: [arm_position_controller, gripper_position_controller, base_velocity_controller]
    allows_stream: true
    transitions: [idle, trajectory]
  trajectory:
    controllers: [arm_trajectory_controller, gripper_trajectory_controller]
    controllers_by_platform:
      mujoco: [arm_trajectory_controller, gripper_trajectory_controller, base_velocity_controller]
    allows_trajectory: true
    transitions: [idle, stream, base_navigation]
  base_navigation:
    controllers: [base_velocity_controller]
    allows_base: true
    transitions: [idle, trajectory]

command_channels:
  - channel: arm_stream
    topic: /arm_position_controller/commands
    joints: ["1", "2", "3", "4", "5"]
    modes: [stream]
  - channel: gripper_stream
    topic: /gripper_position_controller/commands
    joints: ["6"]
    modes: [stream]
  - channel: base_cmd_vel
    topic: /cmd_vel
    type: twist
    modes: [base_navigation]
    navigation_gated: true

trajectory_actions:
  - /arm_trajectory_controller/follow_joint_trajectory
  - /gripper_trajectory_controller/follow_joint_trajectory

motion:
  arm_group_name: arm
  base_link: base
  ee_link: gripper
  shoulder_link: shoulder
  # MoveIt plans for the SO-101 arm alone: its model is the SO-101 arm URDF
  # (matching so101_motion's SRDF), rendered with this profile's hardware
  # arguments, and it consumes the arm-only broadcaster. Without an explicit
  # model move_group falls back to /robot_description -- the whole LeKiwi with
  # wheels it never receives state for -- and FK/IK/planning all fail.
  model_xacro: $(find so101_description)/urdf/lerobot/so101/so101.urdf.xacro
  joint_state_topic: /arm_joint_state_broadcaster/joint_states
  ik_worker_count: 1
  motion_feedback_timeout_s: 0.3
  motion_feedback_tolerance_rad: 0.12
  motion_require_tf_sync: true
  # Empty on purpose: LeKiwiSystemHardware publishes no joint-current heartbeat
  # (only So101SystemHardware publishes /so101_follower/joint_currents). A
  # non-empty topic makes the motion server's post-motion barrier wait for a
  # heartbeat that never arrives, so every physical MoveToPose /
  # MoveToConfiguration would time out and report EXECUTION_FAILED. LeKiwi read
  # failures already surface as controller errors; no separate heartbeat is
  # needed.
  motion_hardware_feedback_topic: ""

base:
  wheel_joints: ["7", "8", "9"]
  wheel_radius: 0.05
  base_radius: 0.125
  max_wheel_radps: 4.602
  control_frequency: 50.0
  odom_frame: odom
  base_frame: base_link
  publish_tf: true
  navigation_enabled_on_startup: false

capabilities:
  joint.state: {joint_count: 9, rate_hz: 100.0}
  joint.position_stream: {joint_count: 6, rate_hz: 100.0}
  joint.trajectory: {joint_count: 6}
  gripper.1d: {count: 1}
  motion.fk: {ee_link: gripper, endpoints: ['/motion/compute_fk', '/ik_worker_0/motion/compute_fk']}
  motion.ik: {endpoints: ['/motion/compute_ik', '/ik_worker_0/motion/compute_ik']}
  motion.move_to_joint: {}
  motion.move_to_pose: {}
  # Linear limits are what the wheels can realize: max_wheel_radps x
  # wheel_radius over each axis' largest wheel projection (0.2657 / 0.2301 m/s,
  # checked at launch by lekiwi_robot.base_profile).
  base.cmd_vel: {max_vx: 0.26, max_vy: 0.23, max_wz: 1.5, staleness_s: 0.5}
  base.odom: {}
  base.navigation_gate: {}
  runtime.stop: {cancel_bound_s: 1.0, idle_bound_s: 3.0, torque_off_bound_s: 5.0}

# The arm's end-effector pose stream, published by so101_motion's motion
# server (this runtime includes its motion.launch.py for the arm). The
# embodied arm surface requires this public interface; the declaration mirrors
# so101_single_arm's (openspec cleanup-manipulation-so101-providers D5).
interfaces:
  motion.ee_pose:
    capability: motion.fk
    kind: topic
    direction: publish
    endpoint: /robot_status/ee_pose
    message_type: geometry_msgs/msg/PoseStamped
    frame_id: base
    qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}

# D12: the robot's default sensor surface. Deployment robot YAMLs override
# entries by (type, name) via the runtime `peripherals` launch argument.
peripherals:
- type: microphone
  name: respeaker
  driver: alsa
  # Not simulated on the physics platforms (D3): the microphone is a host
  # ALSA device and no simulated audio source stands in for it.
  simulation:
    gazebo:
      enabled: false
    mujoco:
      enabled: false
  params:
    device: hw:0,0
    channels: 6
    sample_rate: 16000
    sample_format: S16LE
    channel_indices:
    - 1
    - 2
    - 3
    - 4
- # The playback device the runtime can launch when a deployment enables it
  # (runtime-peripheral-overrides: the profile owns the driver and defaults;
  # a robot configuration opts in with an enabled-true override entry).
  type: speaker
  name: speaker
  driver: alsa
  enabled: false
  # Not simulated on the physics platforms (D3): same reason as the
  # microphone — a host ALSA device with no simulated stand-in.
  simulation:
    gazebo:
      enabled: false
    mujoco:
      enabled: false
  params:
    device: ""
    channels: 1
    sample_rate: 24000
    sample_format: S16LE
- type: camera
  name: wrist
  driver: realsense
  serial_number: ''
  initial_reset: false
  width: 640
  height: 360
  fps: 30
  pixel_format: bgr8
  align_depth: true
  enable_sync: false
  enable_pointcloud: false
  enable_gyro: false
  enable_accel: false
  streams:
  - color
  - depth
  frame_id: camera_wrist_link
  optical_frame_id: camera_wrist_optical_frame
  transform:
    parent_frame: gripper
    x: -0.029804122099556248
    y: 0.0735813073058911
    z: -0.03849247926512127
    roll: 3.093836835932143
    pitch: 1.0039505938496505
    yaw: -1.6776874824436123
  # MuJoCo camera pose (D1): the plain transform above is the URDF/ROS
  # camera-link convention (optical +X, up +Z) which the gz path renders
  # as-is; MuJoCo cameras look along -Z with up +Y, so the simulator block
  # carries the converted pose (gazebo_rpy_to_mujoco_rpy of the mount, the
  # so101_single_arm wrist-camera pattern). fovy matches the Gazebo-side
  # default (both platforms runtime-owned, tunable).
  simulation:
    mujoco:
      transform:
        parent_frame: gripper
        x: -0.029804122099556248
        y: 0.0735813073058911
        z: -0.03849247926512127
        roll: -0.5663291121384137
        pitch: 0.025636684354011147
        yaw: -0.0665955688299498
      fovy: 60
- type: camera
  name: front
  driver: realsense
  driver_camera_name: front
  serial_number: ''
  width: 640
  height: 480
  fps: 30
  color_format: RGB8
  depth_format: Z16
  streams:
  - color
  - depth
  align_depth: true
  enable_sync: true
  initial_reset: false
  enable_pointcloud: false
  frame_id: camera_front_link
  optical_frame_id: camera_front_optical_frame
  skip_urdf_without_transform: true
  # Not simulated on the physics platforms (D3): the front camera has no
  # measured mount pose (the all-zero transform below is the hardware
  # placeholder) and an unmeasured pose must not be simulated.
  simulation:
    gazebo:
      enabled: false
    mujoco:
      enabled: false
  transform:
    parent_frame: base_link
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
- type: lidar
  name: mid360
  driver: livox_mid360
  frame_id: livox_frame
  lidar_ip: 192.168.1.139
  host_ip: 192.168.1.5
  pointcloud_topic: /livox/lidar
  imu_topic: /livox/imu
  user_config_path: $(find livox_ros_driver2)/config/MID360_config.json
  xfer_format: 1
  multi_topic: 0
  data_src: 0
  publish_freq: 10.0
  output_data_type: 0
  cmdline_input_bd_code: livox0000000001
  respawn: true
  # D13: the public static TF of livox_frame and (below) the simulator
  # attachment pose both default to the mount relative to base_link
  # (lekiwi_mid360_mount.yaml: translation_m [-0.08, 0.0, 0.20],
  # rpy_deg [0.0, 0.0, 90.0]); the profile-equality test pins these copies
  # to lekiwi_lidar and the mount file (the single-source guard).
  transform:
    parent_frame: base_link
    x: -0.08
    y: 0.0
    z: 0.2
    roll: 0.0
    pitch: 0.0
    yaw: 1.5707963267948966
  simulation:
    gazebo:
      transform:
        parent_frame: base_link
        x: -0.08
        y: 0.0
        z: 0.2
        roll: 0.0
        pitch: 0.0
        yaw: 1.5707963267948966
      # Simulated MID-360 sensor parameters (identical to lekiwi_lidar).
      horizontal_samples: 900
      vertical_samples: 32
      vertical_min_deg: -7.0
      vertical_max_deg: 52.0
      range_min: 0.1
      range_max: 40.0
      update_rate: 10.0
      # The MID-360's built-in IMU.
      imu:
        update_rate: 200.0
    mujoco:
      transform:
        parent_frame: base_link
        x: -0.08
        y: 0.0
        z: 0.2
        roll: 0.0
        pitch: 0.0
        yaw: 1.5707963267948966
      horizontal_samples: 360
      vertical_samples: 32
      vertical_min_deg: -7.0
      vertical_max_deg: 52.0
      range_min: 0.1
      range_max: 40.0
      update_rate: 10.0
  scan_converter:
    enabled: true
    queue_size: 1
    pointcloud_topic: /cloud_registered_body
    scan_topic: /scan
    target_frame: body
    transform_tolerance: 0.01
    min_height: -0.05
    max_height: 0.5
    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.00872665
    scan_time: 0.1
    range_min: 0.1
    range_max: 8.0
    use_inf: true
    inf_epsilon: 1.0
    respawn: true

# D12: lidar odometry chain defaults (lekiwi runtime composes fastlio_mapping
# plus the odom bridge; deployment overrides merge on top). sim_params_file
# is the simulation parameter set the physics platforms launch with (D6;
# blind 0.5 m — the stowed arm sits inside it, preflight-measured); the
# hardware file stays params_file. The bridge's body-to-base extrinsic is
# the inverse of the MID-360 mount (lekiwi_mid360_mount.yaml), the same
# mount-derived copy lekiwi_lidar carries (pinned by the equality test).
fast_lio:
  enabled: false
  params_file: $(find lekiwi_robot)/config/fast_lio_mid360.yaml
  sim_params_file: $(find lekiwi_robot)/config/fast_lio_mid360_sim.yaml
  lidar_topic: /livox/lidar
  imu_topic: /livox/imu
  raw_odom_topic: /fast_lio/odometry_raw
  output_topic: /odometry/filtered
  source_odom_frame: camera_init
  source_body_frame: body
  odom_frame: odom
  base_frame: base_link
  body_to_base_translation: [0.0, -0.08, -0.2]
  body_to_base_rotation: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
  publish_tf: true
  planar_output: false
  max_future_skew_sec: 0.1
  respawn: true
