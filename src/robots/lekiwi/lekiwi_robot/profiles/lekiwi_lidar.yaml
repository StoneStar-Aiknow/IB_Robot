# LeKiwi runtime profile (lekiwi_lidar): omni-wheel base only, MID-360 localization.
#
# This is the minimal wheeled surface: no arm, no gripper, no motion services.
# lekiwi_hardware drives only the three wheel servos (base_only_mode_, IDs 7-9
# in wheel/velocity mode), so the arm servos are never opened or configured.
#
# It deliberately differs from the integration prototype's same-named profile,
# which declared all nine joints ("SO-101 arm + omni-wheel base"). The migrated
# application configuration lekiwi_lidar.yaml is base-only, and a profile that
# quietly brought the arm along would claim hardware the deployment does not
# have.

runtime:
  name: lekiwi_robot
  version: 0.1.0

simulated: false
controller_manager: controller_manager
joint_state_topic: /joint_states
joints: ["7", "8", "9"]

description:
  xacro: $(find lekiwi_description)/urdf/lekiwi_assembled.urdf.xacro
  xacro_args:
    use_sim: "false"
    base_only: "true"

hardware:
  port: /dev/ttyACM0
  # Wheel servos run in continuous-rotation mode: no homing offset and no joint
  # limits, so there is no calibration file and no reset pose to restore.

ros2_control:
  controllers_config: $(find lekiwi_hardware)/config/lekiwi_base_controllers.yaml
  broadcasters: [joint_state_broadcaster]
  hardware_components: [RobotSystem]

modes:
  initial: idle
  idle:
    controllers: []
    transitions: [base_navigation]
  base_navigation:
    controllers: [base_velocity_controller]
    allows_base: true
    transitions: [idle]

command_channels:
  - channel: base_cmd_vel
    topic: /cmd_vel
    type: twist
    modes: [base_navigation]
    navigation_gated: true

base:
  wheel_joints: ["7", "8", "9"]
  wheel_radius: 0.05
  base_radius: 0.125
  max_wheel_radps: 4.602
  control_frequency: 50.0
  odom_frame: odom
  base_frame: base_link
  publish_tf: true
  navigation_enabled_on_startup: false

capabilities:
  joint.state: {joint_count: 3, rate_hz: 100.0}
  base.cmd_vel: {max_vx: 0.5, max_vy: 0.5, max_wz: 1.5, staleness_s: 0.5}
  base.odom: {}
  base.navigation_gate: {}
  runtime.stop: {cancel_bound_s: 1.0, idle_bound_s: 3.0, torque_off_bound_s: 5.0}

# D12: the robot's default sensor surface. Deployment robot YAMLs override
# entries by (type, name) via the runtime `peripherals` launch argument.
peripherals:
- type: lidar
  name: mid360
  driver: livox_mid360
  frame_id: livox_frame
  lidar_ip: 192.168.1.139
  host_ip: 192.168.1.5
  pointcloud_topic: /livox/lidar
  imu_topic: /livox/imu
  user_config_path: $(find livox_ros_driver2)/config/MID360_config.json
  xfer_format: 1
  multi_topic: 0
  data_src: 0
  publish_freq: 10.0
  output_data_type: 0
  cmdline_input_bd_code: livox0000000001
  respawn: true
  scan_converter:
    enabled: true
    queue_size: 1
    pointcloud_topic: /cloud_registered_body
    scan_topic: /scan
    target_frame: body
    transform_tolerance: 0.01
    min_height: -0.05
    max_height: 0.5
    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.00872665
    scan_time: 0.1
    range_min: 0.1
    range_max: 8.0
    use_inf: true
    inf_epsilon: 1.0
    respawn: true

# D12: lidar odometry chain defaults (lekiwi runtime composes fastlio_mapping
# plus the odom bridge; deployment overrides merge on top).
fast_lio:
  enabled: false
  params_file: $(find lekiwi_robot)/config/fast_lio_mid360.yaml
  lidar_topic: /livox/lidar
  imu_topic: /livox/imu
  raw_odom_topic: /fast_lio/odometry_raw
  output_topic: /odometry/filtered
  source_odom_frame: camera_init
  source_body_frame: body
  odom_frame: odom
  base_frame: base_link
  publish_tf: true
  planar_output: false
  max_future_skew_sec: 0.1
  respawn: true
