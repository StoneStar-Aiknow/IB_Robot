runtime:
  name: aimdk_robot
  version: 0.1.0
  type: x2_ultra_omnihand
use_sim: false
joint_state_topic: /joint_states
conformance:
  start_positions:
    left_shoulder_pitch_joint: 0.366
    left_shoulder_roll_joint: -0.038
    left_shoulder_yaw_joint: -0.008
    left_elbow_joint: -1.164
    left_wrist_yaw_joint: 0.003
    left_wrist_pitch_joint: 0.007
    left_wrist_roll_joint: -0.001
    right_shoulder_pitch_joint: 0.364
    right_shoulder_roll_joint: 0.026
    right_shoulder_yaw_joint: 0.019
    right_elbow_joint: -1.175
    right_wrist_yaw_joint: 0.005
    right_wrist_pitch_joint: 0.007
    right_wrist_roll_joint: -0.003
joints:
- left_shoulder_pitch_joint
- left_shoulder_roll_joint
- left_shoulder_yaw_joint
- left_elbow_joint
- left_wrist_yaw_joint
- left_wrist_pitch_joint
- left_wrist_roll_joint
- right_shoulder_pitch_joint
- right_shoulder_roll_joint
- right_shoulder_yaw_joint
- right_elbow_joint
- right_wrist_yaw_joint
- right_wrist_pitch_joint
- right_wrist_roll_joint
arm_joints:
- left_shoulder_pitch_joint
- left_shoulder_roll_joint
- left_shoulder_yaw_joint
- left_elbow_joint
- left_wrist_yaw_joint
- left_wrist_pitch_joint
- left_wrist_roll_joint
- right_shoulder_pitch_joint
- right_shoulder_roll_joint
- right_shoulder_yaw_joint
- right_elbow_joint
- right_wrist_yaw_joint
- right_wrist_pitch_joint
- right_wrist_roll_joint
gripper_joints: []
modes:
  initial: idle
  idle:
    controllers: []
    transitions:
    - stream
    - policy_stream
    - head
    - locomotion
  stream:
    controllers: []
    allows_stream: true
    allows_trajectory: true
    transitions:
    - idle
    - policy_stream
    - head
    - locomotion
  policy_stream:
    controllers: []
    allows_stream: true
    allows_trajectory: true
    transitions:
    - idle
    - stream
    - head
    - locomotion
  head:
    controllers: []
    allows_stream: true
    transitions:
    - idle
    - stream
    - policy_stream
    - locomotion
  locomotion:
    controllers: []
    allows_stream: true
    allows_base: true
    transitions:
    - idle
    - stream
    - policy_stream
    - head
command_channels:
- channel: arm_stream
  topic: /aimdk/arm/commands
  joints:
  - left_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - left_elbow_joint
  - left_wrist_yaw_joint
  - left_wrist_pitch_joint
  - left_wrist_roll_joint
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_joint
  - right_wrist_yaw_joint
  - right_wrist_pitch_joint
  - right_wrist_roll_joint
  modes:
  - stream
  - policy_stream
- channel: hand_stream
  topic: /aimdk/hand/joint_commands
  joints:
  - left_thumb_roll
  - left_thumb_abad
  - left_thumb_mcp
  - left_index_abad
  - left_index_pip
  - left_middle_pip
  - left_ring_abad
  - left_ring_pip
  - left_pinky_abad
  - left_pinky_pip
  - right_thumb_roll
  - right_thumb_abad
  - right_thumb_mcp
  - right_index_abad
  - right_index_pip
  - right_middle_pip
  - right_ring_abad
  - right_ring_pip
  - right_pinky_abad
  - right_pinky_pip
  modes:
  - stream
  - policy_stream
- channel: hand_gesture_stream
  topic: /aimdk/hand/gesture_commands
  joints:
  - left_gesture
  - left_open
  - right_gesture
  - right_open
  modes:
  - stream
  - policy_stream
- channel: head_stream
  topic: /aimdk/head/commands
  joints:
  - head_yaw_joint
  - head_pitch_joint
  modes:
  - head
- channel: base_velocity
  topic: /cmd_vel
  type: twist
  modes:
  - locomotion
trajectory_actions:
- /arm_trajectory_controller/follow_joint_trajectory
capabilities:
  joint.state:
    joint_count: 14
    rate_hz: 50.0
  joint.trajectory:
    joint_count: 14
  joint.position_stream:
    joint_count: 14
    rate_hz: 50.0
  base.cmd_vel:
    max_vx: 1.0
    max_vy: 1.0
    max_wz: 1.0
    staleness_s: 0.5
  base.navigation_gate: {}
  motion.named:
    names:
    - wave
    - handshake
    - raise_hand
    - blow_kiss
    - clap
    - short_wave
    - invite
    - self_intro
    - explain
  motion.posture:
    postures:
    - sit_down
    - crouch_down
    - lie_down
    - stand_up
    - ascend_stairs
    - descend_stairs
  perception.camera:
    topics:
    - /aima/hal/sensor/rgbd_head_front/rgb_image
    - /aima/hal/sensor/rgbd_head_front/depth_image
    - /aima/hal/sensor/stereo_head_front_left/rgb_image
    - /aima/hal/sensor/stereo_head_front_right/rgb_image
    - /aima/hal/sensor/rgb_head_rear/rgb_image
    - /aima/hal/sensor/rgbd_head_front/rgb_image/compressed
    - /aima/hal/sensor/stereo_head_front_left/rgb_image/compressed
    - /aima/hal/sensor/stereo_head_front_right/rgb_image/compressed
    - /aima/hal/sensor/rgb_head_rear/rgb_image/compressed
  perception.imu:
    topics:
    - /aima/hal/imu/chest/state
    - /aima/hal/imu/torso/state
    - /aima/hal/sensor/lidar_chest_front/imu
    - /aima/hal/sensor/rgbd_head_front/imu
    - /aima/hal/sensor/stereo_head_front/imu
  perception.touch:
    topics:
    - /aima/hal/sensor/touch_head
    - /aimdk/hand_touch
  localization.pose:
    topics:
    - /localization/pose
    reference_frame: map
  power.state:
    topics:
    - /power_state
  diagnostics.codes:
    topics:
    - /diagnostics
  interaction.tts:
    endpoints:
    - /speech/speak
    priority_levels:
    - background
    - service
    - mission
    - interaction
    - system
    - warning
  interaction.expression:
    endpoints:
    - /expression/play
    priority_levels:
    - background
    - normal
    - foreground
    - over_fault
  interaction.led:
    endpoints:
    - /led/set_pattern
    priority_levels:
    - background
    - normal
    - foreground
  interaction.audio_capture:
    topics:
    - /audio/capture_stamped
    sample_rate_hz: 16000.0
    channels: 6
  interaction.audio_playback:
    endpoints:
    - /audio/play
    sample_rate_hz: 16000.0
    channels: 1
  runtime.status: {}
  runtime.stop:
    cancel_bound_s: 1.0
    idle_bound_s: 3.0
    torque_off_bound_s: 5.0
  hand.multi_joint:
    count: 2
    joints_per_hand: 10
  hand.gesture:
    count: 2
    gestures:
    - open
    - fist
    - pinch
    - point
stop_default_policy: HOLD
teleoperation:
  enabled: false
vendor:
  sdk_version: aimdk v0.0.0-gcdc995c
  docs_version: AimDK_X2 1.1.0
  mc_actions:
    idle: STAND_DEFAULT
    stream: UPPERBODY_REMOTE_SPLIT
    policy_stream: UPPERBODY_REMOTE_SPLIT
    head: HEAD_ONLY
    locomotion: STAND_DEFAULT
  services:
    set_action: /aimdk_5Fmsgs/srv/SetMcAction
    get_action: /aimdk_5Fmsgs/srv/GetMcAction
    set_input_source: /aimdk_5Fmsgs/srv/SetMcInputSource
    get_input_source: /aimdk_5Fmsgs/srv/GetCurrentInputSource
    get_hand_type: /aimdk_5Fmsgs/srv/GetHandType
    set_preset_motion: /aimdk_5Fmsgs/srv/SetMcPresetMotion
    get_preset_motion_state: /aimdk_5Fmsgs/srv/GetMcPresetMotionState
    play_tts: /aimdk_5Fmsgs/srv/PlayTts
    play_emoji: /aimdk_5Fmsgs/srv/PlayEmoji
    set_led: /aimdk_5Fmsgs/srv/SetPmuLed
    request_audio_focus: /aimdk_5Fmsgs/srv/RequestAudioFocus
    abandon_audio_focus: /aimdk_5Fmsgs/srv/AbandonAudioFocus
  topics:
    upper_body_command: /mc/upper_body_command
    locomotion_command: /aima/mc/locomotion/velocity
    mc_state: /aima/mc/common/state
    system_state: /aima/sm/system_state
    alert_codes: /aima/hds/alert_code_list
    diag_codes: /aima/hds/diag_code_list
    power_state: /aima/hal/pmu/state
    processed_audio: /agent/process_audio_output
    audio_capture: /aima/hal/audio/capture
    audio_playback: /aima/hal/audio/playback
    audio_focus_response: /aima/hal/audio/focus_response
    localization_pose: /slam/lidar_odom
    joint_state:
      arm: /aima/hal/joint/arm/state
      head: /aima/hal/joint/head/state
      waist: /aima/hal/joint/waist/state
      leg: /aima/hal/joint/leg/state
    hand_state: /aima/hal/joint/hand/state
    arm_command: /aima/hal/joint/arm/command
  qos:
    processed_audio:
      reliability: best_effort
      durability: volatile
    upper_body_command:
      reliability: best_effort
      durability: volatile
    locomotion_command:
      reliability: best_effort
      durability: volatile
    mc_state:
      reliability: best_effort
      durability: transient_local
    system_state:
      reliability: best_effort
      durability: transient_local
    joint_state:
      reliability: best_effort
      durability: transient_local
    hand_state:
      reliability: best_effort
      durability: transient_local
    arm_command:
      reliability: best_effort
      durability: volatile
    power_state:
      reliability: best_effort
      durability: transient_local
    diag_codes:
      reliability: best_effort
      durability: transient_local
    alert_codes:
      reliability: best_effort
      durability: transient_local
    audio_capture:
      depth: 500
      reliability: best_effort
      durability: volatile
    audio_playback:
      reliability: reliable
      durability: volatile
    audio_playback_monitor:
      reliability: best_effort
      durability: volatile
    audio_focus_response:
      reliability: reliable
      durability: transient_local
    localization_pose:
      reliability: reliable
      durability: volatile
  input_source:
    name: ibrobot.aimdk_robot
    priority: 30
    timeout_ms: 1000
  wake_ack:
    pkg_names:
    - tts
    pair_window_s: 1.5
    token_pattern: ^_[0-9]+_
  command:
    rate_hz: 50.0
    stamp_window_s: 0.2
    clock_skew_limit_s: 0.1
    mode_confirm_timeout_s: 5.0
    stream_staleness_s: 0.5
  feedback:
    staleness_s: 0.5
    required_groups:
    - arm
    - hand
    fault_groups:
    - arm
    - head
  arm:
    limits:
      left_shoulder_pitch_joint:
      - -3.08
      - 2.04
      left_shoulder_roll_joint:
      - -0.061
      - 3.0456
      left_shoulder_yaw_joint:
      - -2.556
      - 2.556
      left_elbow_joint:
      - -2.3556
      - 0.0
      left_wrist_yaw_joint:
      - -2.556
      - 2.556
      left_wrist_pitch_joint:
      - -0.5236
      - 0.5236
      left_wrist_roll_joint:
      - -1.5097
      - 0.724
      right_shoulder_pitch_joint:
      - -3.08
      - 2.04
      right_shoulder_roll_joint:
      - -3.0456
      - 0.061
      right_shoulder_yaw_joint:
      - -2.556
      - 2.556
      right_elbow_joint:
      - -2.3556
      - 0.0
      right_wrist_yaw_joint:
      - -2.556
      - 2.556
      right_wrist_pitch_joint:
      - -0.5236
      - 0.5236
      right_wrist_roll_joint:
      - -0.724
      - 1.5097
  head:
    limits:
      head_yaw_joint: 0.38
      head_pitch_joint: 0.35
  hand:
    touch_topic: /aimdk/hand_touch
    type: dexterous_joint
    sub_mode: 2
    command_min: 0.0
    command_max: 1.0
    gesture_ids:
    - 0
    - 1
    - 2
    - 3
    gesture_names:
      open: 0
      fist: 1
      pinch: 2
      point: 3
  locomotion:
    deadband: 0.005
    min_linear_mps: 0.2
    min_angular_radps: 0.1
    max_linear_mps: 1.0
    max_angular_radps: 1.0
  stop:
    torque_off_policy: soft_estop
    hold_action: ''
    soft_estop_action: DAMPING_DEFAULT
    zero_torque_action: PASSIVE_DEFAULT
  preset_motions:
    wave:
      motion: 1002
      target: right
    handshake:
      motion: 1003
      target: right
    raise_hand:
      motion: 1001
      target: right
    blow_kiss:
      motion: 1004
      target: right
    clap:
      motion: 3017
      area: 11
  postures:
    sit_down: SIT_DOWN_DEFAULT
    crouch_down: CROUCH_DOWN_DEFAULT
    lie_down: LIE_DOWN_DEFAULT
    stand_up: STAND_UP_DEFAULT
    ascend_stairs: ASCEND_STAIRS
    descend_stairs: DESCEND_STAIRS
  posture_poses:
    sit_down: sit
    crouch_down: squat
    lie_down: lie_face_up
    stand_up: stand
  posture_timeout_s: 20.0
  named_motion:
    allowed_modes:
    - idle
    required_action: STAND_DEFAULT
    preset_timeout_s: 30.0
    poll_s: 0.2
    trajectory_modes:
    - stream
    - policy_stream
    trajectory_blend_speed_radps: 0.5
    trajectory_blend_min_s: 1.5
    trajectory_max_speed_radps: 6.0
    trajectory_follow_min_ratio: 0.3
    trajectory_resume_ttl_s: 120.0
    trajectory_hold_lag_s: 0.05
    # Only normal completion of reviewed, empty-hand social recordings. Cancel return remains strict.
    display_completion:
      motions: [short_wave, invite, self_intro, explain, wave, raise_hand, blow_kiss, clap]
      mode: playback_only
    allow_unverified_trajectories: true
    trajectories:
      wave: trajectories/wave.json
      handshake: trajectories/handshake.json
      raise_hand: trajectories/raise_hand.json
      blow_kiss: trajectories/blow_kiss.json
      clap: trajectories/clap.json
      short_wave: trajectories/summit/short_wave/motion.json
      invite: trajectories/summit/invite/motion.json
      self_intro: trajectories/summit/self_intro/motion.json
      explain: trajectories/summit/explain/motion.json
    cancel_return_motions:
    - wave
    - short_wave
    - invite
    - self_intro
    - explain
  expressions:
    blink: 1
    calm: 10
    happy: 90
    very_happy: 100
    sad: 110
    sympathy: 120
    confused: 130
    shocked: 140
    serious: 160
    thinking: 170
    angry: 180
    adore: 200
    charging: 220
  tts:
    domain: ibrobot
  audio:
    capture_topic: /audio/capture_stamped
    info_topic: /audio/info
    play_topic: /audio/play
    playback_channels: 1
    playback_sample_rate: 16000
    playback_sample_format: S16LE
    playback_coding_format: pcm
    focus_priority: 6
    focus_priority_weight: 0
    focus_release_idle_s: 1.0
    focus_buffer_chunks: 50
  slam:
    command_topic: /integrated_command
    maps: {}
  navigation:
    enabled: false
  blocking_system_states:
  - Develop_MC
  - EStop
  - OTA
  - Poweroff
  - Reboot
  compute_units:
    cameras: PC2
    motion_control: PC1
    interaction: PC3
  expert_joint_tier:
    enabled: false
    requires_system_mode: Develop_MC
    command_topics:
      arm: /aima/hal/joint/arm/command
      head: /aima/hal/joint/head/command
      waist: /aima/hal/joint/waist/command
      leg: /aima/hal/joint/leg/command
    gains:
      arm:
        stiffness: 20.0
        damping: 2.0
      head:
        stiffness: 20.0
        damping: 2.0
      waist:
        stiffness: 20.0
        damping: 4.0
      leg:
        stiffness: 40.0
        damping: 4.0
interfaces:
  audio.speech:
    capability: interaction.audio_capture
    kind: topic
    direction: publish
    endpoint: /audio/speech_chunk
    message_type: ibrobot_msgs/msg/SpeechAudioChunk
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 50
  audio.wake_event:
    capability: interaction.audio_capture
    kind: topic
    direction: publish
    endpoint: /audio/wake_event
    message_type: ibrobot_msgs/msg/SpeechWakeEvent
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
  audio.enhanced_capture:
    capability: interaction.audio_capture
    kind: topic
    direction: publish
    endpoint: /audio/enhanced_capture_stamped
    message_type: audio_common_msgs/msg/AudioDataStamped
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
  joint.hand_state:
    capability: hand.multi_joint
    kind: topic
    direction: publish
    endpoint: /aimdk/hand/joint_states
    message_type: sensor_msgs/msg/JointState
    joint_names:
    - L_thumb_roll_joint
    - L_thumb_abad_joint
    - L_thumb_mcp_joint
    - L_index_abad_joint
    - L_index_pip_joint
    - L_middle_pip_joint
    - L_ring_abad_joint
    - L_ring_pip_joint
    - L_pinky_abad_joint
    - L_pinky_pip_joint
    - R_thumb_roll_joint
    - R_thumb_abad_joint
    - R_thumb_mcp_joint
    - R_index_abad_joint
    - R_index_pip_joint
    - R_middle_pip_joint
    - R_ring_abad_joint
    - R_ring_pip_joint
    - R_pinky_abad_joint
    - R_pinky_pip_joint
    units:
      position: rad
      velocity: rad/s
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
  joint.head_state:
    capability: joint.state
    kind: topic
    direction: publish
    endpoint: /aimdk/head_joint_states
    message_type: sensor_msgs/msg/JointState
    joint_names:
    - head_yaw_joint
    - head_pitch_joint
    units:
      position: rad
      velocity: rad/s
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
  joint.body_state:
    capability: joint.state
    kind: topic
    direction: publish
    endpoint: /aimdk/body_joint_states
    message_type: sensor_msgs/msg/JointState
    joint_names:
    - head_yaw_joint
    - head_pitch_joint
    - waist_yaw_joint
    - waist_pitch_joint
    - waist_roll_joint
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    units:
      position: rad
      velocity: rad/s
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
  motion.named:
    capability: motion.named
    kind: action
    direction: serve
    endpoint: /motion/execute_named
    message_type: ibrobot_msgs/action/ExecuteNamedMotion
  speech.speak:
    capability: interaction.tts
    kind: service
    direction: serve
    endpoint: /speech/speak
    message_type: ibrobot_msgs/srv/SpeakText
  expression.play:
    capability: interaction.expression
    kind: service
    direction: serve
    endpoint: /expression/play
    message_type: ibrobot_msgs/srv/PlayExpression
  led.set_pattern:
    capability: interaction.led
    kind: service
    direction: serve
    endpoint: /led/set_pattern
    message_type: ibrobot_msgs/srv/SetLedPattern
  localization.pose:
    capability: localization.pose
    kind: topic
    direction: publish
    endpoint: /localization/pose
    message_type: geometry_msgs/msg/PoseWithCovarianceStamped
    frame_id: map
    units:
      position: m
      orientation: quaternion
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
  power.state:
    capability: power.state
    kind: topic
    direction: publish
    endpoint: /power_state
    message_type: ibrobot_msgs/msg/PowerState
    rate_hz: 1.0
    units:
      battery_voltage: V
      battery_current: A
      battery_temperature: degC
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
  diagnostics.codes:
    capability: diagnostics.codes
    kind: topic
    direction: publish
    endpoint: /diagnostics
    message_type: diagnostic_msgs/msg/DiagnosticArray
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
  audio.capture:
    capability: interaction.audio_capture
    kind: topic
    direction: publish
    endpoint: /audio/capture_stamped
    message_type: audio_common_msgs/msg/AudioDataStamped
    rate_hz: 33.3
    sample_rate_hz: 16000.0
    channels: 6
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
  audio.play:
    capability: interaction.audio_playback
    kind: topic
    direction: subscribe
    endpoint: /audio/play
    message_type: audio_common_msgs/msg/AudioDataStamped
    sample_rate_hz: 16000.0
    channels: 1
    write_chunk_ms: 200
    prebuffer_ms: 1000
    qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 10
  imu.chest:
    capability: perception.imu
    kind: topic
    direction: publish
    endpoint: /aima/hal/imu/chest/state
    message_type: sensor_msgs/msg/Imu
    frame_id: base_link
    rate_hz: 500.0
    qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 10
  imu.torso:
    capability: perception.imu
    kind: topic
    direction: publish
    endpoint: /aima/hal/imu/torso/state
    message_type: sensor_msgs/msg/Imu
    frame_id: base_link
    rate_hz: 500.0
    qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 10
  imu.rgbd_head_front:
    capability: perception.imu
