schema_version: 1
name: celebrate
version: 1.0.0
semantic_level: skill
description:
  summary: Celebrate at observe_table with quick up/down/left/right relative moves.
  category: social_emotion
  when_to_use:
  - celebrate a success
  - show excitement with motion
  - cheer
  do_not_use:
  - condition: just spin cheerfully in place
    instead_use: happy_spin_upright
  - condition: dance rhythmically
    instead_use: dance_basic
  - condition: greet someone
    instead_use: wave_hello
  aliases_zh:
  - 庆祝
  - 庆祝一下
  - 欢呼
  - 太棒了
  aliases_en:
  - celebrate
  - cheer
  - yay
  motion_scope:
  - arm
  anchor_pose: observe_table
  intensity: large
  duration_sec_estimate: 4.0
  requires_motion_params: false
  rule_entry: true
capability:
  schema_version: 1
  summary: Perform a celebratory gesture.
  domain: manipulation
  moves_robot: true
  required_control_mode: moveit_planning
  parameters:
    type: object
    additionalProperties: false
    properties: {}
    required: []
  recovery_policy: never_retry
implementations:
  so101_arm_v1: implementations/so101_arm_v1.yaml
