schema_version: 1
name: open_gripper_skill
version: 1.0.0
semantic_level: atomic_operator
description:
  summary: Open the gripper to its open position.
  category: gripper
  when_to_use:
  - release or open the gripper
  - drop an object
  do_not_use:
  - condition: close or grasp
    instead_use: close_gripper_skill
  aliases_zh:
  - 打开夹爪
  - 张开夹爪
  - 展开夹爪
  - 夹爪打开
  - 夹爪张开
  - 开爪
  aliases_en:
  - open gripper
  - release
  motion_scope:
  - gripper
  anchor_pose: none
  intensity: subtle
  duration_sec_estimate: 1.0
  requires_motion_params: false
capability:
  schema_version: 1
  summary: Open the gripper.
  domain: manipulation
  moves_robot: true
  required_control_mode: moveit_planning
  parameters:
    type: object
    additionalProperties: false
    properties: {}
    required: []
  recovery_policy: never_retry
implementations:
  so101_handeye_realsense_grasp: implementations/so101_handeye_realsense_grasp.yaml
  so101_arm_v1: implementations/so101_arm_v1.yaml
description_variants:
  so101_handeye_realsense_grasp:
    summary: Open the gripper.
    category: gripper
    when_to_use:
    - release an object
    - prepare the gripper for grasping
    motion_scope:
    - arm
    intensity: moderate
